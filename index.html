.2", "name": "En relación con Trabajadores"}, {"code": "8.3", "name": "Medioambiental"}, {"code": "8.4", "name": "Libre Competencia"}, {"code": "8.5", "name": "Otros"}]}, {"code": "9", "name": "Sostenibilidad", "subs": [{"code": "9.1", "name": "Métricas SASB"}, {"code": "9.2", "name": "Verificación Independiente"}]}, {"code": "10", "name": "Hechos Relevantes o Esenciales", "subs": []}, {"code": "11", "name": "Comentarios de Accionistas y Comité de Directores", "subs": []}, {"code": "12", "name": "Informes Financieros", "subs": []}], "DATA": [{"id": "1_1", "node": "1", "sec": "1", "sub": "1", "item": "1", "req": "Se deberá incluir el índice de contenidos, haciendo referencia expresa a los estándares internacionales de reporte que haya tomado como referencia la entidad, de manera que se pueda identificar de manera simple y rápida la página de la memoria en la que se puede obtener la información relacionada con determinado estándar internacional. Por ejemplo, tratándose del estándar GRI, se deberá elaborar el índice en los términos indicados en GRI-102-55. De la misma forma en el índice de contenidos se deberá hacer referencia a la sección de la presente normativa a que está referida la información, por ejemplo, tratándose de la información sobre la brecha salarial por sexo se deberá indicar con el código “5.4.2 Brecha salarial”.", "responsable": "", "area": "", "pagina": "2", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "1 1"}, {"id": "2_1_2_1", "node": "2.1", "sec": "2", "sub": "2.1", "item": "2.1", "req": "Se deberá señalar la misión, visión y el propósito de la entidad, además de sus valores y principios corporativos\nEn particular, deberá señalar si adhiere o no a los Principios Rectores sobre Derechos Humanos y Empresas emanados de las Naciones Unidas, u otro estándar, guía o estándar equivalente.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "5,7,9,10-13", "comentarios": "Aclarar que son Misión, Visión, Propósito y valores del grupo. Y que aplican a AGF", "obligatoriedad": "SI", "intro": false, "numlabel": "2.1 2.1"}, {"id": "2_2_2_2", "node": "2.2", "sec": "2", "sub": "2.2", "item": "2.2", "req": "Se deberá realizar una descripción de la historia de la entidad desde su constitución a la fecha, con énfasis en el último ejercicio anual y en los eventos relevantes para la entidad, ocurridos en dicho ejercicio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "14-15", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.2 2.2"}, {"id": "2_3_1_i", "node": "2.3", "sec": "2", "sub": "2.3.1", "item": "i", "req": "Se deberá mencionar expresamente si la sociedad posee o no un controlador, conforme a las disposiciones contenidas en el Título XV de la Ley Nº18.045.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "16-17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.1 i"}, {"id": "2_3_1_ii", "node": "2.3", "sec": "2", "sub": "2.3.1", "item": "ii", "req": "En caso afirmativo se deberá informar el porcentaje controlado, directa e indirectamente, por el controlador o por cada uno de sus miembros, desglosando dichos porcentajes por series de acciones en caso que corresponda.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.1 ii"}, {"id": "2_3_1_iii", "node": "2.3", "sec": "2", "sub": "2.3.1", "item": "iii", "req": "Adicionalmente, deberá indicarse de manera expresa si los miembros del controlador tienen o no un acuerdo de actuación conjunta y si éste se encuentra o no formalizado. En caso de existir un acuerdo de actuación conjunta formalizado, deberá informar si éste considera o no limitaciones a la libre disposición de las acciones.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.1 iii"}, {"id": "2_3_1_iv", "node": "2.3", "sec": "2", "sub": "2.3.1", "item": "iv", "req": "Se deberá identificar a las personas naturales que están detrás de las personas jurídicas indicadas en el párrafo anterior, mencionando para cada una de ellas: el R.U.T., nombre completo y porcentaje de propiedad en la sociedad controladora, tanto directo como indirecto.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.1 iv"}, {"id": "2_3_2_2_3_2", "node": "2.3", "sec": "2", "sub": "2.3.2", "item": "2.3.2", "req": "Si han ocurrido cambios importantes en la propiedad de la entidad en el último año, deberá indicar cuáles fueron dichos cambios.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.2 2.3.2"}, {"id": "2_3_3_i", "node": "2.3", "sec": "2", "sub": "2.3.3", "item": "i", "req": "Deberá indicarse el R.U.T., nombre completo o razón social, y porcentaje de propiedad de todas las personas naturales o jurídicas, distintas de los controladores, que por sí sola o con otras con que tenga acuerdo de actuación conjunta, pueda designar, a lo menos, un miembro del directorio o administración de la sociedad, o posea un 10% o más del capital o del capital con derecho a voto si se tratare de una sociedad por acciones.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.3 i"}, {"id": "2_3_3_ii", "node": "2.3", "sec": "2", "sub": "2.3.3", "item": "ii", "req": "Las personas naturales que posean menos de un 10% del capital deberán incluirse en la lista cuando, en conjunto con su cónyuge y/o parientes, posean más de dicho porcentaje, ya sea directamente o a través de personas jurídicas. Por parientes se entenderán aquéllos hasta el segundo grado de consanguinidad o afinidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.3 ii"}, {"id": "2_3_3_iii", "node": "2.3", "sec": "2", "sub": "2.3.3", "item": "iii", "req": "En los casos a que se refiere esta sección, si la entidad tuviere varias clases o series de acciones o de participación que otorguen diferentes derechos a sus titulares, deberá hacerse la indicación por clase de acción o participación que posea cada propietario.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "listo", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.3 iii"}, {"id": "2_3_3_iv", "node": "2.3", "sec": "2", "sub": "2.3.3", "item": "iv", "req": "Además, se deberá presentar mediante un gráfico de torta la participación porcentual de los accionistas, agrupados en: i) controlador, ii) accionistas mayoritarios; iii) ADRs u otros certificados emitidos en el extranjero; iv) fondos de pensiones; v) otros fondos; y vi) otros accionistas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.3 iv"}, {"id": "2_3_3_v", "node": "2.3", "sec": "2", "sub": "2.3.3", "item": "v", "req": "La información a que se refiere esta sección deberá presentarse actualizada a la fecha de cierre del ejercicio que comprenda la Memoria.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Declarar la fecha en la memoria 2025", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.3 v"}, {"id": "2_3_4_i", "node": "2.3", "sec": "2", "sub": "2.3.4", "item": "i", "req": "i. Descripción de las series de acciones: En caso de existir series de acciones, deberá describir las características de cada una de ellas y los plazos de vigencia de las preferencias correspondientes.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "No dejamos tan claro que son de serie unica en la memoria 2024", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.4 i"}, {"id": "2_3_4_ii", "node": "2.3", "sec": "2", "sub": "2.3.4", "item": "ii", "req": "ii. Política de dividendos: Se deberá explicar la política de reparto de dividendos y/o utilidades, según corresponda, que pretende seguir la administración de la entidad para los próximos 2 años.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "Se declara que los dividendos son pagados según normativa.", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.4 ii"}, {"id": "2_3_4_iii_a", "node": "2.3", "sec": "2", "sub": "2.3.4", "item": "iii.a", "req": "a. Dividendos: En relación a los dividendos repartidos, si existieren, se deberá indicar el monto pagado por dividendos provisorios y definitivos, y qué parte corresponde a la utilidad del ejercicio y a utilidades acumuladas de ejercicios anteriores. Adicionalmente, se deberá incluir una estadística de los dividendos pagados por acción en los últimos tres años, desglosando la información por series de acciones, en caso que corresponda.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "Se menciona correctamente", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.4 iii.a"}, {"id": "2_3_4_iii_b", "node": "2.3", "sec": "2", "sub": "2.3.4", "item": "iii.b", "req": "b. Transacciones en bolsas: Se deberá identificar las bolsas de valores en las cuales la entidad cotiza sus acciones y presentar, para cada mercado, entendiéndose por tales a las jurisdicciones en las que cotiza sus acciones, un cuadro resumen en el cual se indique para el último año y trimestralmente, información respecto del precio, presencia bursátil, volumen y montos transados.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.4 iii.b"}, {"id": "2_3_4_iii_c", "node": "2.3", "sec": "2", "sub": "2.3.4", "item": "iii.c", "req": "c. Número de accionistas: Se deberá informar el número total de accionistas registrados al término del período anual. En caso que dentro de los accionistas se encuentre una o más empresas de depósito y/o custodia de valores a que se refiere la Ley Nº18.876, la determinación del número total de accionistas se efectuará sumando aquellos que figuren en el registro de accionistas de la sociedad y los que figuren en la lista que las sociedades anónimas deben conformar y mantener de acuerdo al artículo 26 de la referida Ley, para cada uno de los accionistas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "17", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.4 iii.c"}, {"id": "2_3_5_2_3_5", "node": "2.3", "sec": "2", "sub": "2.3.5", "item": "2.3.5", "req": "En esta sección se deberá incorporar información respecto a las características y derechos de otros valores emitidos por la entidad distintos de las acciones a que se refiere la sección 2.3.4 anterior, y que estén vigentes al cierre del ejercicio anual al que está referida la memoria.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Listo", "obligatoriedad": "SI", "intro": false, "numlabel": "2.3.5 2.3.5"}, {"id": "3_1_3_1", "node": "3.1", "sec": "3", "sub": "3.1", "item": "3.1", "req": "Se deberá divulgar la estructura y funcionamiento del gobierno corporativo de la entidad, haciendo referencia a la adopción de buenas prácticas, en caso que corresponda, al menos respecto de las siguientes materias:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.1 3.1"}, {"id": "3_1_i", "node": "3.1", "sec": "3", "sub": "3.1", "item": "i", "req": "i. Cómo la entidad busca garantizar y evalúa el buen funcionamiento de su gobierno corporativo.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "18", "comentarios": "ver posibles updates", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 i"}, {"id": "3_1_ii", "node": "3.1", "sec": "3", "sub": "3.1", "item": "ii", "req": "ii. Cómo la entidad integra un enfoque de sostenibilidad en sus negocios.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Sección de Política de Inversion Responsable. Aun se puede mejorar más en integración, reporting va bien", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 ii"}, {"id": "3_1_iii", "node": "3.1", "sec": "3", "sub": "3.1", "item": "iii", "req": "iii. Cómo la entidad detecta y gestiona los conflictos de interés que enfrenta, las conductas que pudieran afectar la libre competencia y competencia leal, y cómo se previene la corrupción, el lavado de activos y financiamiento del terrorismo.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "18", "comentarios": "Existe una \"Política y procedimientos de la prevencion de Delítos\" y \"Política y Procedimientos anticorrupción y conflicto de interés\". Podemos reportar y resumir parte de estas políticas en el informe.", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 iii"}, {"id": "3_1_iv", "node": "3.1", "sec": "3", "sub": "3.1", "item": "iv", "req": "iv. Cómo la entidad se ocupa y aborda los intereses de sus principales grupos de interés, al menos identificándolos y señalando las actividades de la entidad que tienen un impacto directo en esos grupos.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Se debe detallar un sistema para la identificación de stakeholders y las actividades que los impactan", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 iv"}, {"id": "3_1_v", "node": "3.1", "sec": "3", "sub": "3.1", "item": "v", "req": "v. Cómo la entidad promueve y facilita la innovación, y si destina recursos corporativos en Investigación y Desarrollo.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Se menciona el CRM en la memoria 2025", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 v"}, {"id": "3_1_vi", "node": "3.1", "sec": "3", "sub": "3.1", "item": "vi", "req": "vi. Cómo la entidad detecta y reduce barreras organizacionales, sociales o culturales que pudieren estar inhibiendo la diversidad de capacidades, condiciones, experiencias y visiones que, sin esas barreras, se habría dado naturalmente en la organización.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "aun falta explicar cómo detectamos esas barreras y las reducimos??", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 vi"}, {"id": "3_1_vii", "node": "3.1", "sec": "3", "sub": "3.1", "item": "vii", "req": "vii. Cómo la entidad identifica la diversidad de capacidades, conocimientos, condiciones, experiencias y visiones con que deben contar todos quienes desempeñen funciones en los distintos niveles de la organización, y cuáles son las políticas de contratación a objeto de lograr y preservar esa diversidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "descripciones de cargo en personas", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 vii"}, {"id": "3_1_viii", "node": "3.1", "sec": "3", "sub": "3.1", "item": "viii", "req": "viii. Se deberá presentar un organigrama de la estructura organizacional, el cual deberá ser explícito respecto de las unidades u órganos de dirección y/o liderazgo dentro de la organización, y de las unidades de control interno, gestión de riesgos, desarrollo sostenible o equivalente, y relaciones con los accionistas, inversionistas y medios de prensa, así como todas las que sean relevantes para los negocios de la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "está", "obligatoriedad": "SI", "intro": false, "numlabel": "3.1 viii"}, {"id": "3_2_3_2", "node": "3.2", "sec": "3", "sub": "3.2", "item": "3.2", "req": "Respecto del Directorio u órgano de administración equivalente se deberá reportar:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.2 3.2"}, {"id": "3_2_i", "node": "3.2", "sec": "3", "sub": "3.2", "item": "i", "req": "i. La identificación de cada uno de sus integrantes señalando la fecha de su nombramiento o última reelección, como también de su cesación en el cargo cuando proceda, e incluyendo su profesión u oficio; si detenta la calidad de presidente o vicepresidente; si corresponde a un director independiente o no; y cuando corresponda, si su calidad de director es de titular o de suplente.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "19-20", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 i"}, {"id": "3_2_ii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "ii", "req": "ii. Los ingresos de sus miembros con ocasión de sus labores en el Directorio, identificando el origen de los mismos y presentados en términos comparativos con el ejercicio del año anterior. Para estos efectos, se deberá separar la remuneración distinguiendo si se trata de ingresos fijos (por ejemplo, por dietas de asistencia), de las variables, que pueden provenir de funciones o empleos en la misma entidad distintos del ejercicio de su cargo o por concepto de gastos de representación, viáticos, regalías y, en general, todo otro estipendio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "19", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 ii"}, {"id": "3_2_iii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "iii", "req": "iii. Una descripción de la política que se hubiera implementado para la contratación por parte del Directorio de expertos que lo asesoren en materias contables, tributarias, financieras, legales o de otro tipo. Junto con lo anterior, se deberá reportar el monto total desembolsado por asesorías contratadas por el Directorio. Respecto de los servicios contratados con la firma auditora a cargo de la auditoría de estados financieros, como también con otras entidades, que por su monto se estime que resultan relevantes respecto del presupuesto anual del Directorio, deberá hacerse mención a la identidad de los contratados, el monto pagado y el tipo de servicios contratados. En caso de no ser procedente deberá señalarlo expresamente.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 iii"}, {"id": "3_2_iv", "node": "3.2", "sec": "3", "sub": "3.2", "item": "iv", "req": "iv. Una matriz de conocimientos, habilidades y experiencia de los miembros del Directorio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "REVISAR VICTOR ZERBINO", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 iv"}, {"id": "3_2_v", "node": "3.2", "sec": "3", "sub": "3.2", "item": "v", "req": "v. Una descripción de los procedimientos o mecanismos que se hubieren implementado para la inducción de nuevos integrantes, señalando las materias más relevantes que se ha determinado ellos debieran conocer y comprender.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Se reporta que hay proceso de inducción, sin embargo no hay mecanismos claros dentro de Vantrust", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 v"}, {"id": "3_2_vi", "node": "3.2", "sec": "3", "sub": "3.2", "item": "vi", "req": "vi. La periodicidad con la cual se reúne con las unidades de gestión de riesgo, auditoría interna y responsabilidad social, o bien con las personas responsables de las funciones equivalentes, y con la empresa de auditoría externa a cargo de la auditoría de los estados financieros, señalando las principales temáticas que son abordadas en tales reuniones e indicando si el gerente general u otros ejecutivos principales participan en ellas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "21", "comentarios": "Falta especificar la periodicidad con la que el directorio se reune con la empresa acargo de la auditoria de los EEFF. Y señalar las principales temáticas abordadas y si hay ejecutivos principales presentes", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 vi"}, {"id": "3_2_vii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "vii", "req": "vii. Una descripción respecto a cómo, y con qué periodicidad, se informa de los asuntos relacionados con aspectos de sostenibilidad y si esas materias son incluidas al momento de debatir y adoptar decisiones estratégicas, planes de negocios o presupuestos, entre otros.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Una vez tengamos redactadas la integracion de los aspectos ASG dentro del marco de gobierno corporativo o constitucion, podremos redactar la estrategia de reportabilidad a los directorios. A la fecha de la memoria 2025 solo tenemos lo que ocacionalmente", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 vii"}, {"id": "3_2_viii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "viii", "req": "viii. Si el Directorio en pleno o cualquiera de sus miembros ha realizado durante el año visitas en terreno a las distintas dependencias e instalaciones de la entidad, en caso que la entidad cuente con éstas, para conocer aspectos como: el estado y funcionamiento de esas dependencias e instalaciones; las principales funciones y preocupaciones de quienes se desempeñan en las mismas; las recomendaciones y mejoras que en opinión de los responsables de esas dependencias e instalaciones sería pertinente realizar para mejorar su funcionamiento. Además, deberá informar si el gerente general u otros ejecutivos principales participan de esas actividades.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Necesitamos tener redactado dentro del Marco de gobierno corporativo el reglamento que rige a los directores. El cual debe contener cierto numero de visitas a las instalaciones", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 viii"}, {"id": "3_2_ix", "node": "3.2", "sec": "3", "sub": "3.2", "item": "ix", "req": "ix. Si el Directorio evalúa regularmente su desempeño colectivo y/o individual, además del de sus Comités, indicando los procedimientos que se hubieren implementado para el mejoramiento continuo de su funcionamiento, señalando la periodicidad con la cual se evalúa ese desempeño y se revisan y actualizan esos procedimientos, y refiriéndose en particular a:", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Ahora se define dentro del codigo de buenas prácticas la autoevaluación que lleva a cabo el directorio de la AGF", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 ix"}, {"id": "3_2_ix_a", "node": "3.2", "sec": "3", "sub": "3.2", "item": "ix.a", "req": "a. La detección de aquellas áreas en que sus integrantes pueden capacitarse, fortalecerse y continuar perfeccionándose, señalando las materias que son consideradas como más relevantes para efectos de una continua actualización de conocimientos.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "De la autevaluación se obtienen algunas conclusiones en aspectos de mejora, es nuestra tarea junto al gerente general, trabajarlas con el directorio.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 ix.a"}, {"id": "3_2_ix_b", "node": "3.2", "sec": "3", "sub": "3.2", "item": "ix.b", "req": "b. La detección y reducción barreras organizacionales, sociales o culturales que pudieren estar inhibiendo la natural diversidad de capacidades, visiones, características y condiciones que se habría dado en su composición de no existir esas barreras.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "De la autevaluación se obtienen algunas conclusiones en aspectos de mejora, es nuestra tarea junto al gerente general, trabajarlas con el directorio.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 ix.b"}, {"id": "3_2_ix_c", "node": "3.2", "sec": "3", "sub": "3.2", "item": "ix.c", "req": "c. Si considera la eventual contratación de asesoría de un experto ajeno a la sociedad para la evaluación del desempeño y funcionamiento del directorio, además de la detección e implementación de eventuales mejoras o áreas de fortalecimiento.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Allan debe agregar esto al codigo de buenas prácticas y conversarlo con ivonne para proveedores.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 ix.c"}, {"id": "3_2_x", "node": "3.2", "sec": "3", "sub": "3.2", "item": "x", "req": "x. Sin perjuicio de las obligaciones legales, si contempla expresamente la determinación del número mínimo de reuniones ordinarias, el tiempo promedio mínimo de dedicación presencial y remota a las mismas, y la antelación con la que se debe remitir la citación y los antecedentes necesarios para la adecuada realización de aquéllas, reconociendo las características particulares de la entidad así como también la diversidad de experiencias, condiciones y conocimientos existentes en el Directorio, según la complejidad de las materias a tratar.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "21", "comentarios": "Tenemos la cantidad de reuniones reportadas. Sin embargo, falta el tiempo promedio de duracion PRESENCIAL y REMOTA. Falta, además, saber si existe una Notificacion para la junta Directiva y cuanto tiempo antes se hace. \nRevisar todo esto anterior en el codigo de buenas prácticas", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 x"}, {"id": "3_2_xi", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xi", "req": "xi. Si contempla expresamente el cambio, en el caso que fuere pertinente, de su forma de organización interna y funcionamiento ante situaciones de contingencia o crisis, contando con un plan de continuidad operacional.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Detallar accionar en caso de contigencias o crisis. Mientras tanto, nos piden reportar SI contemplamos el cambio.\nDetallar en codigo de buenas practicas y conversar con loreto", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 xi"}, {"id": "3_2_xii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xii", "req": "xii. Si cuenta con un sistema de información que le permita acceder a cada integrante, de manera segura, remota y permanente, a:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "3.2 xii"}, {"id": "3_2_xii_a", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xii.a", "req": "a. Las actas y documentos tenidos a la vista para cada sesión de Directorio, o equivalente, indicando la extensión temporal del registro histórico de tales actas y documentos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Hoy en dia tenemos un repositorio para directores", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 xii.a"}, {"id": "3_2_xii_b", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xii.b", "req": "b. La minuta o documento que sintetiza todas las materias que se tratarán en cada sesión y los demás antecedentes que se presentarán en la misma o adicionales necesarios para su preparación, todo lo anterior sin perjuicio de las obligaciones legales respecto al plazo de envío del contenido de las citaciones.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Tenemos un repositorio para directores", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 xii.b"}, {"id": "3_2_xii_c", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xii.c", "req": "c. Un sistema o canal de denuncias que se hubiere implementado.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "45", "comentarios": "se menciona que existe el canal de denuncias disponible para Directores", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 xii.c"}, {"id": "3_2_xii_d", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xii.d", "req": "d. Al texto definitivo del acta de cada sesión, indicando el plazo posterior a la respectiva sesión en que esa acta se encuentra disponible para su consulta.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Alfredo comenta que son 15 dias seguidos desde el Directorio", "obligatoriedad": "NO", "intro": false, "numlabel": "3.2 xii.d"}, {"id": "3_2_xiii", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii", "req": "xiii. Respecto a la conformación del Directorio se deberá reportar:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "3.2 xiii"}, {"id": "3_2_xiii_a", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.a", "req": "a. El número total de directores separados por hombres y mujeres, distinguiendo entre directores titulares y suplentes.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "19, 20", "comentarios": "falta hacer la distincion entre los directores titulares y suplentes", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.a"}, {"id": "3_2_xiii_b", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.b", "req": "b. El número de directores por nacionalidad, separados por hombres y mujeres, distinguiendo entre directores titulares y suplentes.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "20", "comentarios": "falta hacer la distincion entre los directores titulares y suplentes", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.b"}, {"id": "3_2_xiii_c", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.c", "req": "c. El número de directores según rango de edad de acuerdo a los rangos contemplados en la sección 5.1.3., separados por hombres y mujeres, distinguiendo entre directores titulares y suplentes.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Basta con hacer la separacion por rango de edad de manera facil", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.c"}, {"id": "3_2_xiii_d", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.d", "req": "d. El número de directores por antigüedad en la organización de acuerdo a los rangos contemplados en la sección 5.1.4., separados por hombres y mujeres, distinguiendo entre directores titulares y suplentes.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Basta con hacer la separacion por antigüedad", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.d"}, {"id": "3_2_xiii_e", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.e", "req": "e. El número de directores en situación de discapacidad, separados por hombres y mujeres, distinguiendo entre directores titulares y suplentes.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Basta con describir que no existen directores con discapacidad", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.e"}, {"id": "3_2_xiii_f", "node": "3.2", "sec": "3", "sub": "3.2", "item": "xiii.f", "req": "f. La brecha salarial por sexo en función de la media y la mediana, en los términos señalados en la sección 5.4.2., en el evento que existan remuneraciones diferenciadas entre directores o que existan regalías, dietas u otro tipo de compensaciones que no resulten aplicables a todos ellos.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "-", "comentarios": "Debemos reportar el sueldo de cada director y calcular la brecha por sexo.", "obligatoriedad": "SI", "intro": false, "numlabel": "3.2 xiii.f"}, {"id": "3_3_3_3", "node": "3.3", "sec": "3", "sub": "3.3", "item": "3.3", "req": "Respecto de cada uno de los comités que se hayan constituido dentro del Directorio, se deberá reportar lo siguiente:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.3 3.3"}, {"id": "3_3_i", "node": "3.3", "sec": "3", "sub": "3.3", "item": "i", "req": "i.Una descripción breve del rol y principales funciones del comité respectivo.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 i"}, {"id": "3_3_ii", "node": "3.3", "sec": "3", "sub": "3.3", "item": "ii", "req": "ii. La identificación de cada uno de sus integrantes durante los 2 últimos ejercicios, indicando quienes detentan o han detentado la calidad de directores independientes.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "21", "comentarios": "Solo hemos identificado el ultimo ejercicio. Para la proxima memoria deberá incluirse el nuevo  y dejar el viejo", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 ii"}, {"id": "3_3_iii", "node": "3.3", "sec": "3", "sub": "3.3", "item": "iii", "req": "iii. En forma comparativa respecto del ejercicio anterior, los ingresos de sus miembros con ocasión de sus labores en el comité correspondiente.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Identificar cuales son las asignaciones por la participacion en cada comité y compararlas con el año anterior", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 iii"}, {"id": "3_3_iv", "node": "3.3", "sec": "3", "sub": "3.3", "item": "iv", "req": "iv. Identificación de las principales actividades que el comité haya desarrollado durante el año. En caso de que se trate del comité a que se refiere el artículo 50 bis de la Ley Nº18.046, además de indicar ese hecho, deberá señalar si el comité ha dado cumplimiento a las obligaciones dispuestas en el citado artículo 50 bis. En el caso que haya debido revisar transacciones de las que trata el Título XVI de la Ley N°18.046, se deberá hacer mención a las mismas. Adicionalmente, deberá presentarse el informe de gestión anual del comité, en que se incluyan sus principales recomendaciones a los accionistas, conforme a la instrucción impartida en el referido artículo.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "-", "comentarios": "En la memoria 2024 está bien explicado pero el proximo año de debe mover de lugar", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 iv"}, {"id": "3_3_v", "node": "3.3", "sec": "3", "sub": "3.3", "item": "v", "req": "v. Las políticas que se hubieren implementado para la contratación de asesorías y los gastos en que haya incurrido el comité respectivo durante el ejercicio por este concepto.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "NO APLICA EN COMITES DEL DIRECTORIO. Sin embargo, tambien se puede incluir esto en el códido de buenas practicas y en la política de proveedores", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 v"}, {"id": "3_3_vi", "node": "3.3", "sec": "3", "sub": "3.3", "item": "vi", "req": "vi. En el caso del Comité de Directores del artículo 50 bis de la Ley N°18.046, o comité que cumpla funciones equivalentes o de gestión de riesgos, la periodicidad con la cual el comité se reúne con las unidades de gestión de riesgo, auditoría interna y responsabilidad social, o bien con las personas responsables de las funciones equivalentes, y con la empresa de auditoría externa a cargo de la auditoría de los estados financieros, señalando las principales temáticas que son abordadas en tales reuniones, e indicando si el gerente general u otros ejecutivos principales participan en ellas.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "-", "comentarios": "Este articulo no aplica a la AGF, sin embargo igualmente se reportan los comités en los que participan directores", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 vi"}, {"id": "3_3_vii", "node": "3.3", "sec": "3", "sub": "3.3", "item": "vii", "req": "vii. La periodicidad con la cual el comité respectivo reporta al Directorio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "21", "comentarios": "No se distingue la periocidad definida en el texto ¿es respecto a las reuniones o cuando se le reporta al directorio? Debemos aclararla", "obligatoriedad": "SI", "intro": false, "numlabel": "3.3 vii"}, {"id": "3_4_3_4", "node": "3.4", "sec": "3", "sub": "3.4", "item": "3.4", "req": "Respecto de los ejecutivos principales se deberá reportar:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.4 3.4"}, {"id": "3_4_i", "node": "3.4", "sec": "3", "sub": "3.4", "item": "i", "req": "i. Cargo, nombre, RUT, profesión y fecha desde la cual desempeña el cargo cada uno de ellos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "21", "comentarios": "listo", "obligatoriedad": "SI", "intro": false, "numlabel": "3.4 i"}, {"id": "3_4_ii", "node": "3.4", "sec": "3", "sub": "3.4", "item": "ii", "req": "ii. De manera agregada y en forma comparativa respecto del ejercicio anterior, el monto de las remuneraciones percibidas por los ejecutivos principales.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "listo", "obligatoriedad": "SI", "intro": false, "numlabel": "3.4 ii"}, {"id": "3_4_iii", "node": "3.4", "sec": "3", "sub": "3.4", "item": "iii", "req": "iii. En caso que la entidad cuente con planes de compensación o beneficios especiales dirigidos a sus ejecutivos principales, dicha retribución deberá separarse en sus componentes fijos y variables, en caso que esos beneficios o compensación tuvieren esos componentes.\nIgualmente, deberá proporcionarse una descripción de dichos planes o beneficios. En caso de tratarse de un plan de compensación que considere pagos basados en opciones sobre acciones de la sociedad, además deberá informar si las opciones se encuentran asignadas o no y en caso que las opciones hayan sido otorgadas, deberá informar el número de ejecutivos principales a los cuales se les otorgaron, porcentaje del total acciones que fueron concedidas a éstos, el porcentaje que queda por asignar a los mismos y, en caso que las opciones hayan sido ejercidas, deberá señalar el número total de acciones concedidas.\nEn caso que la sociedad no cuente con planes de compensación o beneficios especiales dirigidos a sus ejecutivos principales, deberá señalarlo expresamente.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Aclaramos explicitamente que no tenemos planes de conmpensación, y cumplimos pero Aca debemos referirnos a\" Long and short term incentives\" y cuales son sus condiciones. NO ES OBLIGATORIO TENERLOS", "obligatoriedad": "NO", "intro": false, "numlabel": "3.4 iii"}, {"id": "3_4_iv", "node": "3.4", "sec": "3", "sub": "3.4", "item": "iv", "req": "iv. Deberá indicarse el porcentaje de participación en la propiedad del emisor que posean cada uno de los ejecutivos principales y directores de la sociedad directa e indirectamente a través de sociedades que ellos controlen. En caso de no corresponder, deberá señalarlo expresamente. Además, se deberá indicar expresamente si han existido cambios relevantes en esa participación en el último año.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Aca dejamos claro que los ejecutivos no tiene participación accionaria dado que no está jorge valenzuela", "obligatoriedad": "SI", "intro": false, "numlabel": "3.4 iv"}, {"id": "3_5_i", "node": "3.5", "sec": "3", "sub": "3.5", "item": "i", "req": "Se deberá explicitar si la entidad ha adoptado las prácticas de buen gobierno corporativo emanadas de un estándar o código publicado por un organismo público o privado nacional o extranjero, especificando cuál es ese código; si la entidad está adherida formalmente a aquel, e indicando qué principios o prácticas de ese código no son adoptadas, junto con las razones por las que la entidad tomó esa decisión. Por ejemplo, si adhiere a los Principios de Gobierno Corporativo de la OCDE, a un código de buen gobierno promovido por una bolsa local o de otra jurisdicción – indicando cual y bajo qué enfoque, esto es, si es de cumplimiento integral o del tipo “comply or explain”-, o si sólo tiene un código interno.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "22", "comentarios": "No existe una adherencia formal a un codigo tipo ocde u otro pero se siguen algunas recomendaciones de CRS, GAFI, pero no comprometido desde la formalidad. \nEn el codigo de buenas practicas se menciona la guia utilizada por la OCDE.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.5 i"}, {"id": "3_5_ii", "node": "3.5", "sec": "3", "sub": "3.5", "item": "ii", "req": "En caso que corresponda, se deberá indicar la URL donde se encuentre disponible el reporte preparado por la entidad que da cuenta de la adopción del código de buen gobierno corporativo.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "22", "comentarios": "Investigar si las entidades han realizado algun reporte y poner el link. DE NO SER ASI. NO ES OBLIGATORIO QUE LO TENGAMOS", "obligatoriedad": "NO", "intro": false, "numlabel": "3.5 ii"}, {"id": "3_6_3_6", "node": "3.6", "sec": "3", "sub": "3.6", "item": "3.6", "req": "Se deberá describir cómo la entidad integra en sus actividades, un marco de gestión de riesgos y de control interno, en especial, mencionando:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.6 3.6"}, {"id": "3_6_i", "node": "3.6", "sec": "3", "sub": "3.6", "item": "i", "req": "i. Las directrices generales establecidas por el Directorio u órgano de administración en materia de gestión de riesgos y control interno, señalando si para esos efectos ha tomado como guía principios, directrices o recomendaciones nacionales o internacionales, y cuáles son. A modo de ejemplo, las establecidas por COSO (Committee of Sponsoring Organizations of the Treadway Commission), COBIT (Control Objectives for Information and Related Technology) e ISO (International Organization for Standardization), entre otros.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23", "comentarios": "Este año se reporta una mejor gestion de riesgos y clasificación, sin embargo aun no se presenta formalidad en el seguimiento y referencia de algun estandar de gestion de riesgos", "obligatoriedad": "SI", "intro": false, "numlabel": "3.6 i"}, {"id": "3_6_ii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "ii", "req": "ii. Cómo es el proceso de gestión de riesgos implementado en la entidad, indicando cómo se identifican los riesgos, cómo se determinan aquellos relativamente más significativos y cómo se establecen las respuestas o tratamiento de los riesgos. Al referirse al proceso de identificación de riesgos deberá señalar si toma en consideración cambios en la regulación existente, el surgimiento de nueva regulación y si lleva a cabo procedimientos de debida diligencia, especialmente en materia de derechos humanos.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23", "comentarios": "Para el 2024 se presenta un orden mucho más claro del sistema de gestion integrada. Aun falta mas detalle en como se identifican cuales riesgos son mas grandes que otros. Sin embargo, aun falta explicar los posibles impactos y resiliencia de cada uno, de manera mas detallada. Ademas, necesitamos revisar y considerar el COSO la ISO 31000 y TCFD para ESG Risks.", "obligatoriedad": "SI", "intro": false, "numlabel": "3.6 ii"}, {"id": "3_6_iii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "iii", "req": "iii. Cuál es el rol del directorio, u órgano de administración, y alta gerencia en el proceso de gestión de riesgos.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23, 24", "comentarios": "reportado correctamente", "obligatoriedad": "SI", "intro": false, "numlabel": "3.6 iii"}, {"id": "3_6_iv", "node": "3.6", "sec": "3", "sub": "3.6", "item": "iv", "req": "iv. Los riesgos y oportunidades que se hubiere determinado pudieran afectar de manera material el desempeño de sus negocios y su condición financiera, describiendo de forma precisa, clara y resumida sus efectos actuales y previstos, y los planes de acción establecidos para la gestión de los mismos. Esto incluye riesgos de ciberseguridad, operacionales, liquidez, crédito, reputacional, legal, entre otros.”", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23", "comentarios": "no detallamos los efectos actuales y previstos ni los planes de accion", "obligatoriedad": "SI", "intro": false, "numlabel": "3.6 iv"}, {"id": "3_6_iv_esg", "node": "3.6", "sec": "3", "sub": "3.6", "item": "iv-esg", "req": "Complemento voluntario de 3.6.iv. La NCG N°461 no lo exige: VanTrust reporta además los riesgos y oportunidades no tradicionales (ESG) identificados en su estudio de materialidad, con su vínculo a las metas de los ODS.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "23", "comentarios": "-", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 iv", "vol": true, "lbl": "3.6 iv"}, {"id": "3_6_v", "node": "3.6", "sec": "3", "sub": "3.6", "item": "v", "req": "v. Si cuenta con una unidad de gestión de riesgos, específicamente encargada de la detección, cuantificación, monitoreo y comunicación de riesgos.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23", "comentarios": "listo", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 v"}, {"id": "3_6_vi", "node": "3.6", "sec": "3", "sub": "3.6", "item": "vi", "req": "vi. Si cuenta con una unidad de auditoría interna o equivalente, responsable de la verificación de la efectividad y cumplimiento de las políticas, procedimientos, controles y códigos implementados para la gestión de riesgos.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "23", "comentarios": "la auditoria es externalizada", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 vi"}, {"id": "3_6_vii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "vii", "req": "vii. Si cuenta con un Código de Ética o de Conducta o documento equivalente que define los principios y lineamientos que deben guiar el actuar del personal y del Directorio.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "42.43", "comentarios": "", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 vii"}, {"id": "3_6_viii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "viii", "req": "viii. Si cuenta con programas de divulgación de información y capacitación permanente para el personal respecto de las políticas, procedimientos, controles y códigos implementados para la gestión de riesgos.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "29, 43, 112", "comentarios": "Se describen capacitaciones del codigo de etica que aborda ciertos aspectos de la Gestion de riesgos. Pero no se reporta de programas de capacitacion especificamente de gestion de riesgos.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 viii"}, {"id": "3_6_ix", "node": "3.6", "sec": "3", "sub": "3.6", "item": "ix", "req": "ix. Si cuenta con un canal disponible para su personal, accionistas, clientes, proveedores y/o terceros ajenos a la entidad, para la denuncia de eventuales irregularidades o ilícitos, señalando cómo funciona ese canal, en específico si garantiza el anonimato del denunciante, si permite al denunciante conocer el estado de su denuncia, y si es puesto en conocimiento de su personal, accionistas, clientes, proveedores y terceros, tanto mediante capacitaciones como a través del sitio en Internet de la entidad.", "responsable": "Alberto Marquez", "area": "Riesgo", "pagina": "45", "comentarios": "el canal y politica de denuncia solo se menciona en la pag 45. debemos ahondar en el tema.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 ix"}, {"id": "3_6_x", "node": "3.6", "sec": "3", "sub": "3.6", "item": "x", "req": "x. Si cuenta con procedimientos para establecer un Plan de Sucesión, el cual incorpore la identificación entre los trabajadores de la entidad u otros externos, a potenciales reemplazantes del gerente general y demás ejecutivos principales. Deberá señalar si ese Plan de Sucesión permite reemplazar oportunamente al gerente general y demás ejecutivos principales, y traspasar sus funciones e información relevante, ante su ausencia imprevista, minimizando el impacto que ello tendría en la organización.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Ver la posibilidad de integrar un apartado de sucesión en el código de buenas prácticas y conversar con loreto la posibilidad de avanzar con esto", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 x"}, {"id": "3_6_xi", "node": "3.6", "sec": "3", "sub": "3.6", "item": "xi", "req": "xi. Si cuenta con procedimientos para que el Directorio revise las estructuras salariales y políticas de compensación e indemnización del gerente general y demás ejecutivos principales, indicando la periodicidad con la cual se realizan esas revisiones e informando si para esos efectos contempla la asesoría de un tercero ajeno a la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Para que el directorio pueda revisar esto, se debe crear un sistema de reporte.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 xi"}, {"id": "3_6_xii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "xii", "req": "xii. Si cuenta con procedimientos para someter las estructuras salariales y políticas de compensación e indemnización del gerente general y demás ejecutivos principales a aprobación de los accionistas, de manera adicional a la aprobación del Directorio o de uno de sus Comités. Por su parte, si considera la divulgación de esas estructuras y políticas al público en general.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Esto debe estar redactado en un manual o Remuneration Charter.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 xii"}, {"id": "3_6_xiii", "node": "3.6", "sec": "3", "sub": "3.6", "item": "xiii", "req": "xiii. Si cuenta con un modelo implementado de prevención de delitos conforme a lo establecido en la Ley N°20.393 y destinado a evitar la comisión de éstos en la organización.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "18, 44", "comentarios": "correcto", "obligatoriedad": "NO", "intro": false, "numlabel": "3.6 xiii"}, {"id": "3_7_3_7", "node": "3.7", "sec": "3", "sub": "3.7", "item": "3.7", "req": "Se deberá describir cómo se gestiona la relación con los grupos de interés, en especial, reportando:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.7 3.7"}, {"id": "3_7_i", "node": "3.7", "sec": "3", "sub": "3.7", "item": "i", "req": "i. Si cuenta con una unidad de relaciones con los grupos de interés y medios de prensa que permita a éstos aclarar dudas respecto de los principales riesgos, situación financiera, económica o legal y negocios públicamente conocidos de la entidad, indicando los medios por los cuales se puede contactar a esa unidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "36", "comentarios": "en la memoria 2024 se detalla mucho mejor qué áreas interactuan, sin embargo aun falta formalidad interna para esto\n- Que area o por que medio se le aclaran dudas a los clientes, mercado y publico en general respecto a los productos y servicios prestados?", "obligatoriedad": "NO", "intro": false, "numlabel": "3.7 i"}, {"id": "3_7_ii", "node": "3.7", "sec": "3", "sub": "3.7", "item": "ii", "req": "ii. Si cuenta con un procedimiento de mejoramiento continuo para detectar e implementar eventuales mejoras en los procesos de elaboración y difusión de las revelaciones que realiza la entidad al mercado, a objeto que dichas comunicaciones sean de fácil comprensión y provistas oportunamente. Además, deberá referirse a la periodicidad con la cual se llevan a cabo esos procedimientos y si para esos efectos se cuenta con la asesoría de expertos externos a la entidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Dependiendo del departamento competente de comunicaciones debemos reportar por sí o por no de los puntos de mejoras.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.7 ii"}, {"id": "3_7_3_7_2", "node": "3.7", "sec": "3", "sub": "3.7", "item": "3.7", "req": "A su vez, tratándose de sociedades anónimas abiertas, se deberá señalar:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "3.7 3.7"}, {"id": "3_7_iii", "node": "3.7", "sec": "3", "sub": "3.7", "item": "iii", "req": "iii. Si, sin perjuicio de la potestad de la junta de accionistas de elegir a los miembros del directorio, éste ha implementado un procedimiento para informar a los accionistas, con antelación a la junta de accionistas en que se elegirán directores, acerca de la diversidad de capacidades, condiciones, experiencias y visiones que en opinión del Directorio resulta aconsejable tengan quienes formen parte del mismo, para que éste se encuentre en mejores condiciones de velar por el interés social. Así como, antes de la votación correspondiente, la experiencia, profesión u oficio de quienes son candidatos al Directorio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "El procedimiento a presentar es:\n- levantamiento de datos de cada miembro del directorio a traves de una solicitud de CV.\n- Meses antes de la Junta de accionistas, hacer un envío de \"Notice of Shareholder Meeting\" con los puntos a tratar. \n- este trabajo podría estar por parte del Nomination committee, pero aun se debe trabajar mucho en eso.", "obligatoriedad": "NO", "intro": false, "numlabel": "3.7 iii"}, {"id": "3_7_iii_a", "node": "3.7", "sec": "3", "sub": "3.7", "item": "iii.a", "req": "Deberá reportar si en virtud de ese procedimiento cuenta con alguna instancia que tenga como objetivo ayudar a los accionistas en la búsqueda y elección de candidatos al Directorio. A su vez, deberá indicar si esa instancia ha establecido políticas para guiar la conformación de las nóminas que se provea a los accionistas de manera que exista diversidad en sus integrantes. En particular, deberá hacer referencia a si dentro de esas políticas se ha establecido que los integrantes de esa nómina de un mismo sexo no superen 60% del total. En caso de que la entidad no cuente con dicha instancia, ésta no cuente con ese tipo de políticas, o esas políticas tengan un porcentaje de diversidad o inclusión distinta, deberá señalar las razones que lo justifican, especificando cuál es el porcentaje, si fuere el caso", "responsable": "", "area": "", "pagina": "", "comentarios": "No existe politica de directorios. Se esta elaborando una. \nEste trabajo tambien deberia estar a cargo del Nomination committee.\nQuizá esta información tambien deberia incluirse en el código de buenas prácticas", "obligatoriedad": "NO", "intro": false, "numlabel": "3.7 iii.a"}, {"id": "3_7_iv", "node": "3.7", "sec": "3", "sub": "3.7", "item": "iv", "req": "iv. Si cuenta con un mecanismo, sistema o procedimiento que permita a los accionistas participar y ejercer su derecho a voto por medios remotos, en la misma oportunidad que el resto de los accionistas que están físicamente representados en la junta de accionistas, y al público en general informarse en tiempo real de los acuerdos adoptados en tales juntas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "solo decir que el accionista es pato y esto no aplica", "obligatoriedad": "NO", "intro": false, "numlabel": "3.7 iv"}, {"id": "4_1_4_1", "node": "4.1", "sec": "4", "sub": "4.1", "item": "4.1", "req": "Se deberán indicar los horizontes de tiempo de corto, mediano y largo plazo, relevantes para la entidad en consideración a la vida útil de sus activos o infraestructura de la misma", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "En la seccion correspondiente no se detalla cuanto se considera un tiempo de corto, mediano y largo plazo para nuestros activos. Ademas, no explicamos cuales son estos.", "obligatoriedad": "SI", "intro": false, "numlabel": "4.1 4.1"}, {"id": "4_2_i", "node": "4.2", "sec": "4", "sub": "4.2", "item": "i", "req": "Se deberá hacer mención a los objetivos estratégicos de la entidad y describir en términos generales la planificación que se hubiera establecido con el fin de alcanzar dichos objetivos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "26", "comentarios": "Tenemos los objetivos estratégicos del grupo VNT pero faltan los de la AGF", "obligatoriedad": "SI", "intro": false, "numlabel": "4.2 i"}, {"id": "4_2_ii", "node": "4.2", "sec": "4", "sub": "4.2", "item": "ii", "req": "Asimismo, se deberá indicar los compromisos estratégicos que se hubieren adoptado en el marco del cumplimiento de los Objetivos de Desarrollo Sostenible (ODS) de las Naciones Unidas u otros equivalentes. En línea con tales compromisos, se deberá indicar si la entidad cuenta con políticas relativas a la generación de un impacto positivo en distintos objetivos de interés social, “tales como respeto de los derechos \nhumanos y derechos indígenas, protección del patrimonio cultural, desarrollo \neconómico y social, entre otros.”", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "27", "comentarios": "Los ODS estan claros. Ahora necesitamos establecer y reportar las politicas que competen a tales compromisos. Asimismo, la implementacion de ellas.", "obligatoriedad": "SI", "intro": false, "numlabel": "4.2 ii"}, {"id": "4_3_4_3", "node": "4.3", "sec": "4", "sub": "4.3", "item": "4.3", "req": "En el evento que la entidad haya aprobado la implementación de un plan de inversiones, ya sea de corto o largo plazo, se deberán informar aquellas inversiones relevantes asociadas a dicho plan, siempre y cuando éstas no tengan un carácter estratégico que pudiere colocar al emisor en una posición de desventaja frente a sus competidores. \n\nPara lo anterior, deberá considerar a lo menos lo siguiente: el horizonte de tiempo en el cual se materializará el plan de inversiones; una descripción del mismo y el monto total estimado a invertir; y, en caso de planes de inversión en que una parte del mismo se haya materializado, se deberá informar su avance, el monto invertido a la fecha y las fuentes de financiamiento utilizadas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "27", "comentarios": "La Memoria dice que estamos desarrollando un plan de inversiones de corto y mediano plazo alineado con el de largo plazo. \nNecesitamos revisar la estrategia de inversion de largo plazo, para ver como avanzamos con el corto y mediano. Una vez hecho esto, tenemos que reportar las inversiones que son relevantes para el plan (siempre y cuando no nos afecten la competitividad). BENCHMARKING", "obligatoriedad": "NO", "intro": false, "numlabel": "4.3 4.3"}, {"id": "5", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "La información del personal de la entidad a la que se refiere esta sección, deberá considerar todas aquellas personas que a la fecha de reporte presten servicios a la entidad bajo un contrato de trabajo, incluyendo a las personas que presten servicios a la entidad y que formalmente estén contratadas por las empresas del mismo grupo empresarial de ésta. La información deberá ser reportada siguiendo las categorías funcionales que se definen a continuación.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_2", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "La entidad será responsable de organizar la información utilizando las siguientes categorías de funciones, de tal forma que sea pertinente y coherente con el objetivo del reporte.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_3", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "i. Alta Gerencia: esta categoría corresponde a los principales ejecutivos de la entidad, personas a cargo de una gerencia o unidad equivalente, que está compuesta por otras unidades o divisiones (esto es, esa gerencia tiene a su cargo divisiones, departamentos o equivalentes). Esta categoría incluye a la persona a cargo de la gerencia general y demás ejecutivos principales.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_4", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "ii. Gerencia: esta categoría de funciones comprende a aquellas personas a cargo de una gerencia, subgerencia o unidad equivalente, que depende de la alta gerencia y que está compuesta por otras unidades o divisiones, esto es, esa gerencia tiene a su cargo divisiones, departamentos o equivalentes. Esta categoría incluye a aquellas gerencias que en la estructura jerárquica se entienden de segunda o tercera línea.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_5", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "iii. Jefatura: esta categoría de funciones contempla a quienes tienen a su cargo una división o equivalente, conformada por personas, la cual forma parte de una gerencia. Por ejemplo, jefes de unidades, o jefes de áreas. En caso que tenga a cargo otras unidades o departamentos, deben ser incluidos en la categoría Gerencia.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_6", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "iv. Operario: se entenderá comprendido en esta categoría de funciones a todas aquellas personas que realizan trabajos de tipo manual o que requieren de un esfuerzo físico para su ejecución.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_7", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "v. Fuerza de venta: se entenderá comprendido en esta categoría de funciones, a todas aquellas personas que se dedican a la atención de público o venta de productos y servicios al mismo.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_8", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "vi. Administrativo: esta categoría de funciones se referirá a personal que realiza tareas de apoyo a las labores de la unidades o departamentos de las que forman parte, que no esté incluido en las categorías anteriores y que incluirá, pero sin limitarse a ello, a personal de secretaría o asistencia administrativa, entre otros.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_9", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "vii. Auxiliar: se entenderá en esta categoría de funciones a todas aquellas personas que prestan servicios anexos al giro de la entidad, sin una calificación profesional o técnica, lo cual incluirá, pero sin limitarse a ello, a personal encargado de labores de aseo, mantención o despacho de correspondencia.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_10", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "viii. Otros profesionales: se entenderá comprendida en esta categoría de funciones a todas aquellas personas que forman parte de una unidad, división o equivalente de la entidad, y cuya calificación laboral se encuentra respaldada por conocimientos especializados y formalizados por un grado académico entregado por una institución de educación superior, y que no están considerados en los numerales anteriores. Por ejemplo, analistas de estudios, contadores auditores, ingenieros de producto, ingenieros de proyectos, abogados, economistas, arquitectos o médicos.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_11", "node": "5.1", "sec": "5", "sub": "5", "item": "", "req": "ix. Otros técnicos: se entenderá comprendido en esta categoría de funciones a todas aquellas personas que forman parte de una unidad, división o equivalente de la entidad, y cuya calificación se encuentra respaldada por conocimientos especializados y formalizados mediante un título técnico de nivel superior, y que no están considerados en los numerales anteriores. Por ejemplo, técnicos agrícolas, técnicos en enfermería, contador general de nivel superior y técnicos de mantenimiento de maquinaria o vehículos.", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5"}, {"id": "5_1_5_1", "node": "5.1", "sec": "5", "sub": "5.1", "item": "5.1", "req": "-", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5.1 5.1"}, {"id": "5_1_1_5_1_1", "node": "5.1", "sec": "5", "sub": "5.1.1", "item": "5.1.1", "req": "Deberá reportar separado por hombres y mujeres el total de personas por cada tipo de cargo o categoría de funciones.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "28", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.1.1 5.1.1"}, {"id": "5_1_2_5_1_2", "node": "5.1", "sec": "5", "sub": "5.1.2", "item": "5.1.2", "req": "Deberá reportar el número de personas por nacionalidad, separadas por sexo, para cada tipo de cargo o categoría de funciones.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "28", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.1.2 5.1.2"}, {"id": "5_1_3_5_1_3", "node": "5.1", "sec": "5", "sub": "5.1.3", "item": "5.1.3", "req": "Deberá reportar el número de personas por rango de edad, separadas por sexo, para cada tipo de cargo o categoría de funciones, en los rangos: menos de 30 años; entre 30 y 40; entre 41 y 50; entre 51 y 60; entre 61 y 70, y más de 70 años.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "28", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.1.3 5.1.3"}, {"id": "5_1_4_5_1_4", "node": "5.1", "sec": "5", "sub": "5.1.4", "item": "5.1.4", "req": "Deberá reportar el número de personas por antigüedad en la organización, separadas por sexo, para cada tipo de cargo o categoría de funciones, en los rangos: menos de 3 años; entre 3 y 6; más de 6 y menos de 9; entre 9 y 12, y más de 12 años trabajando en la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "28", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.1.4 5.1.4"}, {"id": "5_1_5_5_1_5", "node": "5.1", "sec": "5", "sub": "5.1.5", "item": "5.1.5", "req": "Deberá reportar el número de personas en situación de discapacidad, para cada tipo de cargo o categoría de funciones, distinguiendo entre hombres y mujeres. Para estos efectos se entenderá que una persona en situación de discapacidad es aquella que teniendo una o más deficiencias físicas, mentales, sea por causa psíquica o intelectual, o sensoriales, de carácter temporal o permanente, al interactuar con diversas barreras presentes en el entorno, ve impedida o restringida su participación plena y efectiva en la sociedad, en igualdad de condiciones con las demás.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "28", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.1.5 5.1.5"}, {"id": "5_2_5_2", "node": "5.2", "sec": "5", "sub": "5.2", "item": "5.2", "req": "Deberá informar las personas con contrato a plazo indefinido, a plazo fijo y por obra o faena. Además, las personas que prestan servicios a honorarios. Lo anterior, expresado tanto en número de personas como en porcentaje del total de personal de la entidad que esas personas representan según la modalidad del contrato. Todo ello, separado por sexo.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "29", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.2 5.2"}, {"id": "5_3_5_3", "node": "5.3", "sec": "5", "sub": "5.3", "item": "5.3", "req": "Deberá informar separado por sexo, el número de personas con jornada ordinaria de trabajo, con jornada a tiempo parcial, con teletrabajo parcial, con teletrabajo completo, con pactos de adaptabilidad para trabajadores con 3 responsabilidades familiares y con bandas de horas para personas que tengan al cuidado niños o niñas de hasta 12 años, así como el porcentaje del total de trabajadores de la entidad que representan esas personas para cada una de esas modalidades.”", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "30", "comentarios": "Mover los anexos al cuerpo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.3 5.3"}, {"id": "5_4_5_4", "node": "5.4", "sec": "5", "sub": "5.4", "item": "5.4", "req": "-", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "5.4 5.4"}, {"id": "5_4_1_5_4_1", "node": "5.4", "sec": "5", "sub": "5.4.1", "item": "5.4.1", "req": "La entidad deberá divulgar la existencia de políticas que tuvieren como objetivo velar por una compensación equitativa entre los trabajadores de la entidad, de conformidad con sus roles y responsabilidades, y señalar expresamente si se hubieren definido planes y/o metas para reducir las inequidades que pudieran existir en esa materia. Se deberán presentar las metas que se hubiere autoimpuesto la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "29", "comentarios": "Nos faltan establecer metas.\nSe puede poner hipervinculo de la politica para que sea visible. INVOLUCRAR A LORETO", "obligatoriedad": "SI", "intro": false, "numlabel": "5.4.1 5.4.1"}, {"id": "5_4_2_i", "node": "5.4", "sec": "5", "sub": "5.4.2", "item": "i", "req": "Deberá informar la brecha salarial anual por sexo y para cada categoría de funciones de aquellas definidas al inicio de la sección 5, medida como el porcentaje que el salario bruto de las mujeres representa respecto del salario bruto de los hombres, considerando lo siguiente:", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "108", "comentarios": "brechas del directorio. Se debe aclarar salarios", "obligatoriedad": "SI", "intro": false, "numlabel": "5.4.2 i"}, {"id": "5_4_2_ii", "node": "5.4", "sec": "5", "sub": "5.4.2", "item": "ii", "req": "Media", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "108", "comentarios": "Faltan las brechas por cada categoria de la CMF", "obligatoriedad": "SI", "intro": false, "numlabel": "5.4.2 ii"}, {"id": "5_4_2_iii", "node": "5.4", "sec": "5", "sub": "5.4.2", "item": "iii", "req": "Mediana", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "108", "comentarios": "Faltan las brechas por cada categoria de la CMF", "obligatoriedad": "SI", "intro": false, "numlabel": "5.4.2 iii"}, {"id": "5_5_i", "node": "5.5", "sec": "5", "sub": "5.5", "item": "i", "req": "Deberá divulgar el porcentaje del total de personal que fue capacitado durante el año respecto del protocolo de prevención del acoso sexual, laboral y la violencia en el trabajo y del procedimiento de investigación y sanción al que quedan sometidas dichas conductas que hubieren sido implementados en la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "29", "comentarios": "debemos seguir capacitando", "obligatoriedad": "SI", "intro": false, "numlabel": "5.5 i"}, {"id": "5_5_ii", "node": "5.5", "sec": "5", "sub": "5.5", "item": "ii", "req": "Junto con ello deberá divulgar el número de denuncias de acoso laboral, acoso sexual y violencia en el trabajo, separando las cifras por el sexo de quien presentó la denuncia y distinguiendo aquellas presentadas ante la misma entidad y ante la Dirección del Trabajo u otro organismo equivalente.”", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "29", "comentarios": "Debemos crear una politica de acoso laboral y sexual o mejorar lo que trata en el Codigo de Ética. Una vez hecho esto, si tenemos la firma de todos los empleados respecto al codigo de etica, podemos decir que el 100% fue capacitado", "obligatoriedad": "SI", "intro": false, "numlabel": "5.5 ii"}, {"id": "5_6_5_6", "node": "5.6", "sec": "5", "sub": "5.6", "item": "5.6", "req": "Deberá referirse a las políticas de la entidad sobre seguridad laboral, informando las metas e indicadores de las tasas de accidentabilidad por cada cien trabajadores, tasa de fatalidad cada cien mil trabajadores, tasa de enfermedades profesionales por cada cien trabajadores y el promedio de días perdidos por accidente durante el año.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "109", "comentarios": "Reportamos correctamente las tasas solicitadas. Sin embargo , debemos establecernos metas para mantener estos numeros en cero. TENER EN CUENTA QUE ESTO NO ES TAN MATERIAL PARA LA COMPAÑÍA", "obligatoriedad": "SI", "intro": false, "numlabel": "5.6 5.6"}, {"id": "5_7_i", "node": "5.7", "sec": "5", "sub": "5.7", "item": "i", "req": "Se deberá divulgar si cuenta con una política que establezca un período de descanso, posterior al nacimiento de un hijo o hija, o una vez otorgada judicialmente la tuición o cuidado personal como medida de protección o cuando se otorga el cuidado personal de un menor de edad en un procedimiento de solicitud de adopción, superior al legalmente vigente, señalando el tiempo definido en número de días, y si esa política tiene entre sus objetivos fomentar la corresponsabilidad parental, señalando cómo se incentiva el uso de permisos de postnatal por parte de hombres. Por ejemplo, indicar si la entidad confiere más días que los mínimos establecidos por ley de permiso post natal paternal y, en caso que ello fuere efectivo, indicar ese número de días adicionales.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "29", "comentarios": "La ley no obliga a tener una politica. Solo reportarla en caso de que la tengamos. \nEn un futuro, seria una buena practica tenerla, ojala con un mayor numero de dias a los estipulados por ley.", "obligatoriedad": "NO", "intro": false, "numlabel": "5.7 i"}, {"id": "5_7_ii", "node": "5.7", "sec": "5", "sub": "5.7", "item": "ii", "req": "Junto con ello se deberá divulgar para cada país en que opera la entidad, el porcentaje de personas, separadas por sexo, que hubieren hecho uso de permisos de postnatal, considerando el número total de personas elegibles para hacer uso de tales permisos. Además, se deberá indicar el promedio de días que hubieren sido utilizados durante el año por categoría de funciones. En particular respecto del post natal ejercible por los padres distinguir entre el permiso post natal paternal de 5 días y el parental de 6 semanas (o menos).", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "explicitamente decir que no operamos en mas paises", "obligatoriedad": "SI", "intro": false, "numlabel": "5.7 ii"}, {"id": "5_8_5_8", "node": "5.8", "sec": "5", "sub": "5.8", "item": "5.8", "req": "La entidad deberá informar respecto a la existencia de políticas de capacitación y beneficios a sus trabajadores, incluyendo:", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "Se informa de una politica de capacitacion, pero no se detalla ni donde encontrarla ni sus implicancias..", "obligatoriedad": "SI", "intro": false, "numlabel": "5.8 5.8"}, {"id": "5_8_i", "node": "5.8", "sec": "5", "sub": "5.8", "item": "i", "req": "i. El monto total de recursos monetarios y el porcentaje que éstos representan del ingreso anual total de actividades ordinarias de la entidad (o su equivalente), que se destinó a educación y desarrollo profesional para las personas que trabajan en la entidad.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "debemos calcular los montos en educacion, capacitacion y desarrollo", "obligatoriedad": "SI", "intro": false, "numlabel": "5.8 i"}, {"id": "5_8_ii", "node": "5.8", "sec": "5", "sub": "5.8", "item": "ii", "req": "ii. El número total del personal capacitado y el porcentaje que ese número representa de la dotación total, por sexo y cargo.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "Mismo comentario que el anterior", "obligatoriedad": "SI", "intro": false, "numlabel": "5.8 ii"}, {"id": "5_8_iii", "node": "5.8", "sec": "5", "sub": "5.8", "item": "iii", "req": "iii. El promedio anual de horas de capacitación que el personal destinó, por cuenta de la entidad, a actividades de capacitación, por sexo y categoría de funciones.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "No detallamos las horas o montos destinados a capacitacion por sexo.", "obligatoriedad": "SI", "intro": false, "numlabel": "5.8 iii"}, {"id": "5_8_iv", "node": "5.8", "sec": "5", "sub": "5.8", "item": "iv", "req": "iv. Identificación, en términos generales, de las materias que abordaron esas capacitaciones.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "Se cumple con la ley. Podemos dar mas detalle.", "obligatoriedad": "SI", "intro": false, "numlabel": "5.8 iv"}, {"id": "5_8_v", "node": "5.8", "sec": "5", "sub": "5.8", "item": "v", "req": "Respecto de los beneficios que la entidad otorga al personal, se deberá señalar específicamente qué tipo de beneficios considera, incluyendo beneficios cuantificables monetariamente que correspondan a asignaciones que no forman parte del salario bruto de las personas, tales como seguros de salud o de vida de cargo del empleador. Al referirse a cualquiera de esos beneficios se deberá señalar expresamente si estos dependen del tipo de vínculo laboral, es decir, si la persona está contratada a plazo indefinido, plazo fijo, por obra o faena, o a honorarios.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "31", "comentarios": "Solo falta especificar si estos empleados entrarian en la categoria de Plazo indefinido o no. Consultar si los beneficios cuantificables monetariamente deben ser declarados en pesos o solo ser mencionados.", "obligatoriedad": "SI", "intro": false,
