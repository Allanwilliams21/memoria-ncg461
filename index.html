a organizacional.\nContamos con Descripciones de Cargo para las posiciones existentes a inicios de año. Para las posiciones creadas durante el año, estamos en proceso de elaboración de sus DC. Estos documentos contienen información sobre responsabilidades, competencias técnicas y habilidades, así como los requisitos del rol, permitiendo definir el perfil funcional esperado. Las Descripciones de Cargo se revisan y actualizan anualmente, lo que asegura que reflejen de manera adecuada las necesidades actuales y futuras de la compañía.", "year": 2025, "area": "Gestión de Personas"}, "3.1||viii": {"ans": "La estructura organizacional de la Administradora se presenta en el organigrama de la memoria (pág. 33) y distingue dos tipos de vínculo: las unidades con contrato de la Administradora General de Fondos y las que operan mediante contrato de prestación de servicios con el grupo.\n\nEn la cúspide está el Directorio de Vantrust Capital Administradora General de Fondos S.A. De él dependen directamente la Gerencia General, la unidad de Cumplimiento y Riesgo Operacional y Auditoría Interna: estas dos últimas por prestación de servicios, lo que preserva su independencia de la línea ejecutiva.\n\nBajo la Gerencia General se ordenan once unidades: Riesgo de Crédito, Operaciones, Tecnología y Procesos, Gestión de Personas y Sostenibilidad, Marketing, Clientes y Calidad —las seis por contrato de prestación de servicios— y Mercado Institucional, Contabilidad, Inversiones, Estrategia y Comercial —las cinco con contrato de la Administradora—.\n\nEs decir: de las catorce unidades del organigrama, ocho operan mediante contrato de prestación de servicios con el grupo y seis, incluidos el Directorio y la Gerencia General, con contrato de la Administradora.", "year": 2025, "area": "Gestión de Personas", "pagina": "33"}, "3.2||v": {"ans": "Sugiero contestar esto en base al manual del Directorio que están elaborando", "year": 2024, "area": "Gestión de Personas"}, "3.2||ix": {"ans": "Sugiero contestar esto en base al manual del Directorio que están elaborando", "year": 2024, "area": "Gestión de Personas"}, "3.4||iii": {"ans": "La empresa no cuenta con planes de compensación ni beneficios especiales explusivamente para sus ejecutivos principales.", "year": 2025, "area": "Gestión de Personas"}, "3.6||x": {"ans": "Actualmente no existe un Plan de Sucesión en la empresa.", "year": 2025, "area": "Gestión de Personas"}, "3.6||xi": {"ans": "En Vantrust existe una política de remuneraciones e incentivos aprobada por el directorio de la AGF  la cual marca los lineamientos de las compensaciones para cada colaborador(a), incluyendo el gerente general y los ejecutivos principales. Sin embargo, el directorio de la AGF no participa en la revisión de las estructuras salariales de estos. Vantrust cuenta con estrucuras salariales predefinidas  opr medio de bandas, segun un pool de caracteristicas asociadas al cargo y expertiz. En estos casos, no se ha necesitado una asesoria de terceros y no se prevee una en el corto plazo.", "year": 2025, "area": "Gestión de Personas"}, "5.8||i": {"ans": "La proporción del valor de los recursos monetarios destinados a capacitaciones sobre los ingresos ordinarios de la AGF representa un 6,8%.\n\nEl detalle está en el cuadro de este requerimiento: $30.939.000 destinados a capacitación sobre $457.562.000 de ingresos anuales ordinarios. La política de capacitación que respalda ese gasto se describe en el encabezado de la sección 5.8.", "year": 2025, "area": "Gestión de Personas", "pagina": "80"}, "5.8||ii": {"ans": "Se ha logrado capacitar a cada uno de los colaboradores contratados y que prestan servicio a la Administradora, de acuerdo con el nivel de exigencia, la responsabilidad de su cargo y los objetivos del área y de la compañía. Es decir, la cobertura alcanza al total de la dotación.\n\nEl programa anual de capacitación abarca desde temas normativos y de salud hasta el fortalecimiento de conocimientos técnicos, y se complementa con charlas para potenciar las habilidades de los colaboradores y colaboradoras. Lo que varía entre categorías de funciones no es la cobertura, sino el promedio de horas.", "year": 2025, "area": "Gestión de Personas", "pagina": "80"}, "3.6||i": {"ans": "La gestión de riesgo operacional y control interno en Vantrust Capital AGF se basa en las directrices de las buenas practicas dictadas por los organizamos internacionales como COSO y/o ISO, junto con considerar la normativa vigente y el cumplimiento normativo y legal. Concretamente nuestra Politica de Gestión de Riesgo Operacional se alinea la ISO 31.000:2018 Risk Management y da cumplimiento a la NCG N°507 de la CMF.", "year": 2025, "area": "Riesgo"}, "3.6||ii": {"ans": "El proceso de gestión de riesgo operacional se basa en 5 etapas cíclicas, identificación, medición, control, monitoreo y mejora continua. \nIdentificación es la etapa inicial donde se reconoce y describe el riesgo inherente, se busca identificar los factores de riesgo y la causa raíz. Esta función se realiza en Vantrust Capital AGF en el proceso de actualización de matriz de riesgo de los procesos y mezcla entrevistas con los responsables de procesos y registros estadísticos.\nMedición permite valorar el riesgo, identifcando la probabilidad e impacto, basados en los registros de ocurrencia y valorización del evento. Control permite identificar las medidas que existen para reducir la exposición al riesgo inherente, esto es, controles que permitan evitar la ocurrencia de eventos o mitigantes que bajen el impacto residual del evento. Monitoreo es la etapa de seguimiento y evolución del riesgo, con la finalidad de determinar patrones o desviaciones que requieran un nuevo analisis y tratamiento. Por último, la mejora continua, la cual permite, basados en la información recabada, tomar acción para dar tratamiento a los riesgos.\nContenido en nuestra Politica de Gestión de RIesgo Operacional se define el apetito de riesgo de la organización, el cual determina el nivel máximo de exposición aceptado. Si existen riesgos que superan este umbral, es requerida la generación de tratamiento de riesgo, con el objetivo de bajar esta exposición.\n\nCada ciclo de actualización de la matriz de riesgo recoge el contexto en el cual se está levantando la informacion, esto es, normativas nuevas, normativas derogadas, implementación de leyes y observaciones de los reguladores y auditoría interna.\n\nNo se ha integrado un proceso de debida diligencia pero se evalua integrarlo el año 2026", "year": 2025, "area": "Riesgo"}, "3.6||iii": {"ans": "El rol que mantiene el directorio y la alta administración en el proceso de gestión de riesgos es supervisar que la identificación y evaluación los riesgos estén acordes a las disposiciones contenidas en la política de gestión de riesgo y, por ende, a la normativa vigente. Que aquellos riesgos que estén por sobre el apetito o tolerancia, cuenten con las acciones y compromisos adecuado para tratar ese riesgo, con la finalidad de reducir su exposición. \nTambién tienen un rol de evaluar la suficiencia de recursos con los cuales cuenta la organización para gestionar el riesgo. El área de Riesgo Operacional reporta al Directorio cada 3 meses, informado sobre los avances, compromisos y resultados del plan de trabajo aplicado durante el periodo. Por otra parte existe el Comité de Riesgo Operacional, el cual sesiona mensualmente, participa la alta administración y un Director de la AGF", "year": 2025, "area": "Riesgo"}, "3.6||iv": {"ans": "Todo riesgo que no se tiene conocimiento de su existencia o conociendose no se implementen medidas para evitar y/o abordar su materialización puede afectar el desempeño del negocio de la organización. Es por este motivo que toma tanta relevancia la existencia de una gestión de riesgo, que identifique los nuevos riesgos los gestione a conciencia. \nDurante el 2025 está en desarrollo una nueva matriz de riesgo, con cambios metodologicos que permite una mejor analisis de los riesgos, desglose de los controles y parametrización de tratamientos. Con el objetivo de depurar la información de los procesos para llegar a al causa raíz de los distintos eventos y dar un tratamiento adecuado. Todo evento tiene medidas correctivas inmediatas y mejoras, las cuales, durante este año se han monitoreado en un panel de seguimiento para mantener el seguimiento y evaluar el riesgo una vez implementada la mejora.\n\nDada la naturaleza de los fondos que gestiona Vantrust Administradora General de Fondos, a continuación, se exponen los principales riesgos identificados:\nRIESGO DE MERCADO\nSon aquellas pérdidas financieras que pudiesen afectar a los fondos que se administran por cambios exógenos a la administración, tales como variaciones en la tasa de interés, tipo de cambio o precios de mercado. Para gestionar lo anterior se consideran controles que expone el reglamento interno de cada fondo, con el fin de mitigar estos cambios. \nRIESGO DE LIQUIDEZ\nSe entiende como la posibilidad de incumplir con la obligación con sus aportantes, por no contar con los fondos suficientes o en la oportunidad requerida. Para administrar este riesgo cada fondo tiene políticas específicas en su reglamento interno, así también y como mitigante adicional la Administradora tiene un seguro contratado, según lo establece la ley única de fondos. \nRIESGO DE CRÉDITO\nConsidera la posibilidad de incumplimiento de un emisor o contraparte que impacte a los aportantes. En tal sentido, la Administradora mantiene controles para mitigar este tipo de riesgos y, si se materializa, mantiene un seguro contratado de administración de fondos de inversión, según establece la ley única de fondos. \nRIESGO JURÍDICO\nConsidera la posibilidad de sufrir pérdidas financieras o daño reputacional derivado del incumplimiento o interpretación errónea de leyes, regulaciones, normas internas o contratos aplicables a las operaciones de la Administradora y los fondos que gestiona. Para mitigar este riesgo, la sociedad realiza un seguimiento permanente del marco normativo vigente, contando con asesoría legal especializada y manteniendo procedimientos actualizados de cumplimiento regulatorio. Este tipo de riesgo además incluye la filtración y/o el uso inadecuado de la información privilegiada y confidencial, las potenciales pérdidas producto de incumplimientos normativos o de las exigencias de los reguladores como así también el resultado adverso de un procedimiento legal o arbitraje que involucre a un partícipe o aportante perjudicado.\nRIESGO OPERACIONAL\nConsidera las fallas o falta de adecuación de procesos, ya sea que se materialicen por factores internos o externos, que pudiesen generar proveedores o personas y que pudiesen tener como consecuencia pérdidas para los fondos o la Administradora. Para mitigar este riesgo, se han enfocado los esfuerzos en mejorar el ambiente de control de los procesos de negocio involucrados, esto conlleva un proceso de levantamiento, análisis, revisión y propuesta de mejora al diseño de los controles, buscando aumentar su eficiencia para reducir la ocurrencia del riesgo o generar mitigadores para reducir el potencial impacto del riesgo.", "year": 2025, "area": "Riesgo"}, "3.6||v": {"ans": "Vantrust Capital AGF tiene el área de Riesgo Operacional y Control Interno, compuesta por 2 personas, dentro de la Gerencia de Compliance y Riesgo Operacional. Donde la misión del área es ser la 2da linea de defensa, identificar los riesgos operacionales del negocio y gestionar que estos riesgos con el fin de disminuir la exposición de la Administradora. Esta gestión se realiza en base al sistema de gestion de riesgos operacionales, dando enfasis en la generación de cultura de riesgo en la 1era linea de defensa.", "year": 2025, "area": "Riesgo"}, "3.6||vi": {"ans": "Vantrust Capital AGF cuenta con una unidad de Auditoría Interna cuya misión, en su rol como tercera línea de defensa, es verificar que los negocios operen conforme a la normativa y a las políticas vigentes. Asimismo, esta unidad revisa que la segunda línea de defensa —correspondiente a las áreas de gestión de riesgos— aplique adecuadamente sus políticas y cumpla con la normativa aplicable.\n\nEsta área reporta trimestralmente al Directorio y realiza el seguimiento mensual de los planes de acción de auditoría en el Comité de Riesgo Operacional.", "year": 2025, "area": "Riesgo"}, "3.6||vii": {"ans": "La administradora cuenta con un código de ética, el cual es presentado a lo menos 1 vez al año al Directorio, quienes tienen la responsabilidad de aprobar y velar que éste código contemple los principales valores que la organizacion exige y aplica. \nPara generar cultura sobre estos valores, la organizacion cuenta con un curso anual obligatorio sobre esta tematica y genera con regularidad comunicados tendientes a reforzar situaciones puntuales y explicar cómo debe ser abordadas aplicando el código de ética vigente.", "year": 2025, "area": "Riesgo"}, "3.6||viii": {"ans": "La organización mantiene un plan de capacitación, qué es de carácter obligatorio para los colaboradores y el Directorio, en el cual se presentan distintas cápsulas o cursos enfocados en distintos tipos de riesgos, segmentados por especificidad. Por otro lado, se generan comunicados semanales, que son enviados a la organización informando y reforzando pequeños conceptos que ayudan a la concientización del personal y del Directorio.\n\nEste plan aborda las temáticas de riesgo operacional, riesgo crédito, ciberseguridad, cumplimiento normativo, entre otros, y permiten que los colaboradores puedan tener acceso a información actualizada sobre los distintos riesgos y cómo estos van evolucionando con el pasar del tiempo y pueden afectar a sus labores diarias en la organización.", "year": 2025, "area": "Riesgo"}, "3.1||ii": {"ans": "Dentro de los compromisos internos para seguir integrando aspectos ASG a nuestras actividades, durante el 2024, el directorio de la Administradora revisó y aprobó la actualización de la Política de Inversión Responsable del grupo Vantrust Capital. Esta alinea a toda la empresa y a la AGF con los principios de sostenibilidad y responsabilidad social definidos por el PRI, mientras seguimos siendo competitivos en el mercado. La política define un primer marco de acción para integrar estos aspectos ASG, como también explica la estructura de gobernanza interna para una correcta implementación. Dentro de la misma estructura, se puede identificar al directorio de cada vehículo como el máximo organismo de aprobación.  Además, el área de sostenibilidad, como actor esencial en la estructura e implementación de la incorporación de factores ASG, es la responsable de entregar información pertinente con actualizaciones y tendencias ASG en el panorama macroeconómico a los respectivos comités, y de ofrecer información detallada sobre emisores específicos que se consideren para inversiones presentes o futuras. Nuestra política se encuentra actualizada y públicamente disponible en el sitio web del grupo Vantrust Capital para todos/as.", "year": 2024, "area": "Sostenibilidad"}, "3.1||iv": {"ans": "La Administradora aborda los intereses de sus grupos de interés a través del proceso de materialidad y de canales de relación permanentes con cada uno de ellos.\n\nDurante 2025 el grupo Vantrust Capital llevó a cabo su segundo proceso de materialidad, consolidando el trabajo iniciado el año anterior a partir de los aprendizajes obtenidos y del fortalecimiento del diálogo con sus grupos de interés. El ejercicio alcanzó cerca de 200 respuestas de distintos stakeholders. Se contemplaron como grupos de interés a los clientes, los colaboradores, los directores, las entidades reguladoras, los proveedores, los medios de comunicación, las empresas financiadas y la comunidad, a quienes se les consultó qué tan importante es para ellos que Vantrust gestione correctamente cada tema. El resultado priorizado orienta las metas y líneas de acción de sostenibilidad.\n\nEn la relación cotidiana: los accionistas cuentan con una Política de Elección de Directores y con medios para participar remotamente de las juntas; cada cliente tiene un ejecutivo asignado y canales electrónico, presencial y telefónico; los aportantes de los fondos disponen de las Asambleas de Aportantes y del Comité de Vigilancia; los proveedores se rigen por la Política de Gestión de Riesgos de Proveedores 2025; y la relación con la comunidad se gestiona desde la gerencia de relaciones comunitarias y DEI.", "year": 2024, "area": "Sostenibilidad", "pagina": "54-59"}, "3.2||vii": {"ans": "SOSTENIBILIDAD\nBimensual\nParticipantes: Directora ejecutiva, directora AGF, gerente general AGF, Gerente de Estrategia y sostenibilidad, gerente de compliance y riesgo operacional, gerente de clientes y calidad, gerente gestión de personas, analista desarrollador de contenido, especialista de Sostenibilidad, Gerente de Riesgo.\nRol: Es el primer órgano de revisión y discusión en avances de sostenibilidad dentro de Vantrust. Supervisa el cumplimiento normativo en materia de sostenibilidad. Genera feedbacks respecto de convenios y alianzas estratégicas para cumplir con los acuerdos.", "year": 2024, "area": "Sostenibilidad"}, "3.2||xiii.a": {"ans": "El Directorio está compuesto en un 100% por directores independientes y cuenta con representación en diversos comités estratégicos para garantizar la correcta supervisión de las operaciones.\n\nAl cierre del ejercicio 2025 estaba integrado por cuatro directores titulares: una mujer, Gloria Maldonado Figueroa, incorporada el 29 de abril de 2025, y tres hombres, Jorge Uauy Salvador (Presidente), Alejandro Gómez Saba y Germán Barbosa Rebolledo. No hay directores suplentes.\n\nDurante el ejercicio el Directorio tuvo cinco integrantes, porque Liliana Manns Gantz presentó su renuncia el 26 de mayo de 2025 y Gloria Maldonado Figueroa asumió en su reemplazo.", "year": 2024, "area": "Sostenibilidad", "pagina": "34-36"}, "4.2||ii": {"ans": "Dentro de esta misma línea, es que para el 2024 confirmamos nuestro compromiso con 6 de los 17 Objetivos de Desarrollo Sostenible (ODS) de la ONU, los cuales tienen directa consonancia con nuestros objetivos estratégicos. Además, para que nuestro compromiso con la sostenibilidad sea demostrable, por tercer año consecutivo somos signatarios de los Principios para la Inversión Responsable (PRI por sus siglas en inglés). El propósito de este acuerdo es tener incorporados los factores ASG (Ambiente, Social y Gobernanza) en nuestras inversiones y procesos de decisiones, buscando, así, posicionarnos como agentes de cambio en el sector financiero. \n\nCONTEMPLAR TEXTO DE UN POCO MAS DE MEDIA PLANA PARA ESTRATEGIA DE SOSTENIBILIDAD QUE REDACTARÁ Allan \n\nDentro de nuestros compromisos para seguir integrando aspectos ASG en nuestras actividades, durante 2024 el directorio de la Administradora revisó y aprobó nuevamente la Política de Inversión Responsable del grupo Vantrust Capital. Esta política alinea a todo el grupo empresarial y a la AGF con los principios de sostenibilidad y responsabilidad social definidos por el PRI, garantizando al mismo tiempo nuestra competitividad en el mercado.\nComo toda política, define el marco de acción para la integración de criterios ASG y establece una estructura de gobernanza interna para su correcta implementación. Dentro de esta estructura, el directorio de cada vehículo de inversión es el máximo organismo de aprobación. El área de sostenibilidad, como actor clave en su implementación, tiene la responsabilidad de proporcionar información relevante sobre actualizaciones y tendencias en el panorama macro y microeconómico a los respectivos comités, además de entregar análisis detallados sobre emisores considerados en inversiones actuales y futuras.\nNuestra política se encuentra actualizada y está disponible públicamente en el sitio web del grupo Vantrust Capital para su consulta.", "year": 2024, "area": "Sostenibilidad"}, "6.3||6.3": {"ans": "En el proceso de materialidad se contemplaron como grupos de interés a los clientes, los colaboradores, los directores, las entidades reguladoras, los proveedores, los medios de comunicación, las empresas financiadas y la comunidad. A cada uno se le consultó qué tan importante es para ellos que Vantrust gestione correctamente cada tema, y con las respuestas se ordenó la lista de temas por prioridad.\n\nEstos son los grupos de interés porque de ellos depende, o sobre ellos impacta, el negocio de la Administradora: los clientes y aportantes aportan los recursos que se gestionan; los colaboradores ejecutan la operación; los directores definen la estrategia y supervisan los riesgos; los reguladores fijan el marco en que se opera; los proveedores sostienen la plataforma tecnológica y de servicios; los medios median en la reputación; las empresas financiadas reciben el capital y son evaluadas en su desempeño ESG; y la comunidad es el entorno en que la Compañía opera.\n\nA nivel gremial, la Compañía adhiere al Acuerdo Verde del Ministerio de Hacienda, integra el directorio del capítulo chileno del GSG (Global Steering Group) y participa en la asociación gremial de administradoras de fondos de inversión.", "year": 2024, "area": "Sostenibilidad", "pagina": "57"}, "9.2||FN-AC-410a.1": {"ans": "Durante 2024, el directorio de Vantrust Capital AGF aprobó una metodología de evaluación ESG para los activos incluidos en los fondos actuales y potenciales de la Administradora. Esta metodología mide el grado en que las entidades gestionan su exposición y manejo de factores ESG, relevantes tanto para ellas como para sus stakeholders, considerando su capacidad para mitigar riesgos y generar valor sostenible.\n\nLa metodología implementada permite identificar riesgos y oportunidades ESG, ofreciendo una visión integral del impacto en los stakeholders, el negocio, la sociedad y el medio ambiente. Con este enfoque, Vantrust Capital AGF avanzó significativamente en la implementación de su primer screening ESG, cubriendo 9 de los 11 fondos bajo gestión, lo que representa un 82% del total de activos bajo administración (AUM).\n\nEl screening aplicado se basa en las definiciones del PRI (Principles for Responsible Investment). Para los fondos con activos incluidos y transados en bolsa, se empleó un screening positivo, mientras que para los fondos con activos no transados, se utilizó un screening normativo (\"norm-based screening\"). Este avance refuerza el compromiso de Vantrust Capital AGF con la integración de factores ESG en la gestión de activos, fomentando una sostenibilidad a mediano y largo plazo.\n\nEste proceso incluye distintas etapas. La comunicación con la compañía, cuando corresponda, para solicitar información ESG, involucra las áreas de sostenibilidad y riesgo de crédito. Posteriormente, se evalúa la información solicitada junto con datos disponibles públicamente en el mercado, proceso liderado por el área de sostenibilidad. Los resultados de esta evaluación se presentan en comités, como el de Inversiones y/o de Riesgo, donde se toman decisiones en su instancia de aprobación. Finalmente, se realiza un seguimiento continuo del desempeño ESG de la empresa, donde sostenibilidad revisa periódicamente la existencia de controversias que puedan afectar el desempeño ESG de la compañía y, en consecuencia, el retorno presupuestado.", "year": 2024, "area": "Sostenibilidad"}, "9.2||FN-AC-410a.2": {"ans": "Durante 2025 el Directorio de la Administradora revisó y aprobó nuevamente la Política de Inversión Responsable del grupo Vantrust Capital, que alinea al grupo y a la AGF con los principios de sostenibilidad y responsabilidad social definidos por el PRI. La política define el marco de acción para la integración de criterios ESG y establece una estructura de gobernanza interna para su implementación: el directorio de cada vehículo de inversión es el máximo organismo de aprobación, y el área de sostenibilidad entrega a los comités información sobre actualizaciones y tendencias del panorama macro y microeconómico, además de análisis de los emisores considerados en inversiones actuales y futuras. La política está disponible públicamente en el sitio web del grupo.\n\nEn 2024 el Directorio aprobó una metodología de evaluación ESG para los activos de los fondos actuales y potenciales, que mide el grado en que las entidades gestionan su exposición y manejo de factores ESG, recopilando información cualitativa y cuantitativa de los temas materiales de cada industria y generando un puntaje de desempeño ESG. Está diseñada para empresas de todos los tamaños, transen o no en bolsa.\n\nEn 2025 se siguió evaluando los fondos, cubriendo 11 de los 12 fondos bajo gestión, lo que representa un 97% del total de activos bajo administración. El screening se basa en las definiciones del PRI: positivo para los fondos con activos transados en bolsa y normativo («norm-based screening») para los no transados.\n\nEl proceso de evaluación contempla la comunicación con la compañía para solicitar información ESG —con participación de sostenibilidad y riesgo de crédito—, la evaluación de esa información junto con datos públicos de mercado liderada por sostenibilidad, la presentación de los resultados en los comités de Inversiones y/o de Riesgo, donde se toman las decisiones, y el seguimiento continuo del desempeño ESG, revisando periódicamente la existencia de controversias que puedan afectarlo.", "year": 2023, "area": "Sostenibilidad", "pagina": "26-27"}, "3.6||3.6": {"ans": "La actividad de la Administradora considera la exposición a distintos riesgos, tanto a nivel de la AGF como de los fondos administrados. Para gestionarlos, la organización cuenta con políticas, comités y reportes periódicos al Directorio, orientados a la mejora continua y al fortalecimiento del control interno.\n\nLa gestión de riesgo operacional y control interno se basa en directrices y buenas prácticas internacionales, tales como COSO y estándares ISO. Concretamente, la Política de Gestión de Riesgo Operacional se alinea con ISO 31000:2018 (Risk Management) y da cumplimiento a la NCG N° 507 de la CMF. Esa política define además el apetito de riesgo de la organización, es decir el nivel máximo de exposición aceptado: si existen riesgos que superan ese umbral, se requiere generar tratamientos para reducir la exposición.\n\nEl proceso se organiza en cinco etapas cíclicas: identificación, medición, control, monitoreo y mejora continua. La estructura de control se ordena en tres líneas de defensa: los equipos comerciales y de operaciones; el área de Riesgo Operacional y Control Interno, dentro de la Gerencia de Compliance y Riesgo Operacional; y la Unidad de Auditoría Interna, que es un servicio externo y reporta directamente al Directorio cada tres meses.", "year": 2024, "area": "Tecnología de la Información", "pagina": "49-50"}, "3.3||3.3": {"ans": "Con el objetivo de apoyar la gestión y acelerar la toma de decisiones dentro de la Administradora, se establecieron dos comités con participación permanente de directores. Estos directores detentan la cualidad de independientes y la función de los comités es velar por el monitoreo de temas relevantes dentro de la compañía. Los miembros de los comités no reciben remuneración alguna adicional a su salario habitual, y lo mismo aplica para los directores.\n\nLos dos comités con presencia del Directorio son el de Compliance y el de Riesgo, ambos de periodicidad mensual. Además de ellos, el grupo cuenta con comités ejecutivos sin participación permanente de directores —entre ellos el de Sostenibilidad, el de Tecnología y el de Inversiones, este último exclusivo de la Administradora—.\n\nCabe señalar que, aunque la legislación no obliga a la Administradora a contar con un comité del artículo 50 bis de la Ley N° 18.046, varias de las funciones que esa normativa solicita las efectúa el comité de riesgo de crédito, entre ellas la revisión de los informes de los auditores externos, los balances y los demás estados financieros. Ese comité reporta al Directorio mensualmente.", "year": 2024, "area": "Tecnología de la Información", "pagina": "39-43"}, "5.8||5.8": {"ans": "Vantrust Capital cuenta con una política de capacitación que establece el compromiso de la empresa de proporcionar herramientas de capacitación y desarrollo para sus colaboradores y colaboradoras, potenciando sus habilidades y conocimientos técnicos, en el ámbito profesional y personal, con el propósito de asegurar y perfeccionar las competencias de cada integrante de la compañía. El programa anual de capacitación abarca desde temas normativos y de salud hasta el fortalecimiento de conocimientos técnicos, y se complementa con charlas para potenciar las habilidades del equipo. La capacitación en materias de riesgo es obligatoria para colaboradores y Directorio, con cursos segmentados por tipo de riesgo —operacional, crédito, ciberseguridad, cumplimiento normativo— y comunicados periódicos que refuerzan los conceptos relevantes.\n\nEn cuanto a los beneficios, se agrupan en tres tipos. En tiempo: jornada semanal de 39 horas y de 38 en horario de verano, tarde libre por cumpleaños, dos días administrativos al año, dos días de permiso por mudanza y un día libre por fallecimiento de mascota, entre otros. En dinero: seguro de salud y vida, bono de nacimiento, bono por fallecimiento de familiar directo y aguinaldos de fiestas patrias y de navidad. Y de bienestar: chequeo preventivo de salud sin costo. Varios de ellos requieren contrato indefinido, y los aguinaldos exigen un mínimo de seis meses de antigüedad. La memoria advierte que los beneficios pueden cambiar en extensión, monto y condiciones por decisión del empleador, que informará los cambios antes de aplicarlos.", "year": 2025, "area": "Gestión de Personas", "pagina": "80-81, 85"}, "7.1||7.1": {"ans": "La Administradora cuenta con una Política formal de Adquisiciones y Proveedores, que establece que todos los pagos deben efectuarse oportunamente, conforme a las condiciones pactadas contractualmente y, en cualquier caso, dentro de un plazo máximo de 30 días desde la emisión de la factura, sin distinción entre proveedores nacionales o extranjeros. El proceso de pago considera revisiones administrativas y contables, verificación documental y autorizaciones internas previas al desembolso por parte de Tesorería. Su objetivo es asegurar que los bienes y servicios se adquieran de manera centralizada, mediante procesos abiertos, transparentes, oportunos y en condiciones competitivas de mercado, evaluando la relación calidad-costo.\n\nSí distingue entre proveedores críticos y no críticos, y la distinción está definida en la Política de Gestión de Riesgo de Proveedores. Son críticos aquellos cuya interrupción podría afectar la continuidad del negocio, la seguridad de la información, el cumplimiento normativo o la prestación de servicios a clientes; su evaluación considera el impacto en la continuidad operativa, el tipo y sensibilidad de la información que procesan, los efectos sobre los clientes, el riesgo regulatorio asociado y la disponibilidad de alternativas en el mercado. Los proveedores críticos quedan sujetos a controles reforzados, evaluaciones periódicas y cláusulas contractuales especiales en continuidad de negocio, ciberseguridad, auditoría y responsabilidad legal. No críticos son aquellos cuya interrupción no tiene impacto significativo en esos factores. La clasificación se determina mediante un checklist que pondera esos riesgos y asigna el nivel de criticidad.\n\nDurante 2025 se actualizó la Política de Gestión de Riesgos de Proveedores, aprobada por el Directorio, incorporando los Derechos Humanos en la cadena de valor aguas arriba y criterios que garanticen el respeto de los derechos laborales por parte de los futuros proveedores.", "year": 2025, "area": "Clientes, Calidad y Proveedores", "pagina": "61-63"}};
const DIF519=[]; const LAWS={"18.045": {"name": "Ley N°18.045 — Ley de Mercado de Valores", "desc": "Regula el mercado de valores; su Título XV define controlador y grupos empresariales.", "url": "https://www.bcn.cl/leychile/navegar?idNorma=29472"}, "18.046": {"name": "Ley N°18.046 — Ley sobre Sociedades Anónimas", "desc": "Regula las sociedades anónimas, el directorio y el Comité de Directores (Art. 50 bis).", "url": "https://www.bcn.cl/leychile/navegar?idNorma=29473"}, "20.393": {"name": "Ley N°20.393 — Responsabilidad Penal de las Personas Jurídicas", "desc": "Establece el modelo de prevención de delitos (cohecho, lavado de activos, etc.).", "url": "https://www.bcn.cl/leychile/navegar?idNorma=1008668"}, "20.712": {"name": "Ley N°20.712 — Administración de Fondos de Terceros (LUF)", "desc": "Marco legal de las administradoras generales de fondos.", "url": "https://www.bcn.cl/leychile/navegar?idNorma=1057501"}, "19.496": {"name": "Ley N°19.496 — Protección de los Derechos de los Consumidores", "desc": "Regula la relación con los consumidores y las infracciones a sus derechos.", "url": "https://www.bcn.cl/leychile/navegar?idNorma=61438"}, "20.235": {"name": "Ley N°20.235 — Personas Competentes en Recursos y Reservas Mineras", "desc": "Crea la Comisión Calificadora de Competencias en Recursos y Reservas Mineras.", "url": "https://www.bcn.cl/leychile/navegar?idNorma=267933"}, "18.876": {"name": "Ley N°18.876 — Depósito y Custodia de Valores", "desc": "Regula las empresas de depósito y custodia de valores.", "url": "https://www.bcn.cl/leychile/navegar?idNorma=30292"}}; const SUBGROUP={"2.3.1": "Situación de control", "2.3.2": "Cambios en la propiedad o control", "2.3.3": "Identificación de socios o accionistas mayoritarios", "2.3.4": "Acciones, sus características y derechos", "2.3.5": "Otros valores"}; const DIF519NOTE={};
const ODS_MAP={"metas": {"1.1": "De aquí a 2030, erradicar para todas las personas y en todo el mundo la pobreza extrema (actualmente se considera que sufren pobreza extrema las personas que viven con menos de 1,25 dólares de los Estados Unidos al día)", "1.2": "De aquí a 2030, reducir al menos a la mitad la proporción de hombres, mujeres y niños de todas las edades que viven en la pobreza en todas sus dimensiones con arreglo a las definiciones nacionales", "1.3": "Implementar a nivel nacional sistemas y medidas apropiados de protección social para todos, incluidos niveles mínimos, y, de aquí a 2030, lograr una amplia cobertura de las personas pobres y vulnerables", "1.4": "De aquí a 2030, garantizar que todos los hombres y mujeres, en particular los pobres y los vulnerables, tengan los mismos derechos a los recursos económicos y acceso a los servicios básicos, la propiedad y el control de la tierra y otros bienes, la herencia, los recursos naturales, las nuevas tecnologías apropiadas y los servicios financieros, incluida la microfinanciación", "1.5": "De aquí a 2030, fomentar la resiliencia de los pobres y las personas que se encuentran en situaciones de vulnerabilidad y reducir su exposición y vulnerabilidad a los fenómenos extremos relacionados con el clima y otras perturbaciones y desastres económicos, sociales y ambientales", "1.a": "Garantizar una movilización significativa de recursos procedentes de diversas fuentes, incluso mediante la mejora de la cooperación para el desarrollo, a fin de proporcionar medios suficientes y previsibles a los países en desarrollo, en particular los países menos adelantados, para que implementen programas y políticas encaminados a poner fin a la pobreza en todas sus dimensiones", "1.b": "Crear marcos normativos sólidos en los planos nacional, regional e internacional, sobre la base de estrategias de desarrollo en favor de los pobres que tengan en cuenta las cuestiones de género, a fin de apoyar la inversión acelerada en medidas para erradicar la pobreza", "2.1": "De aquí a 2030, poner fin al hambre y asegurar el acceso de todas las personas, en particular los pobres y las personas en situaciones de vulnerabilidad, incluidos los niños menores de 1 año, a una alimentación sana, nutritiva y suficiente durante todo el año", "2.2": "De aquí a 2030, poner fin a todas las formas de malnutrición, incluso logrando, a más tardar en 2025, las metas convenidas internacionalmente sobre el retraso del crecimiento y la emaciación de los niños menores de 5 años, y abordar las necesidades de nutrición de las adolescentes, las mujeres embarazadas y lactantes y las personas de edad", "2.3": "De aquí a 2030, duplicar la productividad agrícola y los ingresos de los productores de alimentos en pequeña escala, en particular las mujeres, los pueblos indígenas, los agricultores familiares, los ganaderos y los pescadores, entre otras cosas mediante un acceso seguro y equitativo a las tierras, a otros recursos e insumos de producción y a los conocimientos, los servicios financieros, los mercados y las oportunidades para añadir valor y obtener empleos no agrícolas", "2.4": "De aquí a 2030, asegurar la sostenibilidad de los sistemas de producción de alimentos y aplicar prácticas agrícolas resilientes que aumenten la productividad y la producción, contribuyan al mantenimiento de los ecosistemas, fortalezcan la capacidad de adaptación al cambio climático, los fenómenos meteorológicos extremos, las sequías, las inundaciones y otros desastres, y mejoren progresivamente la calidad de la tierra y el suelo", "2.5": "De aquí a 2020, mantener la diversidad genética de las semillas, las plantas cultivadas y los animales de granja y domesticados y sus correspondientes especies silvestres, entre otras cosas mediante una buena gestión y diversificación de los bancos de semillas y plantas a nivel nacional, regional e internacional, y promover el acceso a los beneficios que se deriven de la utilización de los recursos genéticos y los conocimientos tradicionales conexos y su distribución justa y equitativa, según lo convenido internacionalmente", "2.a": "Aumentar, incluso mediante una mayor cooperación internacional, las inversiones en infraestructura rural, investigación y servicios de extensión agrícola, desarrollo tecnológico y bancos de genes de plantas y ganado a fin de mejorar la capacidad de producción agropecuaria en los países en desarrollo, particularmente en los países menos adelantados", "2.b": "Corregir y prevenir las restricciones y distorsiones comerciales en los mercados agropecuarios mundiales, incluso mediante la eliminación paralela de todas las formas de subvención a las exportaciones agrícolas y todas las medidas de exportación con efectos equivalentes, de conformidad con el mandato de la Ronda de Doha para el Desarrollo", "2.c": "Adoptar medidas para asegurar el buen funcionamiento de los mercados de productos básicos alimentarios y sus derivados y facilitar el acceso oportuno a la información sobre los mercados, incluso sobre las reservas de alimentos, a fin de ayudar a limitar la extrema volatilidad de los precios de los alimentos", "3.1": "De aquí a 2030, reducir la tasa mundial de mortalidad materna a menos de 70 por cada 100.000 nacidos vivos", "3.2": "De aquí a 2030, poner fin a las muertes evitables de recién nacidos y de niños menores de 5 años, logrando que todos los países intenten reducir la mortalidad neonatal al menos a 12 por cada 1.000 nacidos vivos y la mortalidad de los niños menores de 5 años al menos a 25 por cada 1.000 nacidos vivos", "3.3": "De aquí a 2030, poner fin a las epidemias del SIDA, la tuberculosis, la malaria y las enfermedades tropicales desatendidas y combatir la hepatitis, las enfermedades transmitidas por el agua y otras enfermedades transmisibles", "3.4": "De aquí a 2030, reducir en un tercio la mortalidad prematura por enfermedades no transmisibles mediante su prevención y tratamiento, y promover la salud mental y el bienestar", "3.5": "Fortalecer la prevención y el tratamiento del abuso de sustancias adictivas, incluido el uso indebido de estupefacientes y el consumo nocivo de alcohol", "3.6": "De aquí a 2020, reducir a la mitad el número de muertes y lesiones causadas por accidentes de tráfico en el mundo", "3.7": "De aquí a 2030, garantizar el acceso universal a los servicios de salud sexual y reproductiva, incluidos los de planificación familiar, información y educación, y la integración de la salud reproductiva en las estrategias y los programas nacionales", "3.8": "Lograr la cobertura sanitaria universal, incluida la protección contra los riesgos financieros, el acceso a servicios de salud esenciales de calidad y el acceso a medicamentos y vacunas inocuos, eficaces, asequibles y de calidad para todos", "3.9": "De aquí a 2030, reducir considerablemente el número de muertes y enfermedades causadas por productos químicos peligrosos y por la polución y contaminación del aire, el agua y el suelo", "3.a": "Fortalecer la aplicación del Convenio Marco de la Organización Mundial de la Salud para el Control del Tabaco en todos los países, según proceda", "3.b": "Apoyar las actividades de investigación y desarrollo de vacunas y medicamentos contra las enfermedades transmisibles y no transmisibles que afectan primordialmente a los países en desarrollo y facilitar el acceso a medicamentos y vacunas esenciales asequibles de conformidad con la Declaración relativa al Acuerdo sobre los Aspectos de los Derechos de Propiedad Intelectual Relacionados con el Comercio y la Salud Pública, en la que se afirma el derecho de los países en desarrollo a utilizar al máximo las disposiciones del Acuerdo sobre los Aspectos de los Derechos de Propiedad Intelectual Relacionados con el Comercio respecto a la flexibilidad para proteger la salud pública y, en particular, proporcionar acceso a los medicamentos para todos", "3.c": "Aumentar considerablemente la financiación de la salud y la contratación, el perfeccionamiento, la capacitación y la retención del personal sanitario en los países en desarrollo, especialmente en los países menos adelantados y los pequeños Estados insulares en desarrollo", "3.d": "Reforzar la capacidad de todos los países, en particular los países en desarrollo, en materia de alerta temprana, reducción de riesgos y gestión de los riesgos para la salud nacional y mundial", "4.1": "De aquí a 2030, asegurar que todas las niñas y todos los niños terminen la enseñanza primaria y secundaria, que ha de ser gratuita, equitativa y de calidad y producir resultados de aprendizaje pertinentes y efectivos", "4.2": "De aquí a 2030, asegurar que todas las niñas y todos los niños tengan acceso a servicios de atención y desarrollo en la primera infancia y educación preescolar de calidad, a fin de que estén preparados para la enseñanza primaria", "4.3": "De aquí a 2030, asegurar el acceso igualitario de todos los hombres y las mujeres a una formación técnica, profesional y superior de calidad, incluida la enseñanza universitaria", "4.4": "De aquí a 2030, aumentar considerablemente el número de jóvenes y adultos que tienen las competencias necesarias, en particular técnicas y profesionales, para acceder al empleo, el trabajo decente y el emprendimiento", "4.5": "De aquí a 2030, eliminar las disparidades de género en la educación y asegurar el acceso igualitario a todos los niveles de la enseñanza y la formación profesional para las personas vulnerables, incluidas las personas con discapacidad, los pueblos indígenas y los niños en situaciones de vulnerabilidad", "4.6": "De aquí a 2030, asegurar que todos los jóvenes y una proporción considerable de los adultos, tanto hombres como mujeres, estén alfabetizados y tengan nociones elementales de aritmética", "4.7": "De aquí a 2030, asegurar que todos los alumnos adquieran los conocimientos teóricos y prácticos necesarios para promover el desarrollo sostenible, entre otras cosas mediante la educación para el desarrollo sostenible y los estilos de vida sostenibles, los derechos humanos, la igualdad de género, la promoción de una cultura de paz y no violencia, la ciudadanía mundial y la valoración de la diversidad cultural y la contribución de la cultura al desarrollo sostenible", "4.a": "Construir y adecuar instalaciones educativas que tengan en cuenta las necesidades de los niños y las personas con discapacidad y las diferencias de género, y que ofrezcan entornos de aprendizaje seguros, no violentos, inclusivos y eficaces para todos", "4.b": "De aquí a 2020, aumentar considerablemente a nivel mundial el número de becas disponibles para los países en desarrollo, en particular los países menos adelantados, los pequeños Estados insulares en desarrollo y los países africanos, a fin de que sus estudiantes puedan matricularse en programas de enseñanza superior, incluidos programas de formación profesional y programas técnicos, científicos, de ingeniería y de tecnología de la información y las comunicaciones, de países desarrollados y otros países en desarrollo", "4.c": "De aquí a 2030, aumentar considerablemente la oferta de docentes calificados, incluso mediante la cooperación internacional para la formación de docentes en los países en desarrollo, especialmente los países menos adelantados y los pequeños Estados insulares en desarrollo", "5.1": "Poner fin a todas las formas de discriminación contra todas las mujeres y las niñas en todo el mundo", "5.2": "Eliminar todas las formas de violencia contra todas las mujeres y las niñas en los ámbitos público y privado, incluidas la trata y la explotación sexual y otros tipos de explotación", "5.3": "Eliminar todas las prácticas nocivas, como el matrimonio infantil, precoz y forzado y la mutilación genital femenina", "5.4": "Reconocer y valorar los cuidados y el trabajo doméstico no remunerados mediante servicios públicos, infraestructuras y políticas de protección social, y promoviendo la responsabilidad compartida en el hogar y la familia, según proceda en cada país", "5.5": "Asegurar la participación plena y efectiva de las mujeres y la igualdad de oportunidades de liderazgo a todos los niveles decisorios en la vida política, económica y pública", "5.6": "Asegurar el acceso universal a la salud sexual y reproductiva y los derechos reproductivos según lo acordado de conformidad con el Programa de Acción de la Conferencia Internacional sobre la Población y el Desarrollo, la Plataforma de Acción de Beijing y los documentos finales de sus conferencias de examen", "5.a": "Emprender reformas que otorguen a las mujeres igualdad de derechos a los recursos económicos, así como acceso a la propiedad y al control de la tierra y otros tipos de bienes, los servicios financieros, la herencia y los recursos naturales, de conformidad con las leyes nacionales", "5.b": "Mejorar el uso de la tecnología instrumental, en particular la tecnología de la información y las comunicaciones, para promover el empoderamiento de las mujeres", "5.c": "Aprobar y fortalecer políticas acertadas y leyes aplicables para promover la igualdad de género y el empoderamiento de todas las mujeres y las niñas a todos los niveles", "6.1": "De aquí a 2030, lograr el acceso universal y equitativo al agua potable a un precio asequible para todos", "6.2": "De aquí a 2030, lograr el acceso a servicios de saneamiento e higiene adecuados y equitativos para todos y poner fin a la defecación al aire libre, prestando especial atención a las necesidades de las mujeres y las niñas y las personas en situaciones de vulnerabilidad", "6.3": "De aquí a 2030, mejorar la calidad del agua reduciendo la contaminación, eliminando el vertimiento y minimizando la emisión de productos químicos y materiales peligrosos, reduciendo a la mitad el porcentaje de aguas residuales sin tratar y aumentando considerablemente el reciclado y la reutilización sin riesgos a nivel mundial", "6.4": "De aquí a 2030, aumentar considerablemente el uso eficiente de los recursos hídricos en todos los sectores y asegurar la sostenibilidad de la extracción y el abastecimiento de agua dulce para hacer frente a la escasez de agua y reducir considerablemente el número de personas que sufren falta de agua", "6.5": "De aquí a 2030, implementar la gestión integrada de los recursos hídricos a todos los niveles, incluso mediante la cooperación transfronteriza, según proceda", "6.6": "De aquí a 2020, proteger y restablecer los ecosistemas relacionados con el agua, incluidos los bosques, las montañas, los humedales, los ríos, los acuíferos y los lagos", "6.a": "De aquí a 2030, ampliar la cooperación internacional y el apoyo prestado a los países en desarrollo para la creación de capacidad en actividades y programas relativos al agua y el saneamiento, como los de captación de agua, desalinización, uso eficiente de los recursos hídricos, tratamiento de aguas residuales, reciclado y tecnologías de reutilización", "6.b": "Apoyar y fortalecer la participación de las comunidades locales en la mejora de la gestión del agua y el saneamiento", "7.1": "De aquí a 2030, garantizar el acceso universal a servicios energéticos asequibles, fiables y modernos", "7.2": "De aquí a 2030, aumentar considerablemente la proporción de energía renovable en el conjunto de fuentes energéticas", "7.3": "De aquí a 2030, duplicar la tasa mundial de mejora de la eficiencia energética", "7.a": "De aquí a 2030, aumentar la cooperación internacional para facilitar el acceso a la investigación y la tecnología relativas a la energía limpia, incluidas las fuentes renovables, la eficiencia energética y las tecnologías avanzadas y menos contaminantes de combustibles fósiles, y promover la inversión en infraestructura energética y tecnologías limpias", "7.b": "De aquí a 2030, ampliar la infraestructura y mejorar la tecnología para prestar servicios energéticos modernos y sostenibles para todos en los países en desarrollo, en particular los países menos adelantados, los pequeños Estados insulares en desarrollo y los países en desarrollo sin litoral, en consonancia con sus respectivos programas de apoyo", "8.1": "Mantener el crecimiento económico per cápita de conformidad con las circunstancias nacionales y, en particular, un crecimiento del producto interno bruto de al menos el 7% anual en los países menos adelantados", "8.2": "Lograr niveles más elevados de productividad económica mediante la diversificación, la modernización tecnológica y la innovación, entre otras cosas centrándose en los sectores con gran valor añadido y un uso intensivo de la mano de obra", "8.3": "Promover políticas orientadas al desarrollo que apoyen las actividades productivas, la creación de puestos de trabajo decentes, el emprendimiento, la creatividad y la innovación, y fomentar la formalización y el crecimiento de las microempresas y las pequeñas y medianas empresas, incluso mediante el acceso a servicios financieros", "8.4": "Mejorar progresivamente, de aquí a 2030, la producción y el consumo eficientes de los recursos mundiales y procurar desvincular el crecimiento económico de la degradación del medio ambiente, conforme al Marco Decenal de Programas sobre Modalidades de Consumo y Producción Sostenibles, empezando por los países desarrollados", "8.5": "De aquí a 2030, lograr el empleo pleno y productivo y el trabajo decente para todas las mujeres y los hombres, incluidos los jóvenes y las personas con discapacidad, así como la igualdad de remuneración por trabajo de igual valor", "8.6": "De aquí a 2020, reducir considerablemente la proporción de jóvenes que no están empleados y no cursan estudios ni reciben capacitación", "8.7": "Adoptar medidas inmediatas y eficaces para erradicar el trabajo forzoso, poner fin a las formas contemporáneas de esclavitud y la trata de personas y asegurar la prohibición y eliminación de las peores formas de trabajo infantil, incluidos el reclutamiento y la utilización de niños soldados, y, de aquí a 2025, poner fin al trabajo infantil en todas sus formas", "8.8": "Proteger los derechos laborales y promover un entorno de trabajo seguro y sin riesgos para todos los trabajadores, incluidos los trabajadores migrantes, en particular las mujeres migrantes y las personas con empleos precarios", "8.9": "De aquí a 2030, elaborar y poner en práctica políticas encaminadas a promover un turismo sostenible que cree puestos de trabajo y promueva la cultura y los productos locales", "8.10": "Fortalecer la capacidad de las instituciones financieras nacionales para fomentar y ampliar el acceso a los servicios bancarios, financieros y de seguros para todos", "8.a": "Aumentar el apoyo a la iniciativa de ayuda para el comercio en los países en desarrollo, en particular los países menos adelantados, incluso mediante el Marco Integrado Mejorado para la Asistencia Técnica a los Países Menos Adelantados en Materia de Comercio", "8.b": "De aquí a 2020, desarrollar y poner en marcha una estrategia mundial para el empleo de los jóvenes y aplicar el Pacto Mundial para el Empleo de la Organización Internacional del Trabajo", "9.1": "Desarrollar infraestructuras fiables, sostenibles, resilientes y de calidad, incluidas infraestructuras regionales y transfronterizas, para apoyar el desarrollo económico y el bienestar humano, haciendo especial hincapié en el acceso asequible y equitativo para todos", "9.2": "Promover una industrialización inclusiva y sostenible y, de aquí a 2030, aumentar significativamente la contribución de la industria al empleo y al producto interno bruto, de acuerdo con las circunstancias nacionales, y duplicar esa contribución en los países menos adelantados", "9.3": "Aumentar el acceso de las pequeñas industrias y otras empresas, particularmente en los países en desarrollo, a los servicios financieros, incluidos créditos asequibles, y su integración en las cadenas de valor y los mercados", "9.4": "De aquí a 2030, modernizar la infraestructura y reconvertir las industrias para que sean sostenibles, utilizando los recursos con mayor eficacia y promoviendo la adopción de tecnologías y procesos industriales limpios y ambientalmente racionales, y logrando que todos los países tomen medidas de acuerdo con sus capacidades respectivas", "9.5": "Aumentar la investigación científica y mejorar la capacidad tecnológica de los sectores industriales de todos los países, en particular los países en desarrollo, entre otras cosas fomentando la innovación y aumentando considerablemente, de aquí a 2030, el número de personas que trabajan en investigación y desarrollo por millón de habitantes y los gastos de los sectores público y privado en investigación y desarrollo", "9.a": "Facilitar el desarrollo de infraestructuras sostenibles y resilientes en los países en desarrollo mediante un mayor apoyo financiero, tecnológico y técnico a los países africanos, los países menos adelantados, los países en desarrollo sin litoral y los pequeños Estados insulares en desarrollo", "9.b": "Apoyar el desarrollo de tecnologías, la investigación y la innovación nacionales en los países en desarrollo, incluso garantizando un entorno normativo propicio a la diversificación industrial y la adición de valor a los productos básicos, entre otras cosas", "9.c": "Aumentar significativamente el acceso a la tecnología de la información y las comunicaciones y esforzarse por proporcionar acceso universal y asequible a Internet en los países menos adelantados de aquí a 2020", "10.1": "De aquí a 2030, lograr progresivamente y mantener el crecimiento de los ingresos del 40% más pobre de la población a una tasa superior a la media nacional", "10.2": "De aquí a 2030, potenciar y promover la inclusión social, económica y política de todas las personas, independientemente de su edad, sexo, discapacidad, raza, etnia, origen, religión o situación económica u otra condición", "10.3": "Garantizar la igualdad de oportunidades y reducir la desigualdad de resultados, incluso eliminando las leyes, políticas y prácticas discriminatorias y promoviendo legislaciones, políticas y medidas adecuadas a ese respecto", "10.4": "Adoptar políticas, especialmente fiscales, salariales y de protección social, y lograr progresivamente una mayor igualdad", "10.5": "Mejorar la reglamentación y vigilancia de las instituciones y los mercados financieros mundiales y fortalecer la aplicación de esos reglamentos", "10.6": "Asegurar una mayor representación e intervención de los países en desarrollo en las decisiones adoptadas por las instituciones económicas y financieras internacionales para aumentar la eficacia, fiabilidad, rendición de cuentas y legitimidad de esas instituciones", "10.7": "Facilitar la migración y la movilidad ordenadas, seguras, regulares y responsables de las personas, incluso mediante la aplicación de políticas migratorias planificadas y bien gestionadas", "10.a": "Aplicar el principio del trato especial y diferenciado para los países en desarrollo, en particular los países menos adelantados, de conformidad con los acuerdos de la Organización Mundial del Comercio", "10.b": "Fomentar la asistencia oficial para el desarrollo y las corrientes financieras, incluida la inversión extranjera directa, para los Estados con mayores necesidades, en particular los países menos adelantados, los países africanos, los pequeños Estados insulares en desarrollo y los países en desarrollo sin litoral, en consonancia con sus planes y programas nacionales", "10.c": "De aquí a 2030, reducir a menos del 3% los costos de transacción de las remesas de los migrantes y eliminar los corredores de remesas con un costo superior al 5%", "11.1": "De aquí a 2030, asegurar el acceso de todas las personas a viviendas y servicios básicos adecuados, seguros y asequibles y mejorar los barrios marginales", "11.2": "De aquí a 2030, proporcionar acceso a sistemas de transporte seguros, asequibles, accesibles y sostenibles para todos y mejorar la seguridad vial, en particular mediante la ampliación del transporte público, prestando especial atención a las necesidades de las personas en situación de vulnerabilidad, las mujeres, los niños, las personas con discapacidad y las personas de edad", "11.3": "De aquí a 2030, aumentar la urbanización inclusiva y sostenible y la capacidad para la planificación y la gestión participativas, integradas y sostenibles de los asentamientos humanos en todos los países", "11.4": "Redoblar los esfuerzos para proteger y salvaguardar el patrimonio cultural y natural del mundo", "11.5": "De aquí a 2030, reducir significativamente el número de muertes causadas por los desastres, incluidos los relacionados con el agua, y de personas afectadas por ellos, y reducir considerablemente las pérdidas económicas directas provocadas por los desastres en comparación con el producto interno bruto mundial, haciendo especial hincapié en la protección de los pobres y las personas en situaciones de vulnerabilidad", "11.6": "De aquí a 2030, reducir el impacto ambiental negativo per cápita de las ciudades, incluso prestando especial atención a la calidad del aire y la gestión de los desechos municipales y de otro tipo", "11.7": "De aquí a 2030, proporcionar acceso universal a zonas verdes y espacios públicos seguros, inclusivos y accesibles, en particular para las mujeres y los niños, las personas de edad y las personas con discapacidad", "11.a": "Apoyar los vínculos económicos, sociales y ambientales positivos entre las zonas urbanas, periurbanas y rurales fortaleciendo la planificación del desarrollo nacional y regional", "11.b": "De aquí a 2020, aumentar considerablemente el número de ciudades y asentamientos humanos que adoptan e implementan políticas y planes integrados para promover la inclusión, el uso eficiente de los recursos, la mitigación del cambio climático y la adaptación a él y la resiliencia ante los desastres, y desarrollar y poner en práctica, en consonancia con el Marco de Sendái para la Reducción del Riesgo de Desastres 2015‑2030, la gestión integral de los riesgos de desastre a todos los niveles", "11.c": "Proporcionar apoyo a los países menos adelantados, incluso mediante asistencia financiera y técnica, para que puedan construir edificios sostenibles y resilientes utilizando materiales locales", "12.1": "Aplicar el Marco Decenal de Programas sobre Modalidades de Consumo y Producción Sostenibles, con la participación de todos los países y bajo el liderazgo de los países desarrollados, teniendo en cuenta el grado de desarrollo y las capacidades de los países en desarrollo", "12.2": "De aquí a 2030, lograr la gestión sostenible y el uso eficiente de los recursos naturales", "12.3": "De aquí a 2030, reducir a la mitad el desperdicio de alimentos per cápita mundial en la venta al por menor y a nivel de los consumidores y reducir las pérdidas de alimentos en las cadenas de producción y suministro, incluidas las pérdidas posteriores a la cosecha", "12.4": "De aquí a 2020, lograr la gestión ecológicamente racional de los productos químicos y de todos los desechos a lo largo de su ciclo de vida, de conformidad con los marcos internacionales convenidos, y reducir significativamente su liberación a la atmósfera, el agua y el suelo a fin de minimizar sus efectos adversos en la salud humana y el medio ambiente", "12.5": "De aquí a 2030, reducir considerablemente la generación de desechos mediante actividades de prevención, reducción, reciclado y reutilización", "12.6": "Alentar a las empresas, en especial las grandes empresas y las empresas transnacionales, a que adopten prácticas sostenibles e incorporen información sobre la sostenibilidad en su ciclo de presentación de informes", "12.7": "Promover prácticas de adquisición pública que sean sostenibles, de conformidad con las políticas y prioridades nacionales", "12.8": "De aquí a 2030, asegurar que las personas de todo el mundo tengan la información y los conocimientos pertinentes para el desarrollo sostenible y los estilos de vida en armonía con la naturaleza", "12.a": "Ayudar a los países en desarrollo a fortale /* ===================================================================
   Año del ejercicio que se reporta
   -------------------------------------------------------------------
   Las tablas de la norma hablan de «t», «t-1» y «t-2». Eso es correcto
   en el texto legal pero se presta a error al llenar el formulario, así
   que en pantalla se muestra el año calendario.
   El año sale de 2.3.3.v («Información actualizada al»), que es la fecha
   de cierre del ejercicio. Si todavía no está escrita, se usa el año en
   curso. Escribir esa fecha reetiqueta todas las tablas de una vez.
   =================================================================== */
function repYear(){
  try{
    const v=fv("s2_prop_fecha");
    const m=String(v||"").match(/(\d{4})/);
    if(m){ const y=parseInt(m[1],10); if(y>=1900&&y<=2200) return y; }
  }catch(e){}
  return YEAR;
}
/* Cambia {t}, {t-1} y {t-2} por el año que corresponde. */
function yrLabel(s){
  if(s==null) return s;
  const t=repYear();
  return String(s).replace(/\{t([+-]\d+)?\}/g,function(_,d){ return String(t+(d?parseInt(d,10):0)); });
}

}

/* ===================================================================
   Un cuadro de texto «Detalla» colgado de una pregunta de Sí/No ahora se
   muestra con LAS DOS respuestas. Antes solo aparecía con «Sí», y eso dejaba
   sin dónde escribir cuando la respuesta correcta era «No» pero la NCG pide
   señalarlo expresamente (pasó en 2.3.2, 3.2.xi, 3.5.i y 3.7.ii: el texto
   quedaba cargado pero invisible).
   Queda oculto solo mientras la pregunta sigue SIN responder.
   Los cuadros, los números y las tablas siguen apareciendo solo con «Sí»:
   ahí el dato simplemente no existiría.
   =================================================================== */
let _YESNO=null;
function esYesno(id){
  if(_YESNO===null){ _YESNO={};
    try{ Object.keys(SCHEMA).forEach(function(k){ (SCHEMA[k].fields||[]).forEach(function(f){
      if(f&&f.t==="yesno"&&f.id) _YESNO[f.id]=true; }); }); }catch(e){ _YESNO={}; } }
  return _YESNO[id]===true;
}
function esDetalleDeSiNo(c,f){
  return !!(c && f && f.t==="textarea" && c.equals==="si" && esYesno(c.field));
}
function condOk(c,f){ if(!c) return true; const v=fv(c.field);
  if(esDetalleDeSiNo(c,f)) return v==="si"||v==="no";
  return v===c.equals; }
/* Cuando la respuesta es «No», el cuadro pide la explicación contraria. */
function lblDe(f){
  if(!esDetalleDeSiNo(f&&f.showIf,f)) return f.label;
  if(fv(f.showIf.field)!=="no") return f.label;
  return (String(f.label).trim()==="Detalla") ? "Explica por qué no"
       : f.label+" — explica por qué no";
}
function naId(d){return "na__"+sk(d).replace(/[^0-9a-zA-Z]+/g,"_");}
function reqNA(d){return fna(naId(d));}
function gateState(s){ if(!s.gate) return "ok"; const v=fv(s.gate.field); if(v==="") return "wait"; return v===s.gate.equals?"ok":"na"; }
function reqComplete(d){
  const s=schemaOf(d); if(!s) return ansText(d.id).trim()!=="";
  if(reqNA(d)) return true;
  const gs=gateState(s);
  if(gs==="na") return true;
  if(gs==="wait") return false;
  const vis=s.fields.filter(f=>f.req!==false && condOk(f.showIf,f) && f.t!=="tcalc" && f.t!=="calcpct" && f.t!=="note" && f.t!=="pie" && f.id!=null);
  if(!vis.length) return false;
  return vis.every(f=> (f.t==="table"||f.t==="comites"||f.t==="comites_int"||f.t==="dirtab"||f.t==="dirbrecha"||f.t==="indice") ? tableFilled(f) : fieldFilled(f.id));
}

function setReqNA(d,b){const id=naId(d);FIELDS[id]=Object.assign({},FIELDS[id],{na:b});save(LS.fields,FIELDS);sbUpsertField(id);renderSide();renderCurrentKeepOpen();}

function isInstr(d){ if(d.intro) return false; const it=(d.item||"").trim(); const rq=(d.req||"").trim(); if(it==="") return true; if(rq===""||rq==="-") return true; if(["5.4.2||ii","5.4.2||iii"].indexOf(sk(d))>=0) return true; return false; }
function instrBox(rows){ const items=rows.map(d=>`<li>${esc(normaTexto(d.req))}</li>`).join(""); const id="instr-"+((rows[0]&&rows[0].node)||"x"); const body=`<div class="desc" style="margin:8px 0 6px">Texto de referencia de la norma (no requiere respuesta).</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:#54545a;line-height:1.6">${items}</ul>`; return acc(id,"ⓘ Instrucciones y definiciones de la sección",body); }
function narrDone(id){const d=BYID[id]; if(d&&schemaOf(d)) return reqComplete(d); return ansText(id).trim()!=="";}
function sectionPct(code){
  const sf=SF[code]||{narr:[],fields:[]}; let tot=0,fill=0;
  sf.narr.forEach(id=>{const _d=BYID[id]; if(_d&&(isInstr(_d)||isCtxOnly(_d)||isHidden(_d)))return; tot++; if(narrDone(id)) fill++;});
  sf.fields.forEach(id=>{tot++; if(fieldFilled(id)) fill++;});
  return tot? Math.round(fill/tot*100):0;
}
function generalPct(){const a=MAIN.map(m=>sectionPct(m.code)); return Math.round(a.reduce((x,y)=>x+y,0)/a.length);}

/* ---- Punto 9: el estado de cada sección se CALCULA, ya no se elige a mano ----
   Pendiente     · no se ha empezado nada en la sección
   En redacción  · hay algo empezado pero la sección no está terminada
   Completado    · todos los requerimientos contestables están aprobados      */
const SECST={pend:{l:"Pendiente",c:"#9a9a96"},redaccion:{l:"En redacción",c:"#d4a017"},aprobado:{l:"Completado",c:"#2e7d5b"}};
const ST_DONE={rev:1,comp:1};
/* Requerimientos contestables de una sección (los mismos que cuentan para el avance) */
function secReqs(code){ const out=DATA.filter(function(d){ return String(d.sec)===String(code) && countableReq(d); });
  const nid=LEAF_NARR[code]; if(!out.length && nid && BYID[nid]) out.push(BYID[nid]);
  return out; }
function secStatus(code){
  const rs=secReqs(code);
  if(!rs.length){ const nid=LEAF_NARR[code];
    if(nid){ const st=statusOf(nid); if(ST_DONE[st]) return "aprobado"; return (st==="pend"&&ansText(nid).trim()==="")?"pend":"redaccion"; }
    return "pend"; }
  let done=0, started=0;
  rs.forEach(function(d){ const st=statusOf(d.id);
    if(ST_DONE[st]) done++;
    if(st!=="pend"||narrDone(d.id)) started++; });
  if(done===rs.length) return "aprobado";
  return started?"redaccion":"pend";
}
/* Se conserva para no romper llamadas antiguas, pero ya no se usa desde la interfaz. */
function setSecStatus(code,v){SEC[code]=v;save(LS.sec,SEC);sbUpsertSection(code);renderSide();if(view.type==="estado")renderMain();}

function syncSectionStatus(){ if(!SB) return;
  /* `section_status` es de escritura exclusiva del revisor (política rev_write).
     Para un responsable esto daba 12 rechazos de RLS, uno por sección. El estado
     de sección se CALCULA en pantalla igual para todos: esta tabla es solo una
     copia para consultarla fuera del sitio, así que la escribe quien puede. */
  if(role!=="revisor") return;
  MAIN.forEach(function(m){ const v=secStatus(m.code); if(SEC[m.code]===v) return; SEC[m.code]=v; sbUpsertSection(m.code); }); }
function exportJSON(){const data={meta:{generado:new Date().toISOString(),memoria:YEAR,norma:"NCG N°461 / N°519",entidad:"VanTrust Capital AGF"},answers:ANS,fields:FIELDS,comments:COM,refs:REF,sectionStatus:SEC,tables:(typeof TBL!=="undefined"?TBL:{}),assignments:(typeof ASSIGN!=="undefined"?ASSIGN:{}),people:(typeof PEOPLEOV!=="undefined"?PEOPLEOV:{}),notifications:(typeof NOTIF!=="undefined"?NOTIF:{})};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="respuestas_memoria_"+YEAR+".json";document.body.appendChild(a);a.click();a.remove();}


/* ===================================================================
   Punto 3 — Botón «Guardar» global + aviso de cambios sin guardar
   -------------------------------------------------------------------
   Casi todo el sitio guarda solo (cada campo se escribe al escribirlo).
   Lo que NO se guarda solo son los cuadros de texto grandes: la respuesta
   narrativa de un requerimiento y el comentario del revisor. Eso es lo que
   este botón asegura, junto con reintentar lo que el servidor haya
   rechazado.
   =================================================================== */
const DIRTY={};                       /* id de textarea -> true */
function markDirty(id){ if(!DIRTY[id]){ DIRTY[id]=true; renderSaveChip(); } }
function clearDirty(id){ if(id==null){ for(const k in DIRTY) delete DIRTY[k]; for(const e in SBERR) delete SBERR[e]; }
  else { delete DIRTY[id]; } renderSaveChip(); }
function dirtyIds(){ return Object.keys(DIRTY); }
/* ¿Hay algo sin guardar? Cuenta también un comentario escrito y no publicado. */
function pendingComment(){ try{ return [].slice.call(document.querySelectorAll('textarea[id^="cm-"]')).some(function(t){ return t.value.trim()!==""; }); }catch(e){ return false; } }
function hasUnsaved(){ return dirtyIds().length>0 || sbErrCount()>0 || sbPendCount()>0 || pendingComment(); }

/* Vuelca a memoria + servidor todos los cuadros de respuesta modificados */
function flushDirty(){
  let nOk=0;
  dirtyIds().forEach(function(k){
    if(k.indexOf("ta-")!==0) return;
    const id=k.slice(3), ta=document.getElementById(k); if(!ta) { delete DIRTY[k]; return; }
    const d=BYID[id]; const puede = d?canEditReq(d):canEditAns(id);
    if(!puede){ delete DIRTY[k]; return; }
    const st=statusOf(id);
    ANS[id]=Object.assign({},ANS[id],{text:ta.value,status:(st==="pend"?"draft":st),updated:nowStr()});
    sbUpsertAnswer(id); nOk++; delete DIRTY[k];
  });
  if(nOk){ save(LS.answers,ANS); if(typeof syncSectionStatus==="function") syncSectionStatus(); }
  return nOk;
}
function saveAllNow(silent){
  if(!silent) vntBusy("Guardando…");
  if(typeof actFlush==="function") actFlush();
  const nPend=(typeof sbFlushPending==="function")?sbFlushPending():0;
  const nOk=flushDirty();
  const nRe=sbRetryAll();
  renderSide(); renderSaveChip();
  if(silent) return;
  setTimeout(function(){
    vntBusyOff();
    const fall=sbErrCount();
    let m="Guardado.\n\n"+nOk+" respuesta(s) escritas"+(nPend?" · "+nPend+" cambio(s) en espera enviados":"")+(nRe?" · "+nRe+" reintento(s) al servidor":"")+".";
    if(fall) m="Se guardó lo que se pudo, pero el servidor rechazó "+fall+" cambio(s).\n\n"
      +"Motivo más probable: no eres el responsable de ese requerimiento, o está bloqueado por su estado.\n\n"
      +"Detalle:\n"+Object.keys(SBERR).slice(0,5).map(function(k){return "• "+k+": "+SBERR[k].msg;}).join("\n");
    vntAlert(m);
  },700);
}
/* Indicador en la barra superior */
function renderSaveChip(){
  const el=document.getElementById("saveChip"); if(!el) return;
  const nd=dirtyIds().length, ne=sbErrCount();
  if(!AUTH||!AUTH.role){ el.innerHTML=""; return; }
  let cls="tb-btn save-btn", txt=ICO_SAVE+"Guardar";
  if(ne){ cls+=" save-err"; txt=ICO_SAVE+"Guardar ("+ne+" con error)"; }
  else if(nd){ cls+=" save-dirty"; txt=ICO_SAVE+"Guardar ("+nd+")"; }
  el.innerHTML=`<button class="${cls}" title="Guarda de una vez todos los cambios de esta página" onclick="saveAllNow()">${txt}</button>`;
}

    "Guardar y continuar","Salir sin guardar",

    function(){ clearDirty(); go(); });
}

function areaBadge(area){ if(!area) return `<span class="chip">Sin asignar</span>`; return `<span class="badge" style="background:${areaColor(area)}">${esc(area)}</span>`; }
/* Color del área. Si el área está en el mapa AREA usa su color oficial; si no (áreas
   escritas a mano al crear un responsable) genera uno estable a partir del nombre:
   el mismo texto da siempre el mismo color. Saturación alta y tono oscuro → nunca gris
   y siempre legible con el texto blanco de .badge. */
function areaColor(area){
  const m=AREA[area]; if(m&&m.c) return m.c;
  const s=String(area||"").trim().toLowerCase(); if(!s) return "#3b6ea5";
  let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  const hue=(h%24)*15;                 // 24 tonos separados 15°
  const sat=[46,54,62,70][(h>>>5)%4];  // 4 saturaciones
  const lig=[28,33,38][(h>>>9)%3];     // 3 luminosidades, todas oscuras
  return "hsl("+hue+","+sat+"%,"+lig+"%)";
}

/* Estado de un requerimiento en los tres colores del menú lateral. */
function reqDotState(d){
  const st=statusOf(d.id);
  if(ST_DONE[st]) return "aprobado";
  return (st!=="pend"||narrDone(d.id))?"redaccion":"pend";
}
function respStats(){
  const map={};
  DATA.forEach(d=>{
    if(d.intro||isInstr(d)||isCtxOnly(d)||isHidden(d))return;
    const r=respOf(d); const ar=areaOf(d);
    if(!map[r])map[r]={resp:r,area:ar||"",tot:0,done:0,items:[]};
    if(!map[r].area && ar)map[r].area=ar;
    map[r].tot++;
    const done=narrDone(d.id);
    if(done)map[r].done++;
    map[r].items.push({d:d,done:done});
  });
  return Object.values(map).sort((a,b)=>{ if(!a.resp)return 1; if(!b.resp)return -1; return b.tot-a.tot; });
}

function estadoRespHTML(){
  const rows=respStats();
  let opts=`<option value="">Todos los responsables</option>`+rows.map(g=>{const val=g.resp||"__none__";return `<option value="${esc(val)}" ${val===respFilter?"selected":""}>${esc(g.resp||"Sin asignar")} (${g.done}/${g.tot})</option>`;}).join("");
  let h=`<div class="resp-filter"><label>Ver:</label> <select onchange="setRespFilter(this.value)">${opts}</select></div>`;
  h+=`<table class="estado"><thead><tr><th style="width:32%">Responsable</th><th style="width:26%">Área</th><th style="width:14%">Avance</th><th>Completitud</th></tr></thead><tbody>`;
  const shown = respFilter ? rows.filter(g=>(g.resp||"__none__")===respFilter) : rows;
  shown.forEach(g=>{
    const pct=g.tot?Math.round(g.done/g.tot*100):0;
    const name=g.resp||"Sin asignar";
    const rid=accId("resp-"+name);
    const open=!!expanded["__r_"+rid] || !!respFilter;
    h+=`<tr class="resp-row" onclick="toggleResp('${rid}')"><td><span class="caret-r">${open?"▾":"▸"}</span> <b>${esc(name)}</b></td><td>${areaBadge(g.area)}</td><td class="resp-frac">${g.done}/${g.tot}</td><td><div class="miniprog"><div class="bar"><i style="width:${pct}%"></i></div><div class="v">${pct}%</div></div></td></tr>`;
    if(open){
      /* Mismos tres colores que el menú: gris sin empezar, amarillo en curso,
         verde aprobado. Y al hacer clic se abre el requerimiento, no la sección. */
      const det=g.items.map(it=>{const d=it.d; const base=d.sub||d.sec||""; const itm=(d.item&&d.item!==base)?String(d.item):""; const lbl=esc(!itm?base:(itm.indexOf(base)===0?itm:base+" "+itm));

function sec9Renum(d,txt){

function tblRows(f){

  if(f.mode==="fixed"){
    const n=f.rows.length;
    if(!Array.isArray(r)) r=[];

    if(!Array.isArray(r)){

      else { r=[]; }

/* ===================================================================
   OJO, esto cambió en la tanda 6. Antes esta función borraba TODOS los puntos,
   porque suponía que un punto era separador de miles: nnum("21.6") devolvía
   216, y por eso los promedios de horas de capacitación salían diez veces más
   grandes desde que la tanda 5 pasó los valores a formato de máquina.
   Ahora se parsea tal cual: el punto es decimal. La coma se sigue aceptando
   como decimal por si quedó algún valor antiguo, y normNum() se encarga de que
   nada entre con separador de miles.
   =================================================================== */
function nnum(v){const n=parseFloat(String(v==null?"":v).trim().replace(",","."));return isNaN(n)?0:n;}
/* Acepta lo que la gente escribe de verdad —«25,4», «1.100.000», «1.234,56»— y
   deja guardado siempre formato de máquina: punto decimal, sin separador de
   miles. Es la otra cara del defecto de la tanda 5: antes el casillero era
   <input type="number">, que rechazaba la coma y no guardaba nada.
   Regla chilena para los casos ambiguos: si el patrón es 1.234 o 1.234.567
   —grupos exactos de tres— el punto es separador de miles. */
function normNum(v){
  let s=String(v==null?"":v).trim().replace(/\s/g,"");
  if(s==="") return "";
  const neg=/^-/.test(s);
  s=s.replace(/^[+-]/,"").replace(/[^0-9.,]/g,"");
  if(s==="") return "";
  const c=s.lastIndexOf(","), p=s.lastIndexOf(".");
  let dec;
  if(c>=0&&p>=0) dec=Math.max(c,p);                                  /* manda el último */
  else if(c>=0) dec=/^\d{1,3}(,\d{3})+$/.test(s)?-1:c;
  else if(p>=0) dec=/^\d{1,3}(\.\d{3})+$/.test(s)?-1:p;
  else dec=-1;
  let ent,frac;
  if(dec<0){ ent=s.replace(/[.,]/g,""); frac=""; }
  else { ent=s.slice(0,dec).replace(/[.,]/g,""); frac=s.slice(dec+1).replace(/[.,]/g,""); }
  const out=(neg?"-":"")+(ent||"0")+(frac?"."+frac:"");
  return (out==="-"||out==="")?"":out;
}
function setFNum(id,v){ setF(id,normNum(v)); }
function tblSetCellNum(id,i,k,v){ tblSetCell(id,i,k,normNum(v)); }
/* Deja el casillero mostrando el valor ya normalizado cuando se sale de él. */
