/* ---------- exportación xlsx (SheetJS) ---------- */
function exportActivityXlsx(){
  if(typeof XLSX==="undefined"){ vntAlert("La librería de Excel no está disponible (sin conexión)."); return; }
  const wb=XLSX.utils.book_new();
  const b1=[["Nombre","Secciones asignadas","Nº de ingresos","Última conexión","Tiempo total en sitio (min)","Tiempo prom. sesión (min)"]];
  peopleNames().forEach(n=>{ const asg=assignedForName(n); const secs=[...new Set(asg.map(d=>d.sec))].sort((a,b)=>(+a)-(+b)); const tot=actViewMsUser(n); const sess=actSessionsOf(n).length;
    b1.push([n,secs.join(", "),actByUser(n).filter(e=>e.event_type==="login").length,fmtTs(actLastTsUser(n)),Math.round(tot/60000),sess?Math.round(tot/sess/60000):0]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b1),"1-General por resp.");
  const b2=[["Sección","Requerimiento","Responsable","Estado","Nº ediciones","Última edición","Tiempo sección (min)"]];
  DATA.filter(countableReq).filter(d=>actEditsReq(d.id).length>0).forEach(d=>{ const ed=actEditsReq(d.id); const last=ed.map(e=>e.ts).sort().pop();
    b2.push([d.sub||d.sec,reqShort(d),respOf(d)||"",ST_LBL[gStatus(d)],ed.length,fmtTs(last),Math.round(actViewMsSec(d.sec)/60000)]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b2),"2-Por requerimiento");
  const b3=[["Responsable","Req. asignados","Reparados por Revisor","% reparados","Pendientes de revisión"]];
  peopleNames().forEach(n=>{ const asg=assignedForName(n); const rep=repairedSetFor(n).size;
    b3.push([n,asg.length,rep,(asg.length?Math.round(rep/asg.length*100):0)+"%",asg.filter(d=>statusOf(d.id)==="sent").length]); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b3),"3-Revisión");
  const ef=estFinish(); const wk=Date.now()-7*86400000;
  const idle=DATA.filter(countableReq).filter(d=>!narrDone(d.id)).filter(d=>!ACTIVITY.some(e=>e.requirement_id===d.id&&+new Date(e.ts)>=wk));
  const b4=[["Métrica","Valor"],["Avance global (%)",generalPct()],["Requerimientos completados",ef.done],["Total requerimientos",ef.total],["Fecha estimada finalización",ef.txt],["Sin actividad 7 días (n)",idle.length],[],["Sección","Requerimiento","Responsable"]];
  idle.forEach(d=>b4.push([d.sub||d.sec,reqShort(d),respOf(d)||"Sin asignar"]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b4),"4-Resumen");
  const dt=new Date(); const fn="metricas_actividad_"+dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+".xlsx";
  XLSX.writeFile(wb,fn);
}
/* ===== Punto 3 (ronda junio) — "Pegar año pasado": copia los datos del año t-1 ===== */
/* PREVDATA shape: {answers:{reqId:{text}}, fields:{fieldId:{v,na}}, tables:{tid:[rows]}} (year 2025). */
/* Narrative requirements also fall back to PREVANS (keyed by sub||item) which already exists. */
const PREVDATA={"_year": 2025, "_note": "Datos estructurados de la memoria 2025 (año anterior t-1). Vacio en piloto: las respuestas narrativas usan prev_answers.json como respaldo. Cargar aqui los datos 2025 por reqId (answers), fieldId (fields) y tableId (tables) cuando esten disponibles.", "answers": {}, "fields": {}, "tables": {}};
function _pd(){ const b=(PREVDATA&&typeof PREVDATA==="object")?PREVDATA:{};
  const P=(typeof PRIOR!=="undefined")?PRIOR:{answers:{},fields:{},tables:{}};
  return {answers:Object.assign({},b.answers||{},P.answers||{}),
          fields: Object.assign({},b.fields ||{},P.fields ||{}),
          tables: Object.assign({},b.tables ||{},P.tables ||{})}; }
function prevAns(d){ const pd=_pd(); if(pd.answers&&pd.answers[d.id]&&pd.answers[d.id].text!=null) return pd.answers[d.id].text; const pa=PREVANS[sk(d)]; return (pa&&pa.ans!=null)?pa.ans:null; }
/* collect declared field ids + table ids for a guided requirement (skip calc/note) */
/* Los bloques de emisiones (9.2 FN-AC-410b.1) y de cobertura del AUM (410b.2) no
   declaran sus campos en el esquema: los arman al vuelo, uno por año y por alcance
   (emi_2025_a1, aum_2025_pct, …). Si no se declaran acá quedan fuera de tres cosas:
   «Pegar año pasado» no los encuentra, el cierre de ciclo no los archiva, y —lo más
   grave— se guardan sin requerimiento asociado, así que RLS se los rechaza a los
   responsables. Es el mismo problema que tenían las columnas dinámicas. */
function dynFieldIds(f){
  const out=[];
  if(f.t==="emissions") [PREV,YEAR].forEach(function(y){ ["a1","a2","a3"].forEach(function(k){ out.push("emi_"+y+"_"+k); }); });
  if(f.t==="aumcov")    [PREV,YEAR].forEach(function(y){ ["monto","pct","pcaf"].forEach(function(k){ out.push("aum_"+y+"_"+k); }); });
  return out;
}
function schemaIds(d){ const s=schemaOf(d); const fields=[],tables=[]; if(s&&Array.isArray(s.fields)){ s.fields.forEach(f=>{ if(f.t==="table"||f.t==="comites"||f.t==="comites_int"||f.t==="indice"){ if(f.id)tables.push(f.id); } else if(f.t==="emissions"||f.t==="aumcov"){ dynFieldIds(f).forEach(function(i){ fields.push(i); }); } else if(f.id&&f.t!=="tcalc"&&f.t!=="calcpct"&&f.t!=="note"&&f.t!=="dirtab"&&f.t!=="dirbrecha"){ fields.push(f.id); } }); } return {fields,tables}; }
function firstTextareaId(d){ const s=schemaOf(d); if(!s||!Array.isArray(s.fields))return null; const f=s.fields.find(x=>x.t==="textarea"); return f?f.id:null; }
function prevValuesFor(d){
  const sch=schemaOf(d), pd=_pd(); const out={has:false,ans:null,ansField:null,ansSinDonde:null,fields:{},tables:{}};
  const sid=schemaIds(d);
  if(pd.fields){ sid.fields.forEach(id=>{ if(pd.fields[id]!=null){ out.fields[id]=pd.fields[id]; } }); }
  if(pd.tables){ sid.tables.forEach(tid=>{ if(Array.isArray(pd.tables[tid])){ out.tables[tid]=pd.tables[tid]; }
    /* Las tablas de columnas dinámicas (nacionalidades en 5.1.2, habilidades en
       3.2.iv) guardan la lista de columnas en una entrada aparte «<tabla>__g».
       Sin ella, las cifras del año anterior se copian pero no tienen columnas
       donde mostrarse y en pantalla parece que no pasó nada. */
    if(Array.isArray(pd.tables[tid+"__g"])){ out.tables[tid+"__g"]=pd.tables[tid+"__g"]; }
    /* Los integrantes de los comités no se guardan en «t_comint», sino en una
       subtabla por comité: t_comint_0, t_comint_1, … Sin esto, «Pegar año pasado»
       no encontraba nada y 3.3.ii/3.3.iii se quedaban sin botón.
       Solo las arrastra el requerimiento DUEÑO de la subtabla (3.3.ii), para no
       pisar las columnas de su invitado (3.3.iii, que solo pone los ingresos). */
    const sub=new RegExp("^"+tid+"_\\d+$");
    Object.keys(pd.tables).forEach(function(k){
      if(!sub.test(k)||!Array.isArray(pd.tables[k])) return;
      if(typeof reqOfTable==="function"&&reqOfTable(k)!==d.id) return;
      out.tables[k]=pd.tables[k]; }); }); }
  const a=prevAns(d);
  /* Si el requerimiento tiene formulario pero NINGÚN cuadro de texto, el texto
     del año anterior no tiene dónde ir. Antes se descartaba sin avisar: el
     botón decía que había copiado y el texto desaparecía. Pasaba en 2.3.1.ii,
     2.3.3.iv, 3.2.ii, 3.2.xiii.a, 3.4.i, 5.8.i y 5.8.ii, que son justo los que
     el equipo respondía con «Ver Tabla3_2025». Ahora se guarda aparte y
     prevReport() lo muestra. */
  if(a!=null&&String(a).trim()!==""){ if(!sch){ out.ans=a; } else { const tid=firstTextareaId(d);
    if(tid){ out.ans=a; out.ansField=tid; } else { out.ansSinDonde=a; } } }
  out.has = (out.ans!=null) || out.ansSinDonde!=null || Object.keys(out.fields).length>0 || Object.keys(out.tables).length>0;
  return out;
}
function hasPrev(d){ return prevValuesFor(d).has; }

/* ===================================================================
   Punto 6 — Botón «Limpiar» + archivo de años anteriores
   -------------------------------------------------------------------
   Limpiar NO borra: primero archiva el contenido del requerimiento en la
   tabla prior_year_data con el año en curso, y recién después vacía el
   requerimiento. Así lo que se respondió este año queda disponible como
   «año anterior» y el botón «Pegar año pasado» lo puede recuperar en el
   ciclo siguiente. Es la contraparte exacta de «Pegar año pasado».
   =================================================================== */
let PRIOR={answers:{},fields:{},tables:{},yearOf:{},maxYear:PREV};

async function loadPriorYears(){
  if(!SB) return;
  let r; try{ r=await SB.from("prior_year_data").select("year,kind,ref_id,requirement_id,payload"); }
  catch(e){ console.warn("[SB] prior_year_data:",e); return; }
  if(r.error){ console.warn("[SB] prior_year_data:",r.error.message); return; }
  const best={}, P={answers:{},fields:{},tables:{},yearOf:{},maxYear:PREV};
  (r.data||[]).forEach(function(x){ const k=x.kind+":"+x.ref_id;
    if(best[k]&&best[k].year>=x.year) return; best[k]=x; });
  Object.keys(best).forEach(function(k){ const x=best[k];
    if(x.year>P.maxYear) P.maxYear=x.year;
    if(x.kind==="answer"){ P.answers[x.ref_id]=x.payload||{}; }
    else if(x.kind==="field"){ P.fields[x.ref_id]=x.payload||{}; }
    else if(x.kind==="table"){ P.tables[x.ref_id]=Array.isArray(x.payload)?x.payload:[]; }
    const rq=x.requirement_id||(x.kind==="answer"?x.ref_id:null);
    if(rq&&(!P.yearOf[rq]||P.yearOf[rq]<x.year)) P.yearOf[rq]=x.year; });
  PRIOR=P;
  console.log("[Supabase] Año anterior cargado → "+(r.data||[]).length+" registros (año más reciente: "+P.maxYear+")");
}
/* Año del que provienen los datos archivados de este requerimiento */
function prevYearOf(d){ return (d&&PRIOR.yearOf[d.id])||PREV; }

/* ---- Reunir TODO lo que pertenece a un requerimiento ---- */
function fieldIdsOf(d){
  const out={}; schemaIds(d).fields.forEach(function(i){ out[i]=1; });
  out[naId(d)]=1;
  Object.keys(FIELDS).forEach(function(i){ if(reqOfField(i)===d.id) out[i]=1; });
  return Object.keys(out);
}
function tableIdsOf(d){
  const out={}; schemaIds(d).tables.forEach(function(i){ out[i]=1; });
  Object.keys(typeof TBL!=="undefined"?TBL:{}).forEach(function(i){ if(reqOfTable(i)===d.id) out[i]=1; });
  return Object.keys(out);
}

function canLimpiar(d){ return role==="revisor" && !!d; }
function limpiarBtn(d){ if(!canLimpiar(d)) return "";
  return `<button type="button" class="btn ghost limpiar" title="Borra la respuesta, los campos, las tablas y los comentarios de este requerimiento" onclick="limpiarReq('${d.id}')">🧹 Limpiar</button>`; }
function limpiarRow(d){ const b=limpiarBtn(d); return b?`<div class="row-actions">${b}</div>`:""; }

function limpiarReq(id){
  if(role!=="revisor") return; const d=BYID[id]; if(!d) return;
  const nf=fieldIdsOf(d).filter(function(i){ return FIELDS[i]!==undefined; }).length;
  const nt=tableIdsOf(d).filter(function(i){ return TBL[i]!==undefined; }).length;
  const ncol=tblColsOf(d).length;
  const nc=(COM[id]||[]).length;
  const hijos=hijosConDatos(id);
  const hay=(ansText(id).trim()!=="")||nf||nt||ncol||nc||hijos.length;
  if(!hay){ vntAlert("Este requerimiento ya está vacío: no hay nada que limpiar."); return; }
  /* Avisos cuando lo que se borra lo están mirando otros requerimientos. */
  let extra="";
  if(hijos.length) extra="Sin comités no hay nada que responder en los requerimientos que dependen de éste, "
    +"así que TAMBIÉN se limpian y vuelven a «Pendiente»:\n"
    +hijos.map(function(r){ return "   · "+reqLabel(BYID[r])+" — "+reqShort(BYID[r]); }).join("\n")+"\n\n";
  else if(id==="3_3_ii") extra="Se borran los integrantes de todos los comités, así que 3.3.iii "
    +"(ingresos percibidos) también queda vacío y vuelve a «Pendiente».\n\n";
  if(ncol) extra="Se vacían solo las columnas de este requerimiento ("+ncol+" comité(s)). "
    +"Los integrantes registrados en 3.3.ii se mantienen.\n\n";
  const msg="Vas a borrar el contenido de «"+reqLabel(d)+" — "+reqShort(d)+"».\n\n"
    +extra
    +"Se elimina: "+(ansText(id).trim()?"la respuesta, ":"")+nf+" campo(s), "+(nt+ncol)+" tabla(s) y "+nc+" comentario(s).\n"
    +"El requerimiento vuelve a «Pendiente».\n\n"
    +"Esto NO guarda copia. El archivado como «año anterior» se hace al final del "
    +"ciclo, desde Configuración → Cierre de ciclo anual.";
  vntConfirm(msg,"Sí, limpiar","Cancelar",function(){ conEspera("Limpiando el requerimiento…",function(){ return doLimpiar(d,true,false); }); });
}

/* Vacía un requerimiento. Con archivar=true guarda antes una copia en
   prior_year_data (eso lo usa el cierre de ciclo); con archivar=false solo borra. */
async function doLimpiar(d,rerender,archivar){
  if(archivar===undefined) archivar=true;
  const id=d.id, year=YEAR;
  const fids=fieldIdsOf(d).filter(function(i){ return FIELDS[i]!==undefined; });
  const tids=tableIdsOf(d).filter(function(i){ return TBL[i]!==undefined; });
  const rows=[];
  const a=ANS[id];
  if(a&&(a.text||"").trim()!=="") rows.push({year:year,kind:"answer",ref_id:id,requirement_id:id,payload:{text:a.text,status:a.status||"pend",updated:a.updated||""}});
  fids.forEach(function(i){ rows.push({year:year,kind:"field",ref_id:i,requirement_id:id,payload:FIELDS[i]||{}}); });
  tids.forEach(function(i){ rows.push({year:year,kind:"table",ref_id:i,requirement_id:id,payload:TBL[i]||[]}); });

  if(archivar&&SB&&rows.length){
    const w=await SB.from("prior_year_data").upsert(rows,{onConflict:"year,kind,ref_id"});
    if(w.error){ vntAlert("No se pudo archivar la información:\n"+w.error.message+"\n\nNo se borró nada."); return false; }
  }
  if(SB){
    const del=[ SB.from("answers").delete().eq("requirement_id",id),
                SB.from("comments").delete().eq("requirement_id",id) ];
    if(fids.length) del.push(SB.from("fields").delete().in("field_id",fids));
    if(tids.length) del.push(SB.from("table_data").delete().in("table_id",tids));
    const res=await Promise.all(del);
    const err=res.map(function(x){ return x&&x.error; }).filter(Boolean);
    if(err.length){ vntAlert("La información quedó archivada, pero no se pudo borrar todo:\n"+err.map(function(e){return e.message;}).join("\n")); }
  }
  /* memoria local (y el snapshot en pantalla, solo si se archivó) */
  delete ANS[id]; save(LS.answers,ANS);
  fids.forEach(function(i){ if(archivar) PRIOR.fields[i]=(FIELDS[i]||{}); delete FIELDS[i]; });
  save(LS.fields,FIELDS);
  tids.forEach(function(i){ if(archivar) PRIOR.tables[i]=(TBL[i]||[]); delete TBL[i]; });
  if(typeof tblSave==="function") tblSave();
  if(archivar){
    if(a&&(a.text||"").trim()!=="") PRIOR.answers[id]={text:a.text};
    PRIOR.yearOf[id]=year; if(year>PRIOR.maxYear) PRIOR.maxYear=year;
  }
  /* Tabla compartida donde este requerimiento solo pone algunas columnas:
     se vacían esas columnas, no la tabla entera. */
  const ccols=limpiarCols(d);
  ccols.forEach(function(i){ if(typeof tblSave==="function") tblSave(i); });

  delete COM[id]; save(LS.comments,COM);
  clearRevUnlock(id);
  /* Si al borrar esto queda vacío otro requerimiento que compartía las mismas
     filas, ese otro también vuelve a «Pendiente». No es deducir el estado del
     contenido —eso no se hace nunca—: es cerrar la puerta en el mismo acto de
     borrar, para que no quede un «Borrador» sin nada adentro. */
  const arrastre=[];
  (grupoDe(id)||[]).forEach(function(rid){
    if(rid===id) return; const o=BYID[rid]; if(!o) return;
    if(statusOf(rid)==="pend") return;
    if(!reqVacio(o)) return;
    delete ANS[rid]; clearRevUnlock(rid); delete COM[rid]; arrastre.push(rid); });
  if(arrastre.length){ save(LS.answers,ANS); save(LS.comments,COM);
    if(SB) arrastre.forEach(function(rid){
      SB.from("answers").delete().eq("requirement_id",rid).then(function(r){ sbNote("answers",rid,r.error); });
      SB.from("comments").delete().eq("requirement_id",rid).then(function(r){ sbNote("comments",rid,r.error); }); }); }
  if(typeof recalc==="function"){ try{recalc();}catch(e){} }
  /* Propagación: los requerimientos que dependían de éste se limpian también.
     Se hace después de borrar el padre para que su contenido ya no esté. */
  for(const hijo of hijosDe(id)){
    const o=BYID[hijo]; if(!o) continue;
    if(reqVacio(o)&&statusOf(hijo)==="pend") continue;
    await doLimpiar(o,false,archivar);
  }
  if(rerender){ renderSide(); renderCurrentKeepOpen(); }
  return true;
}

/* ---- Cierre de ciclo: limpiar TODOS los requerimientos de una vez ---- */
function cicloPendientes(){ return DATA.filter(function(d){ return countableReq(d) && ["rev","comp"].indexOf(statusOf(d.id))<0; }); }
function limpiarCiclo(){
  if(role!=="revisor") return;
  const pend=cicloPendientes();
  const conDatos=DATA.filter(function(d){ return countableReq(d) && (ansText(d.id).trim()!=="" || fieldIdsOf(d).some(function(i){return FIELDS[i]!==undefined;}) || tableIdsOf(d).some(function(i){return TBL[i]!==undefined;})); });
  if(!conDatos.length){ vntAlert("No hay información cargada: el ciclo ya está vacío."); return; }
  let msg="CIERRE DE CICLO "+YEAR+"\n\n"
    +"Se archivarán "+conDatos.length+" requerimiento(s) como año anterior ("+YEAR+") y quedarán vacíos, listos para el ciclo "+(YEAR+1)+".\n"
    +"También se borran todos los comentarios.\n\n";
  msg+= pend.length
    ? "⚠️ ATENCIÓN: "+pend.length+" requerimiento(s) todavía NO están Completados. Lo normal es cerrar el ciclo cuando todos están aprobados.\n\n"
    : "✓ Todos los requerimientos están Completados.\n\n";
  msg+="Esta acción no se puede deshacer desde el sitio.";
  vntConfirm(msg,"Sí, cerrar el ciclo "+YEAR,"Cancelar",function(){ runLimpiarCiclo(conDatos); });
}
async function runLimpiarCiclo(list){
  let ok=0,fail=0;
  vntBusy("Archivando 1 de "+list.length+"…");
  for(let i=0;i<list.length;i++){ vntBusyMsg("Archivando "+(i+1)+" de "+list.length+"…");
    const r=await doLimpiar(list[i],false,true); if(r)ok++; else fail++; }
  vntBusyOff();
  renderSide(); renderMain();
  vntAlert("Cierre de ciclo terminado.\n\nArchivados y limpiados: "+ok+"\nCon problemas: "+fail+"\n\nLa información quedó disponible como «año anterior» ("+YEAR+").");
}
function currentHasData(d){
  if(ansText(d.id).trim()!=="") return true;
  const sid=schemaIds(d);
  if(sid.fields.some(id=>fieldFilled(id))) return true;
  if(sid.tables.some(tid=>{const f=tdefById(tid); return f?tableFilled(f):false;})) return true;
  return false;
}
/* Etiqueta legible de un campo, para poder contar qué se pegó y dónde */
function fieldLabelOf(d,id){ const sc=schemaOf(d);
  if(sc&&Array.isArray(sc.fields)){ const f=sc.fields.filter(function(x){return x&&x.id===id;})[0]; if(f) return f.label||id; }
  return id; }
/* ¿Este campo está escondido ahora mismo por depender de una respuesta Sí/No
   que todavía no se ha marcado? Es el caso que hacía parecer que «no pasaba nada». */
function fieldHiddenNow(d,id){ const sc=schemaOf(d);
  if(!sc||!Array.isArray(sc.fields)) return false;
  const f=sc.fields.filter(function(x){return x&&x.id===id;})[0];
  return !!(f&&f.showIf&&!condOk(f.showIf,f)); }
function applyPrev(d,src){
  const sch=schemaOf(d);
  const puestos=[], ocultos=[];
  let nf=0; for(const id in src.fields){ const pv=src.fields[id]||{}; FIELDS[id]=Object.assign({},FIELDS[id],{v:(pv.v!=null?pv.v:""),na:!!pv.na}); nf++; sbUpsertField(id);
    if(id!==src.ansField) puestos.push(fieldLabelOf(d,id)); }
  let nt=0; for(const tid in src.tables){ TBL[tid]=JSON.parse(JSON.stringify(src.tables[tid])); nt++; sbUpsertTable(tid);
    if(!/__g$/.test(tid)) puestos.push(fieldLabelOf(d,tid)); }
  if(src.ans!=null){
    if(!sch){ ANS[d.id]=Object.assign({},ANS[d.id],{text:src.ans,status:(ANS[d.id]&&ANS[d.id].status)||"draft",updated:nowStr()}); save(LS.answers,ANS); sbUpsertAnswer(d.id);
      puestos.push("Respuesta"); }
    else if(src.ansField){
      /* El dato cargado y el relato del área pueden caer en el mismo cuadro:
         pasa siempre que el requerimiento tiene un solo textarea. Antes el
         relato pisaba el dato sin avisar. Ahora se conservan los dos. */
      const yaPuesto=(src.fields&&src.fields[src.ansField]!=null)
        ? String(src.fields[src.ansField].v==null?"":src.fields[src.ansField].v).trim() : "";
      const relato=String(src.ans==null?"":src.ans).trim();
      let val=relato, fusion=false;
      if(yaPuesto && relato && yaPuesto!==relato && yaPuesto.indexOf(relato)<0){
        val=yaPuesto+"\n\n———\nRespuesta del área en el ciclo anterior:\n"+relato;
        fusion=true;
      } else if(yaPuesto && (!relato || yaPuesto.indexOf(relato)>=0)){
        val=yaPuesto;
      }
      FIELDS[src.ansField]=Object.assign({},FIELDS[src.ansField],{v:val}); nf++; sbUpsertField(src.ansField);
      if(!fusion) puestos.push(fieldLabelOf(d,src.ansField));
      else puestos.push(fieldLabelOf(d,src.ansField)+" (el dato de la memoria y la respuesta del área, uno debajo del otro)");
      if(fieldHiddenNow(d,src.ansField)) ocultos.push(fieldLabelOf(d,src.ansField)); }
  }
  if(nf) save(LS.fields,FIELDS);
  if(nt) tblSave();
  if(typeof recalc==="function"){ try{recalc();}catch(e){} }
  if(typeof logActivity==="function"){ try{logActivity("paste_previous",d);}catch(e){} }
  renderSide(); renderCurrentKeepOpen();
  return {puestos:puestos,ocultos:ocultos,sinDonde:(src.ansSinDonde||null)};
}
/* Cuenta qué se va a pegar de verdad, para no prometer más de lo que hay */
function prevCount(src){ return Object.keys(src.fields||{}).length
  + Object.keys(src.tables||{}).filter(function(t){ return !/__g$/.test(t); }).length
  + (src.ans!=null?1:0)
  + (src.ansSinDonde!=null?1:0); }
/* Avisa qué quedó pegado y dónde. Antes no decía nada, y en los requerimientos
   de Sí/No el texto caía en un campo escondido: parecía que no había pasado nada. */
function prevReport(d,res){
  if(!res||(!res.puestos.length&&!res.sinDonde)){ vntAlert("No había nada del año anterior ("+prevYearOf(d)+") para copiar en este requerimiento."); return; }
  if(!res.puestos.length&&res.sinDonde){
    vntAlert("El año anterior ("+prevYearOf(d)+") había un texto en este requerimiento, pero acá no hay"
      +" ningún cuadro de texto donde ponerlo, así que no se copió nada. Te lo dejo a la vista:\n\n"+res.sinDonde);
    return; }
  let m="Se copió la información de "+prevYearOf(d)+" en:\n\n• "+res.puestos.join("\n• ");
  if(res.ocultos.length){
    m+="\n\n⚠️ "+(res.ocultos.length===1?"Ese campo está":"Esos campos están")+" oculto"+(res.ocultos.length===1?"":"s")
     +" hasta que respondas la pregunta de Sí/No de arriba. Marca la respuesta que corresponda y aparecerá el texto ya copiado.";
  }
  if(res.sinDonde){
    m+="\n\n⚠️ Además, el año anterior había un TEXTO en este requerimiento y acá no hay ningún"
     +" cuadro de texto donde ponerlo, así que no se copió. Te lo dejo para que lo tengas a la vista:"
     +"\n\n"+res.sinDonde;
  }
  m+="\n\nRevisa que siga vigente antes de enviar a revisión.";
  vntAlert(m);
}
function pasteFromPrev(d){
  if(!canEditReq(d)) return;
  const src=prevValuesFor(d);
  if(!src.has||!prevCount(src)){ vntAlert("No hay información del año anterior ("+prevYearOf(d)+") registrada para este requerimiento."); return; }
  if(currentHasData(d)){
    vntConfirm("Este requerimiento ya tiene información ingresada.\n\nSe reemplazará con lo respondido en "+prevYearOf(d)+" ("+prevCount(src)+" dato(s)).",
      "Sí, reemplazar","Cancelar",function(){ prevReport(d,applyPrev(d,src)); });
  } else { prevReport(d,applyPrev(d,src)); }
}
/* small secondary button rendered in the card header (next to the status chip) */
function prevBtn(d){ if(!canEditReq(d)||!hasPrev(d)) return ""; return `<button type="button" class="btn ghost prevpaste" title="Copiar la respuesta del año anterior (${prevYearOf(d)}) en este requerimiento" onclick="event.stopPropagation();pasteFromPrev(BYID['${d.id}'])">📋 Pegar año pasado</button>`; }

/* ---- Indicador de carga -------------------------------------------------
   Algunas acciones tardan un par de segundos (mandar un correo, subir un
   archivo, archivar un requerimiento). Sin señal, la gente vuelve a apretar
   el botón. Esto oscurece la pantalla y muestra en qué está. */
function vntBusyEl(){ let el=document.getElementById("vntbusy");
  if(!el){ el=document.createElement("div"); el.id="vntbusy"; el.className="vnt-busy"; el.style.display="none"; document.body.appendChild(el); }
  return el; }
function vntBusy(msg){ const el=vntBusyEl();
  el.innerHTML=`<div class="vnt-busy-card"><div class="vnt-spin"></div><div class="vnt-busy-t">${esc(msg||"Procesando…")}</div></div>`;
  el.style.display="flex"; }
function vntBusyMsg(msg){ const t=document.querySelector("#vntbusy .vnt-busy-t"); if(t)t.textContent=msg; }
function vntBusyOff(){ const el=document.getElementById("vntbusy"); if(el){ el.style.display="none"; el.innerHTML=""; } }
/* Envuelve una acción lenta: muestra el indicador y lo apaga pase lo que pase. */
async function conEspera(msg,fn){ vntBusy(msg);
  try{ return await fn(); } finally{ vntBusyOff(); } }
function vntAlert(msg){ const el=vntModalEl(); el.style.display="flex"; el.innerHTML=`<div class="vnt-modal"><div class="vnt-modal-b">${esc(msg)}</div><div class="vnt-modal-acts"><button class="btn primary" onclick="vntClose()">Entendido</button></div></div>`; }
/* ===== Point 2 — Repositorio dividido: Box A (documentos de respaldo) + Box B (autocompletar) =====
   Box A: archivos reales. Metadatos en localStorage (render síncrono) + blobs en IndexedDB (cuota grande).
   Box B: Excel/CSV procesado EN MEMORIA con SheetJS; no se almacena. Solo en reqs con campos numéricos/tabla. */
const LS_DOCS="vnt_ncg461_docs"; let DOCS=load(LS_DOCS);   // {reqId:[{key,name,size,type,uploadedAt,uploadedBy,storage_path}]}
const SB_BUCKET="respaldo";   // bucket de Supabase Storage para documentos de respaldo
/* Límites de los documentos de respaldo.
   Antes eran 10 MB por archivo y 50 MB por requerimiento: con 205
   requerimientos eso daba un techo de 10 GB, muy por encima de lo que el
   almacenamiento aguanta. Con 5 y 15 MB el techo baja a ~3 GB y el uso
   realista a unos cientos de MB al año, sin que estorbe en la práctica
   (caben tres archivos por requerimiento). */
const DOC_MAX=5*1024*1024, DOC_TOTAL_MAX=15*1024*1024, AUTOC_MAX=5*1024*1024;
const DOC_MAX_TXT=fmtMB(5), DOC_TOTAL_TXT=fmtMB(15);
function fmtMB(m){ return m+" MB"; }
const DOC_EXT=["pdf","docx","doc","xlsx","xls","png","jpg","jpeg"];
function fmtSize(b){ b=b||0; if(b<1024)return b+" B"; if(b<1048576)return (b/1024).toFixed(1)+" KB"; if(b<1073741824)return (b/1048576).toFixed(2)+" MB"; return (b/1073741824).toFixed(2)+" GB"; }
function extOf(name){ const m=String(name||"").toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:""; }

/* ---- IndexedDB para los blobs ---- */
let _idb=null;
function idbOpen(){ return new Promise((res,rej)=>{ if(_idb)return res(_idb); const r=indexedDB.open("vnt_ncg461_files",1); r.onupgradeneeded=()=>{ r.result.createObjectStore("blobs"); }; r.onsuccess=()=>{ _idb=r.result; res(_idb); }; r.onerror=()=>rej(r.error); }); }
function idbPut(key,blob){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction("blobs","readwrite"); t.objectStore("blobs").put(blob,key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }
function idbGet(key){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction("blobs","readonly"); const rq=t.objectStore("blobs").get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
function idbDel(key){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction("blobs","readwrite"); t.objectStore("blobs").delete(key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }

/* ---- Box A — Documentos de respaldo ---- */
function docsOf(id){ return DOCS[id]||[]; }
/* Cuánto pesa TODO lo subido a la memoria. Sirve para saber si el
   almacenamiento aguanta, en vez de estimarlo. */
function docsGlobal(){
  let bytes=0, files=0, reqs=0, top=[];
  for(const id in DOCS){ const l=DOCS[id]||[]; if(!l.length) continue;
    const b=l.reduce(function(a,x){ return a+(x.size||0); },0);
    bytes+=b; files+=l.length; reqs++; top.push({id:id,b:b,n:l.length}); }
  top.sort(function(a,z){ return z.b-a.b; });
  return {bytes:bytes,files:files,reqs:reqs,top:top.slice(0,5),
          techo:DATA.filter(countableReq).length*DOC_TOTAL_MAX}; }
function docsTotal(id){ return docsOf(id).reduce((a,x)=>a+(x.size||0),0); }
function repoPanel(d){ return boxA(d) + (reqHasAutocomplete(d)?boxB(d):""); }
function boxA(d){
  const can=canEditReq(d); const list=docsOf(d.id);
  const rows = list.length ? list.map(x=>`<li class="docrow"><span class="docname" title="${esc(x.name)}">${esc(x.name)}</span><span class="docmeta">${fmtSize(x.size)} · ${esc(x.uploadedAt)} · ${esc(x.uploadedBy||"—")}</span><span class="docacts"><button class="tiny-btn" onclick="docDownload('${d.id}','${esc(x.key)}')" title="Descargar">⬇</button>${can?`<button class="tiny-btn" onclick="docDelete('${d.id}','${esc(x.key)}')" title="Eliminar">🗑</button>`:""}</span></li>`).join("") : `<li class="docrow empty">Sin documentos de respaldo.</li>`;
  const refs=REF[d.id]||[];
  const refHtml = refs.length ? `<div class="doc-links"><div class="ph">Enlaces</div><ul class="refs">`+refs.map((r,i)=>`<li><a href="${esc(r.url)}" target="_blank">${esc(r.label||r.url)}</a>${can?` <button class="tiny-btn" onclick="delRef('${d.id}',${i})">×</button>`:""}</li>`).join("")+`</ul></div>` : "";
  const addRefHtml = can ? `<div class="doc-links"><div class="ph">Agregar enlace</div><div class="ref-add"><input id="rl-${d.id}" placeholder="Título (ej. Política de directorio)"/><input id="ru-${d.id}" placeholder="https://..."/><button class="tiny-btn" onclick="addRef('${d.id}')">+ Enlace</button></div></div>` : "";
  const usage=`<div class="saved-note doc-usage">${fmtSize(docsTotal(d.id))} / ${DOC_TOTAL_TXT} usados</div>`;
  const up = can ? `<div class="dropzone" id="dzA-${d.id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="docDrop(event,'${d.id}')"><input type="file" id="fileA-${d.id}" style="display:none" accept=".pdf,.docx,.doc,.xlsx,.xls,.png,.jpg,.jpeg" onchange="docPick(this,'${d.id}')"/><button class="tiny-btn" onclick="document.getElementById('fileA-${d.id}').click()">+ Subir documento</button><span class="dz-hint">PDF, Word, Excel o imagen · máx ${DOC_MAX_TXT}</span></div>` : "";
  return `<div class="panel"><h4>📎 Documentos de respaldo</h4><div class="desc">Archivos que respaldan la respuesta.</div><ul class="docs">${rows}</ul>${refHtml}${addRefHtml}${usage}${up}</div>`;
}
function docPick(inp,id){ const f=inp.files&&inp.files[0]; if(f)docUpload(id,f); inp.value=""; }
function docDrop(e,id){ e.preventDefault(); const dz=document.getElementById("dzA-"+id); if(dz)dz.classList.remove("over"); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)docUpload(id,f); }
function docUpload(id,file){
  const ext=extOf(file.name);
  if(DOC_EXT.indexOf(ext)<0){ vntAlert("Formato no permitido: ."+ext+". Tipos aceptados: PDF, Word (.doc/.docx), Excel (.xls/.xlsx), imágenes (.png/.jpg)."); return; }
  if(file.size>DOC_MAX){ vntAlert("El archivo pesa "+fmtSize(file.size)+" y el límite es "+DOC_MAX_TXT+".\n\n"
    +"Si es un PDF escaneado, comprímelo (en Word: Archivo → Guardar como → PDF, tamaño mínimo) o súbelo dividido."); return; }
  const list=docsOf(id); const others=list.filter(x=>x.name!==file.name).reduce((a,x)=>a+x.size,0);
  if(others+file.size>DOC_TOTAL_MAX){ vntAlert("Este requerimiento llegaría a "+fmtSize(others+file.size)
    +" y el límite es "+DOC_TOTAL_TXT+" en total.\n\nElimina algún archivo antes de subir uno nuevo."); return; }
  if(!SB){ vntAlert("Sin conexión con el servidor. Recarga la página."); return; }
  const path=id+"/"+file.name;   // carpeta por requerimiento
  vntBusy("Subiendo «"+file.name+"»…");
  SB.storage.from(SB_BUCKET).upload(path,file,{upsert:true,contentType:(file.type||undefined)}).then(function(up){
    if(up.error){ vntBusyOff(); vntAlert("No se pudo subir el archivo: "+up.error.message); return; }
    // reemplazar el registro por nombre en la tabla documents
    return SB.from("documents").delete().eq("requirement_id",id).eq("name",file.name).then(function(){
      return SB.from("documents").insert({requirement_id:id,name:file.name,size_bytes:file.size,content_type:(file.type||ext),storage_path:path,uploaded_by:sbWho()});
    }).then(function(ins){
      vntBusyOff();
      if(ins&&ins.error){ vntAlert("Archivo subido, pero no se pudo registrar: "+ins.error.message); return; }
      const rec={key:path,name:file.name,size:file.size,type:file.type||ext,uploadedAt:nowStr(),uploadedBy:sbWho()||role,storage_path:path};
      DOCS[id]=DOCS[id]||[]; const ix=DOCS[id].findIndex(x=>x.name===file.name); if(ix>=0)DOCS[id][ix]=rec; else DOCS[id].push(rec);
      save(LS_DOCS,DOCS);
      if(typeof logActivity==="function"){try{logActivity("upload_file",BYID[id]);}catch(e){}}
      renderCurrentKeepOpen();
    });
  }).catch(function(e){ vntBusyOff(); vntAlert("No se pudo subir el archivo: "+e); });
}
function docDownload(id,key){
  if(!SB){ vntAlert("Sin conexión con el servidor."); return; }
  SB.storage.from(SB_BUCKET).createSignedUrl(key,120).then(function(r){
    if(r.error||!r.data){ vntAlert("No se pudo generar el enlace de descarga."+(r.error?" "+r.error.message:"")); return; }
    const rec=docsOf(id).find(x=>x.key===key);
    const a=document.createElement("a"); a.href=r.data.signedUrl; a.download=(rec&&rec.name)||"documento"; a.target="_blank"; document.body.appendChild(a); a.click(); a.remove();
  });
}
function docDelete(id,key){ vntConfirm("¿Eliminar este documento de respaldo?","Sí, eliminar","Cancelar",function(){
  if(!SB){ return; }
  SB.storage.from(SB_BUCKET).remove([key]).then(function(){
    return SB.from("documents").delete().eq("requirement_id",id).eq("storage_path",key);
  }).then(function(){
    DOCS[id]=docsOf(id).filter(x=>x.key!==key); save(LS_DOCS,DOCS); renderCurrentKeepOpen();
  }).catch(function(e){ vntAlert("No se pudo eliminar: "+e); });
}); }

/* ---- Box B — Cargar datos para autocompletar ---- */
function reqAutocFields(d){ const s=schemaOf(d); const out=[]; if(s&&Array.isArray(s.fields)){ s.fields.forEach(f=>{ if(f.id&&(f.t==="number"||f.t==="table"||f.t==="comites")) out.push(f); }); } return out; }
/* Requerimientos donde la caja de «Autocompletar con Excel» estorba: se
   completan a mano o se alimentan solos desde otra tabla. */
const NOAUTOC={"3_2_ii":1,"3_2_iii":1,"3_2_iv":1,"5_8_i":1,"5_8_iv":1};
function reqHasAutocomplete(d){ if(!d) return false; if(NOAUTOC[d.id]) return false; if(d.sec==="5") return true; return reqAutocFields(d).length>0; }

function autocPick(inp,id){ const f=inp.files&&inp.files[0]; if(f)autocUpload(id,f); inp.value=""; }
function autocDrop(e,id){ e.preventDefault(); const dz=document.getElementById("dzB-"+id); if(dz)dz.classList.remove("over"); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)autocUpload(id,f); }
function autocUpload(id,file){
  const ext=extOf(file.name);
  if(["xlsx","xls","csv"].indexOf(ext)<0){ vntAlert("Formato no permitido. Usa .xlsx, .xls o .csv."); return; }
  if(file.size>AUTOC_MAX){ vntAlert("El archivo supera el límite de 5 MB."); return; }
  const d=BYID[id];
  if(d&&d.sec==="5"&&typeof personasProcessFile==="function"){ personasProcessFile(file,id); return; }
  parseWorkbook(file).then(wb=>{ const res=autocApply(d,wb); renderCurrentKeepOpen(); showAutocRes(id,res); if(typeof logActivity==="function"){try{logActivity("upload_file",d);}catch(e){}} }).catch(e=>vntAlert("No se pudo leer el archivo: "+e));
}

/* ---- SheetJS workbook parser (reused by Box B and the section-5 loader) ---- */
function parseWorkbook(file){ return new Promise((res,rej)=>{ if(typeof XLSX==="undefined"){rej("La librería de lectura de Excel no está disponible (sin conexión a Internet).");return;} const r=new FileReader(); r.onload=function(e){ try{ const wb=XLSX.read(e.target.result,{type:"array"}); const out={sheetNames:wb.SheetNames,sheets:{}}; wb.SheetNames.forEach(n=>{ const ws=wb.Sheets[n]; const rowsArr=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); const rowsObj=XLSX.utils.sheet_to_json(ws,{defval:""}); const headers=rowsArr.length?rowsArr[0].map(x=>String(x)):[]; out.sheets[n]={rowsArr,rowsObj,headers}; }); res(out); }catch(err){rej(err);} }; r.onerror=()=>rej(r.error); r.readAsArrayBuffer(file); }); }

/* ---- fuzzy column->field matching (shared with section-5 mapping) ---- */
function norm(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function bestField(colname,fields){ const c=norm(colname); if(!c)return null; let best=null,score=0; fields.forEach(f=>{ const fl=norm(f.label); if(!fl)return; let s=0; if(fl===c)s=100; else if(fl.indexOf(c)>=0||c.indexOf(fl)>=0)s=60; else { const cw=c.split(" "),fw=fl.split(" "); const common=cw.filter(w=>w.length>2&&fw.indexOf(w)>=0).length; s=common*15; } if(s>score){score=s;best=f;} }); return score>=30?best:null; }
function autocApply(d,wb){
  const fields=reqAutocFields(d).filter(f=>f.t==="number");
  if(!fields.length) return {mapped:[],unmapped:[],msg:"Este requerimiento no tiene campos numéricos simples para autocompletar."};
  const sheet=wb.sheets[wb.sheetNames[0]]; if(!sheet) return {mapped:[],unmapped:[],msg:"El archivo no tiene hojas legibles."};
  const mapped=[],unmapped=[]; const headers=sheet.headers, firstData=sheet.rowsArr[1]||[];
  headers.forEach((h,i)=>{ if(!String(h).trim())return; const f=bestField(h,fields); if(f){ const val=firstData[i]; if(val!==""&&val!=null){ setF(f.id,String(val)); mapped.push(f.label); } } else unmapped.push(String(h)); });
  if(!mapped.length){ sheet.rowsArr.forEach(r=>{ if(r.length>=2){ const f=bestField(r[0],fields); if(f&&r[1]!==""&&r[1]!=null){ setF(f.id,String(r[1])); mapped.push(f.label); } } }); }
  return {mapped:[...new Set(mapped)],unmapped:[...new Set(unmapped)]};
}
function showAutocRes(id,res){ const el=document.getElementById("autocRes-"+id); if(!el)return; let h=""; if(res.msg){ h=`<div class="gnote">${esc(res.msg)}</div>`; } else { h=`<div class="gnote ok-note">✓ Campos completados: ${res.mapped.length}${res.mapped.length?" ("+res.mapped.map(esc).join(", ")+")":""}.</div>`; if(res.unmapped&&res.unmapped.length) h+=`<div class="gnote" style="margin-top:6px">Columnas no reconocidas: ${res.unmapped.map(esc).join(", ")}.</div>`; } el.innerHTML=h; }
/* ===== Point 1 — Carga automática de Excel de demografía (sección 5) =====
   Lee pestañas de datos crudos (1 fila por persona) o de resumen; prefiere los
   datos crudos; mapea columnas por similitud (variantes en español) y calcula
   todas las tablas 5.1.1–5.3. Procesa en memoria; no almacena el archivo. */
const CATS5=["Alta Gerencia","Gerencia","Jefatura","Operario","Fuerza de Venta","Administrativo","Auxiliar","Otros Profesionales","Otros Técnicos"];
const PCOLMAP={
  categoria:["cat func","cat funcion","categoria","categoria cmf","categoria funcion","categoria funciones","categoria funciones cmf","categoria de funciones","categoria del cargo","categoria funcional","tipo cargo","cargo cmf"],
  sexo:["sexo","genero","sex"],
  nacionalidad:["nacionalidad","pais nacionalidad"],
  fnac:["fecha nacimiento","fecha de nacimiento","fecha nac","f nacimiento"],
  edad:["edad"],
  rangoEdad:["rango edad","rango etario","rango de edad","rango de edades","tramo edad","tramo etario","tramo de edad"],
  fing:["fecha ingreso","fecha de ingreso","fecha contrato","fecha de contrato","f ingreso","ingreso empresa"],
  antig:["antiguedad","antiguedad anos","antiguedad en anos","anos de servicio","anos servicio"],
  rangoAntig:["antiguedad laboral","rango antiguedad","rango etario antiguedad","rango de antiguedad","tramo antiguedad","tramo de antiguedad"],
  contrato:["tipo contrato","tipo de contrato","modalidad contrato"],
  modalidad:["modalidad trabajo","modalidad de trabajo","jornada","tipo de jornada","modalidad jornada"],
  discapacidad:["discapacidad","situacion discapacidad","persona con discapacidad","situacion de discapacidad","en situacion de discapacidad"],
  estado:["estado","estado laboral","situacion","vigencia"]
};
/* Puntaje de parecido entre un encabezado del Excel y una de las columnas que
   necesitamos. 100 = idéntico. Devuelve {key,score}. */
function pScoreHeader(h){ const c=norm(h); if(!c) return null; let best=null,score=0;
  for(const key in PCOLMAP){ for(const variant of PCOLMAP[key]){ const v=norm(variant); let s=0;
    if(v===c)s=100; else if(c.includes(v)||v.includes(c))s=60; else { const cw=c.split(" "),vw=v.split(" "); s=cw.filter(w=>w.length>2&&vw.includes(w)).length*20; }
    if(s>score){score=s;best=key;} } }
  return score>=40?{key:best,score:score}:null; }
function pMatchHeader(h){ const r=pScoreHeader(h); return r?r.key:null; }
/* Asignación GLOBAL: para cada columna que necesitamos se queda el encabezado que
   mejor calza, no el primero que aparezca. Sin esto «Cargo» le ganaba a «Cat Func». */
function pMapHeaders(headers){
  const cand=[];
  headers.forEach(function(h,i){ const r=pScoreHeader(h); if(r) cand.push({i:i,key:r.key,score:r.score,h:String(h)}); });
  cand.sort(function(a,b){ return b.score-a.score || a.i-b.i; });
  const map={}, used={}, names={};
  cand.forEach(function(c){ if(map[c.key]!=null||used[c.i])return; map[c.key]=c.i; used[c.i]=1; names[c.key]=c.h; });
  const unmapped=[]; headers.forEach(function(h,i){ if(!used[i]&&String(h).trim())unmapped.push(String(h)); });
  return {map:map,names:names,unmapped:unmapped};
}
/* Los Excel reales casi nunca traen los encabezados en la primera fila (títulos,
   logos, filas en blanco). Se prueban las primeras filas y se queda la mejor. */
function pFindHeaderRow(rowsArr){
  let best={row:0,info:pMapHeaders((rowsArr[0]||[]).map(function(x){return String(x);})),n:-1};
  best.n=Object.keys(best.info.map).length;
  const lim=Math.min(rowsArr.length,10);
  for(let r=0;r<lim;r++){ const info=pMapHeaders((rowsArr[r]||[]).map(function(x){return String(x);}));
    const n=Object.keys(info.map).length;
    if(n>best.n){ best={row:r,info:info,n:n}; } }
  return best;
}
function sexHM(v){ const s=norm(v); if(!s)return null;
  /* Convención de los archivos de RR.HH. en Chile: F = Femenino, M = Masculino. */
  if(s==="f"||s.indexOf("fem")===0||s.indexOf("muj")>=0) return "m";
  if(s==="m"||s==="h"||s==="v"||s.indexOf("masc")===0||s.indexOf("homb")>=0||s.indexOf("varon")>=0) return "h";
  return null; }
function catIndex(v){ const c=norm(v); if(!c)return 7;
  for(let i=0;i<CATS5.length;i++) if(norm(CATS5[i])===c) return i;
  if(c.includes("alta"))return 0;
  if(c.includes("subgeren")||c.includes("gerente")||c.includes("gerencia"))return 1;
  if(c.includes("jefat")||c.includes("jefe"))return 2;
  if(c.includes("operario")||c.includes("operativo"))return 3;
  if(c.includes("venta")||c.includes("comercial")||c.includes("fuerza"))return 4;
  if(c.includes("administ"))return 5;
  if(c.includes("auxiliar"))return 6;
  if(c.includes("profesional"))return 7;
  if(c.includes("tecnic"))return 8;
  return 7; }
function excelDate(v){ if(v instanceof Date)return v;
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400*1000)); return isNaN(+d)?null:d; }
  const s=String(v).trim(); if(!s) return null;
  /* Formato ISO (aaaa-mm-dd) PRIMERO: es el que guardan los campos de fecha del
     sitio y el que traen muchos Excel. Sin esto, «1975-05-01» entraba por la
     regla de dd/mm/aaaa y se leía como día 75 del mes 5 del año 2001. */
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return new Date(+m[1],(+m[2])-1,+m[3]);
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);   /* dd/mm/aaaa */
  if(m){ let y=+m[3]; if(y<100)y+=2000; return new Date(y,(+m[2])-1,+m[1]); }
  const t=Date.parse(s); return isNaN(t)?null:new Date(t); }
/* «15 años y 0 meses» → 15 · «7,5» → 7.5 · «Mas de 12» → null (eso lo ve bucketFromText) */
function parseAnos(v){ if(v==null) return null;
  const s=String(v).trim().replace(",",".");
  if(!s) return null;
  /* Si es la etiqueta de un tramo («Menor a 3 años», «5 - 10 años», «Más de 12»)
     no es un número: lo resuelve bucketFromText, no esta función. */
  if(/men(or|os)|m[aá]s|entre|hasta|sobre|superior|inferior/i.test(s)) return null;
  if(/\d\s*[-–—a]\s*\d/.test(s)) return null;
  let m=s.match(/(\d+(?:\.\d+)?)\s*a[nñ]os?/i); if(m) return parseFloat(m[1]);
  m=s.match(/^(\d+(?:\.\d+)?)$/); if(m) return parseFloat(m[1]);
  return null; }
/* Traduce un rango escrito («Menor de 30», «Entre 41 Y 50», «Mas de 12») al tramo
   que corresponde, usando la función de tramos que se le pase. */
function bucketFromText(v,fn){ const s=norm(v); if(!s)return -1;
  const nums=(s.match(/\d+/g)||[]).map(Number); if(!nums.length)return -1;
  if(nums.length>=2) return fn((nums[0]+nums[nums.length-1])/2);
  if(/menor|menos|hasta|bajo|inferior/.test(s)) return fn(nums[0]-1);
  if(/mayor|mas|sobre|superior|desde/.test(s))  return fn(nums[0]+1);
  return fn(nums[0]); }
function ageOf(p){ const n=parseAnos(p.edad); if(n!=null&&n>0&&n<120)return n;
  if(p.fnac){ const d=excelDate(p.fnac); if(d)return YEAR-d.getFullYear(); } return null; }
function ageBucket(a){ if(a==null)return -1; if(a<30)return 0; if(a<=40)return 1; if(a<=50)return 2; if(a<=60)return 3; if(a<=70)return 4; return 5; }
/* Los archivos de RR.HH. traen sus propios tramos, y no siempre son los de la
   CMF. El de VanTrust 2025 usa «Entre 41 Y 50» (que sí calza); otro usa
   «45 - 54» o «5 - 10 años» (que no). Si los cortes no calzan, ese tramo se
   ignora y se recalcula desde la edad o la antigüedad en años. */
const CMF_EDAD_OK  ={29:1,30:1,31:1,40:1,41:1,50:1,51:1,60:1,61:1,70:1,71:1};
const CMF_ANTIG_OK ={2:1,3:1,4:1,6:1,7:1,9:1,10:1,12:1,13:1};
function rangosCalzan(valores,permitidos){
  let vistos=0;
  for(const v of valores){ const nums=(String(v).match(/\d+/g)||[]).map(Number);
    if(!nums.length) continue; vistos++;
    for(const x of nums){ if(!permitidos[x]) return false; } }
  return vistos>0; }
function ageBucketOf(p,usarRango){
  if(usarRango&&p.rangoEdad!=null&&String(p.rangoEdad).trim()!==""){ const b=bucketFromText(p.rangoEdad,ageBucket); if(b>=0)return b; }
  const a=ageOf(p); if(a!=null) return ageBucket(a);
  if(p.rangoEdad!=null&&String(p.rangoEdad).trim()!=="") return bucketFromText(p.rangoEdad,ageBucket);
  return -1; }
function senYears(p){ const n=parseAnos(p.antig); if(n!=null)return n;
  if(p.fing){ const d=excelDate(p.fing); if(d)return YEAR-d.getFullYear(); } return null; }
function senBucket(y){ if(y==null)return -1; if(y<3)return 0; if(y<=6)return 1; if(y<=9)return 2; if(y<=12)return 3; return 4; }
function senBucketOf(p,usarRango){
  if(usarRango&&p.rangoAntig!=null&&String(p.rangoAntig).trim()!==""){ const b=bucketFromText(p.rangoAntig,senBucket); if(b>=0)return b; }
  const y=senYears(p); if(y!=null)return senBucket(y);
  if(p.rangoAntig!=null&&String(p.rangoAntig).trim()!=="") return bucketFromText(p.rangoAntig,senBucket);
  if(p.antig!=null&&String(p.antig).trim()!=="") return bucketFromText(p.antig,senBucket);
  return -1; }
function contractIndex(v){ const c=norm(v); if(!c)return -1; if(c.includes("indefinido"))return 0; if(c.includes("fijo")||c.includes("plazo"))return 1; if(c.includes("obra")||c.includes("faena"))return 2; if(c.includes("honorar")||c.includes("servicio"))return 3; return -1; }
/* Filas del cuadro 5.3: 0 ordinaria · 1 parcial · 2 teletrabajo parcial · 3 teletrabajo completo · 4 pacto */
function modalityIndex(v){ const c=norm(v); if(!c)return -1;
  if(c.includes("hibrid"))return 2;
  if(c.includes("tele"))return c.includes("parcial")?2:3;
  if(c.includes("presencial"))return 0;
  if(c.includes("parcial"))return 1;
  if(c.includes("pacto")||c.includes("adaptab")||c.includes("familiar"))return 4;
  if(c.includes("ordinaria")||c.includes("jornada")||c.includes("completa"))return 0;
  return -1; }
function isDisab(v){ const s=norm(v); if(!s||s==="no"||s==="n"||s.includes("sin disc"))return false; return s==="si"||s==="s"||s.startsWith("si")||s==="1"||s==="true"||s.includes("con disc")||s.includes("situacion de disc")||s.includes("discapac"); }
function isBaja(v){ const s=norm(v); if(!s)return false; return /inactiv|baja|egres|desvincul|finiquit|retirad|cesad|salida/.test(s); }
function natName(v){ const s=String(v==null?"":v).trim().replace(/\s+/g," "); if(!s)return "No informada";
  return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
/* Qué tan buena pinta tiene una pestaña para ser la nómina vigente */
function sheetScore(name,nkeys,nrows){
  let s=nkeys*10+Math.min(nrows,500)/100; const n=norm(name);
  if(/dotacion|nomina|personal|planta|activos|colaborador|dotacion vigente/.test(n)) s+=25;
  if(/salida|egreso|baja|renuncia|desvincul|finiquito|rotacion|historic/.test(n))    s-=40;
  if(/tabla|resumen|pivot|grafico|dinamica|indicador/.test(n))                       s-=20;
  return s; }

/* Elige UNA pestaña (la mejor) y cuenta las personas.
   Antes recorría todas y sumaba, así que un archivo con «Dotación» y «salidas»
   contaba dos veces a la gente y mezclaba a quienes ya no están en la empresa. */
function personasCompute(wb){
  let pick=null;
  const cands=[];
  wb.sheetNames.forEach(function(name){
    const sh=wb.sheets[name]; if(!sh||!sh.rowsArr.length)return;
    const hr=pFindHeaderRow(sh.rowsArr);
    const map=hr.info.map;
    const nrows=sh.rowsArr.length-hr.row-1;
    if(map.sexo==null||map.categoria==null||nrows<2) return;
    const sc=sheetScore(name,Object.keys(map).length,nrows);
    cands.push({name:name,sh:sh,hr:hr,score:sc,nrows:nrows});
  });
  cands.sort(function(a,b){ return b.score-a.score; });
  pick=cands[0]||null;

  const persons=[];
  let unmapped=[], names={}, sheetUsed=null, headerRow=0, descartadas=0;
  if(pick){
    sheetUsed=pick.name; headerRow=pick.hr.row; names=pick.hr.info.names; unmapped=pick.hr.info.unmapped;
    const map=pick.hr.info.map, rows=pick.sh.rowsArr;
    for(let r=headerRow+1;r<rows.length;r++){ const row=rows[r]; if(!row||!row.length)continue;
      const get=function(k){ return map[k]!=null?row[map[k]]:undefined; };
      const cat=get("categoria"), sx=get("sexo");
      if((cat==null||cat==="")&&(sx==null||sx===""))continue;
      if(map.estado!=null&&isBaja(get("estado"))){ descartadas++; continue; }
      persons.push({cat:cat,sexo:sx,nacionalidad:get("nacionalidad"),fnac:get("fnac"),edad:get("edad"),
        rangoEdad:get("rangoEdad"),fing:get("fing"),antig:get("antig"),rangoAntig:get("rangoAntig"),
        contrato:get("contrato"),modalidad:get("modalidad"),disc:get("discapacidad")});
    }
  }
  // agregación
  const t511=CATS5.map(()=>({h:0,m:0}));
  const t515=CATS5.map(()=>({h:0,m:0}));
  const t513=CATS5.map(()=>Array.from({length:6},()=>({h:0,m:0})));
  const t514=CATS5.map(()=>Array.from({length:5},()=>({h:0,m:0})));
  const natMap={}; const natOrder=[]; const t512={};
  const t52=[0,1,2,3].map(()=>({h:0,m:0})); const t53=[0,1,2,3,4].map(()=>({h:0,m:0}));
  let sinSexo=0, sinEdad=0, sinAntig=0, sinContrato=0, sinModalidad=0;
  const usarRangoEdad  = rangosCalzan(persons.map(function(x){return x.rangoEdad;}),  CMF_EDAD_OK);
  const usarRangoAntig = rangosCalzan(persons.map(function(x){return x.rangoAntig;}), CMF_ANTIG_OK);
  persons.forEach(function(p){ const sx=sexHM(p.sexo); if(!sx){sinSexo++;return;} const ci=catIndex(p.cat);
    t511[ci][sx]++;
    if(isDisab(p.disc)) t515[ci][sx]++;
    const ab=ageBucketOf(p,usarRangoEdad); if(ab>=0)t513[ci][ab][sx]++; else sinEdad++;
    const sb=senBucketOf(p,usarRangoAntig); if(sb>=0)t514[ci][sb][sx]++; else sinAntig++;
    const nat=natName(p.nacionalidad);
    if(!natMap[nat]){natMap[nat]="nat"+natOrder.length;natOrder.push(nat);} const ng=natMap[nat];
    t512[ci]=t512[ci]||{}; t512[ci][ng]=t512[ci][ng]||{h:0,m:0}; t512[ci][ng][sx]++;
    const cti=contractIndex(p.contrato); if(cti>=0)t52[cti][sx]++; else sinContrato++;
    const mi=modalityIndex(p.modalidad); if(mi>=0)t53[mi][sx]++; else sinModalidad++;
  });
  const totH=t511.reduce(function(a,r){return a+r.h;},0), totM=t511.reduce(function(a,r){return a+r.m;},0);
  return {persons:persons.length,rawSheets:cands.length,sheetUsed:sheetUsed,headerRow:headerRow,
    colNames:names,unmapped:unmapped,descartadas:descartadas,
    avisos:{sinSexo:sinSexo,sinEdad:sinEdad,sinAntig:sinAntig,sinContrato:sinContrato,sinModalidad:sinModalidad,
            usarRangoEdad:usarRangoEdad,usarRangoAntig:usarRangoAntig},
    totH:totH,totM:totM,
    t511,t515,t513,t514,t512,natOrder,natMap,t52,t53};
}

function personasApply(res){
  if(!res.persons)return [];
  const filled=[];
  const num=v=>v?String(v):"";
  // 5.1.1
  TBL["t_511"]=res.t511.map(r=>({h:num(r.h),m:num(r.m)})); filled.push("5.1.1");
  // 5.1.5
  TBL["t_515"]=res.t515.map(r=>({h:num(r.h),m:num(r.m)})); filled.push("5.1.5");
  // 5.1.3 age
  TBL["t_513"]=res.t513.map(rb=>{const o={}; for(let b=0;b<6;b++){o["e"+(b+1)+"h"]=num(rb[b].h);o["e"+(b+1)+"m"]=num(rb[b].m);} return o;}); filled.push("5.1.3");
  // 5.1.4 seniority
  TBL["t_514"]=res.t514.map(rb=>{const o={}; for(let b=0;b<5;b++){o["a"+(b+1)+"h"]=num(rb[b].h);o["a"+(b+1)+"m"]=num(rb[b].m);} return o;}); filled.push("5.1.4");
  // 5.1.2 nationality (dynamic columns)
  TBL["t_512__g"]=res.natOrder.map(n=>({id:res.natMap[n],name:n}));
  TBL["t_512"]=CATS5.map((_,ci)=>{const o={}; res.natOrder.forEach(n=>{const g=res.natMap[n]; const cell=(res.t512[ci]&&res.t512[ci][g])||{h:0,m:0}; o[g+"_h"]=num(cell.h); o[g+"_m"]=num(cell.m);}); return o;}); filled.push("5.1.2");
  // 5.2 contract
  TBL["t_52"]=res.t52.map(r=>({h:num(r.h),m:num(r.m)})); filled.push("5.2");
  // 5.3 modality
  TBL["t_53"]=res.t53.map(r=>({h:num(r.h),m:num(r.m)})); filled.push("5.3");
  tblSave();
  ["t_511","t_515","t_513","t_514","t_512__g","t_512","t_52","t_53"].forEach(function(tid){ sbUpsertTable(tid); });
  return filled;
}

/* ---- Texto literal de la norma -------------------------------------------
   Varios textos se copiaron desde el PDF de la CMF, así que traen los cortes
   de línea del documento original —incluso palabras partidas con guión, como
   «inversio-\nnes»—. Mostrados tal cual, quedaban en una columna angosta y
   dentada. Acá se rearman: se pegan las líneas que solo eran un salto de
   página y se respetan las que sí son párrafos o enumeraciones.            */
function normaParrafos(t){
  const lineas=String(t||"").replace(/\r/g,"").split("\n").map(function(x){ return x.trim(); });
  const largos=lineas.filter(Boolean).map(function(x){ return x.length; });
  const max=largos.length?Math.max.apply(null,largos):0;
  const esEnum=function(l){ return /^(\d+[)\.]|[ivxlcdm]{1,4}[)\.]\s|[a-z][)\.]\s|[-–•*]\s)/i.test(l); };
  const mayus=function(l){ return /^[A-ZÁÉÍÓÚÑ0-9¿"“(]/.test(l); };
  const cierra=function(b){ return /[.:;]$/.test(b); };
  const out=[]; let buf="", ultLargo=0;
  lineas.forEach(function(l){
    if(!l){ if(buf){ out.push(buf); buf=""; } return; }
    if(!buf){ buf=l; ultLargo=l.length; return; }
    /* una línea claramente más corta que el resto era el final de un párrafo,
       no un corte de página */
    const cortaAnt = ultLargo < max*0.75;
    if(esEnum(l) || (mayus(l) && (cierra(buf) || cortaAnt))){ out.push(buf); buf=l; ultLargo=l.length; return; }
    if(/[a-záéíóúñ]-$/.test(buf) && /^[a-záéíóúñ]/.test(l)) buf=buf.slice(0,-1)+l;   /* palabra partida */
    else buf=buf+" "+l;
    ultLargo=l.length;
  });
  if(buf) out.push(buf);
  return out;
}

function pieInner(f){

    a0=a1; });

  const n=parseFloat(s.replace(",",".")); if(isNaN(n)) return "";
  const txt=fmtCL(n)+(suf||""); if(txt===s) return "";
  return `<div class="saved-note" style="margin:2px 0 0 2px;font-size:11.5px">${esc(txt)}</div>`; }
function renderEmissions(f,dis){
  const yrs=[PREV,YEAR];
  const cols=yrs.map(y=>{
    const a1=parseFloat(fv("emi_"+y+"_a1"))||0,a2=parseFloat(fv("emi_"+y+"_a2"))||0,a3=parseFloat(fv("emi_"+y+"_a3"))||0; const tot=a1+a2+a3;
    const donut=donutSVG([{v:a1,color:"#aecadb"},{v:a2,color:"#3a3a3e"},{v:a3,color:"#b03440"}],150);
    const inp=(sk,lab)=>`<div class="gfield" style="margin-top:6px"><label class="glbl">${lab}</label><input type="text" inputmode="decimal" id="f-emi_${y}_${sk}" value="${esc(fv("emi_"+y+"_"+sk))}" ${dis?'disabled':''} oninput="setFNum('emi_${y}_${sk}',this.value)" onchange="normNumBlur(this);renderCurrentKeepOpen()"/>${ecoMiles(fv("emi_"+y+"_"+sk)," t CO₂eq")}</div>`;
    return `<div class="emiyear"><div class="emiyear-h">${y}</div><div style="text-align:center">${donut}</div><div class="saved-note" style="text-align:center;margin:6px 0">Total: ${fmtCL(tot)} t CO₂eq</div>${inp("a1","Alcance 1 (t CO₂eq)")}${inp("a2","Alcance 2 (t CO₂eq)")}${inp("a3","Alcance 3 (t CO₂eq)")}</div>`;
  }).join("");
  const legend=`<div class="emileg"><span><i style="background:#aecadb"></i>Alcance 1</span><span><i style="background:#3a3a3e"></i>Alcance 2</span><span><i style="background:#b03440"></i>Alcance 3</span></div>`;
  return `<div class="gfield"><label class="glbl">${esc(f.label)}</label><div class="emigrid">${cols}</div>${legend}</div>`;
}
function renderAumCov(f,dis){
  const yrs=[PREV,YEAR];
  const rows=yrs.map(y=>{
    const pct=Math.max(0,Math.min(100,parseFloat(fv("aum_"+y+"_pct"))||0));
    const bar=`<div class="aumbar"><div class="aumbar-fill" style="width:${pct}%">${pct>12?fmtCL(pct)+'% medido':''}</div>${pct<=12?`<span class="aumbar-out">${fmtCL(pct)}% medido</span>`:''}</div>`;
    const inp=(sk,lab,suf)=>`<div class="gfield" style="margin-top:6px"><label class="glbl">${lab}</label><input type="text" inputmode="decimal" id="f-aum_${y}_${sk}" value="${esc(fv("aum_"+y+"_"+sk))}" ${dis?'disabled':''} oninput="setFNum('aum_${y}_${sk}',this.value)" onchange="normNumBlur(this);renderCurrentKeepOpen()"/>${ecoMiles(fv("aum_"+y+"_"+sk),suf||"")}</div>`;
    return `<div class="aumyear"><div class="emiyear-h">${y}</div>${bar}<div class="aumins">${inp("monto","AUM incluido (MM$ CLP)"," MM$ CLP")}${inp("pct","% del AUM medido","%")}${inp("pcaf","PCAF promedio")}</div></div>`;
  }).join("");
  return `<div class="gfield"><label class="glbl">${esc(f.label)}</label>${rows}</div>`;
}
