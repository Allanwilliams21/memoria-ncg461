function fmtCL(n){return (Math.round(n*100)/100).toLocaleString("es-CL");}
function formatRUT(v){let s=String(v||"").replace(/[^0-9kK]/g,"").toUpperCase();if(s.length<2)return s;const dv=s.slice(-1);let num=s.slice(0,-1);num=num.replace(/\B(?=(\d{3})+(?!\d))/g,".");return num+"-"+dv;}

/* find a table field def anywhere in SCHEMA by id (for cross refs) */
function tdefById(tid){for(const k in SCHEMA){const s=SCHEMA[k];if(s.fields)for(const f of s.fields)if(f.t==="table"&&f.id===tid)return f;}return null;}
function dotacionTotal(){ // grand total general from 5.1.1 table (t_511): sum H+M of non-NA rows
  const f=tdefById("t_511"); if(!f) return 0; const rows=TBL["t_511"]||[]; let t=0;
  rows.forEach(r=>{ if(r&&!r._na){ t+=nnum(r.h)+nnum(r.m); } }); return t;
}
function colTotal(f,k){ const rows=tblRows(f); let t=0; rows.forEach((r,i)=>{ if(r&&r._na)return; t+=cellNum(f,r,k,i); }); return t; }
function cellNum(f,row,k,i){ const col=f.cols.find(c=>c.k===k); if(!col)return nnum(row?row[k]:0);
  if(col.calc) return calcCell(f,row,col,i); return nnum(row?row[k]:0); }
function calcCell(f,row,col,i){
  const c=col.calc;
  if(c.calc==="sumsub"){ let t=0; (f.cols||[]).forEach(cc=>{ if(cc._dyn&&cc.subk===c.subk) t+=nnum(row[cc.k]); }); return t; }
  if(c.calc==="sumall"){ let t=0; (f.cols||[]).forEach(cc=>{ if(cc._dyn) t+=nnum(row[cc.k]); }); return t; }
  if(c.calc==="sum"){ let t=0; c.of.forEach(k=>t+=nnum(row[k])); return t; }
  if(c.calc==="pct"){ const num=cellNum(f,row,c.num,i); let den=0;
    if(c.den==="@dotacion") den=dotacionTotal();
    else if(c.den==="@dotacionH"){const f2=tdefById("t_511");den=f2?colTotal(f2,"h"):0;}
    else if(c.den==="@dotacionM"){const f2=tdefById("t_511");den=f2?colTotal(f2,"m"):0;}
    else if(c.den&&c.den.indexOf("@coltot:")===0) den=colTotal(f,c.den.slice(8));
    else if(c.den&&c.den.indexOf("@row:")===0) den=cellNum(f,row,c.den.slice(5),i);
    else den=cellNum(f,row,c.den,i);
    return den? (num/den*100):0; }
  return 0;
}
function calcDisplay(f,row,col,i){ const v=calcCell(f,row,col,i); return col.calc.calc==="pct"? (v?fmtCL(v)+"%":"—"): fmtCL(v); }

function dynGroups(fid){ let g=TBL[fid+"__g"]; if(!Array.isArray(g)){ const f=tdefById(fid); const init=(f&&f.dyncols&&f.dyncols.init)||[]; g=JSON.parse(JSON.stringify(init)); TBL[fid+"__g"]=g; tblSave(); } return g; }
function tblAddGrp(fid){ const g=dynGroups(fid); g.push({id:"g"+Date.now(),name:""}); tblSave(fid+"__g"); renderCurrentKeepOpen(); }
function tblDelGrp(fid,gid){ TBL[fid+"__g"]=dynGroups(fid).filter(x=>x.id!==gid||x.locked); tblSave(fid+"__g"); renderCurrentKeepOpen(); }
function tblRenameGrp(fid,gid,v){ const it=dynGroups(fid).find(x=>x.id===gid); if(it)it.name=v; tblSave(fid+"__g"); renderSideOnly(); }
function buildDynCols(f,dis){
  const groups=dynGroups(f.id); const dc=f.dyncols; const sub=dc.sub||[{k:"x",label:""}]; const ct=dc.celltype||"num"; const ph=dc.ph||"Nombre"; const gen=[];

    if(dc.flat){ gen.push({k:grp.id, label:grp.name||"", chead:ctl, type:ct, _dyn:true, subk:"x"}); }

  });

function renderTable(f,dis){
  const rows=tblRows(f); const lead=(f.mode==="fixed"||f.mode==="mirror");
  if(f.dyncols) buildDynCols(f,dis);
  const cols=f.cols.filter(c=>!c.flag||fv(c.flag)==="si");
  let top=""; if(f.toggle) top=`<label class="na" style="margin:0 0 10px"><input type="checkbox" ${fv(f.toggle.id)==="si"?'checked':''} ${dis?'disabled':''} onchange="setSel('${f.toggle.id}',this.checked?'si':'')"/> ${esc(f.toggle.label)}</label>`;
  const grouped=cols.some(c=>c.g||c.gk);
  let head;
  if(grouped){
    let r1="<tr>",r2="<tr>";
    if(lead) r1+=`<th rowspan="2" style="text-align:left">${esc(yrLabel(f.rowLabel||f.nameLabel||""))}</th>`;
    for(let i=0;i<cols.length;){
      const c=cols[i];
      if(c.g||c.gk){ const gk=c.gk||c.g; let j=i; while(j<cols.length&&(cols[j].gk||cols[j].g)===gk)j++; r1+=`<th colspan="${j-i}">${esc(yrLabel(c.g))}${c.gctl||""}</th>`; for(let k=i;k<j;k++)r2+=`<th>${esc(yrLabel(cols[k].label))}</th>`; i=j; }
      else { r1+=`<th rowspan="2">${c.chead||esc(yrLabel(c.label))}</th>`; i++; }
    }
    if(f.na) r1+=`<th rowspan="2">N/A</th>`;
    if(f.mode==="dynamic") r1+=`<th rowspan="2"></th>`;
    head=r1+"</tr>"+r2+"</tr>";
  } else {
    head="<tr>"; if(lead) head+=`<th style="text-align:left">${esc(yrLabel(f.rowLabel||f.nameLabel||""))}</th>`;
    cols.forEach(c=>head+=`<th>${c.chead||esc(yrLabel(c.label))}</th>`);
    if(f.na) head+=`<th>N/A</th>`; if(f.mode==="dynamic") head+=`<th></th>`; head+="</tr>";
  }
  const rdefs=(f.rows||[]).map(r=>(r&&typeof r==="object")?r:{l:r});
  let body="";
  rows.forEach((row,i)=>{
    if(f.mode==="fixed"){ const rd=rdefs[i]; if(rd&&rd.showIf&&fv(rd.showIf.field)!==rd.showIf.equals) return; }
    const na=!!(row&&row._na); const rdis=dis||na;
    let tr=`<tr${na?' style="opacity:.5"':''}>`;
    if(lead) tr+=`<td class="catname">${esc(yrLabel(f.mode==="mirror"?(row._key||""):(rdefs[i]?rdefs[i].l:f.rows[i])))}</td>`;
    cols.forEach(c=>{ tr+=`<td${c.calc?' class="calc"':''}>${cellInput(f,c,i,row,rdis)}</td>`; });
    if(f.na) tr+=`<td class="nacell"><label class="na"><input type="checkbox" ${na?'checked':''} ${role==="revisor"?'':'disabled'} onchange="tblRowNA('${f.id}',${i},this.checked)"/> N/A</label></td>`;
    if(f.mode==="dynamic") tr+=`<td><button class="tiny-btn" ${dis?'disabled':''} onclick="tblDelRow('${f.id}',${i})" title="Eliminar">🗑</button></td>`;
    tr+="</tr>"; body+=tr;
  });
  if(f.totals){ let tr=`<tr class="totals"><td class="catname">Total</td>`;
    cols.forEach(c=>{ if(c.type==="num"||c.calc){ tr+=`<td id="tc-${f.id}-TOT-${c.k}">${fmtCL(colTotal(f,c.k))}</td>`; } else tr+="<td></td>"; });
    if(f.na) tr+="<td></td>"; tr+="</tr>"; body+=tr; }
  let h=top+`<div style="overflow-x:auto"><table class="dt">${head}${body}</table></div>`;
  if(f.mode==="dynamic") h+=`<div class="row-actions"><button class="btn ghost" ${dis?'disabled':''} onclick="tblAddRow('${f.id}')">${esc(f.add||"+ Agregar fila")}</button></div>`;
  if(f.dyncols) h+=`<div class="row-actions"><button class="btn ghost" ${dis?'disabled':''} onclick="tblAddGrp('${f.id}')">${esc(f.dyncols.addLabel||"+ Agregar columna")}</button></div>`;
  if(f.mode==="mirror"&&rows.length===0) h+=`<div class="gnote wait">Primero registra los directores en 3.2.i — Identificación de directores.</div>`;
  return h;
}
function cellInput(f,c,i,row,dis){
  const v=row?(row[c.k]==null?"":row[c.k]):""; const cid=`f-${f.id}-${i}-${c.k}`;
  if(c.calc) return `<span id="tc-${f.id}-${i}-${c.k}">${calcDisplay(f,row||{},c,i)}</span>`;
  if(c.cond && (!row || String(row[c.cond.col]||"")!==c.cond.eq)) return `<span style="color:#bbb">—</span>`;
  if(c.type==="src"){
    const srcRows=TBL[(c.src&&c.src.table)]||[];
    const key=(c.src&&c.src.keyCol)||"nombre";
    const hit=srcRows.filter(function(r2){ return r2&&String(r2[key]||"")===String(row&&row._key||""); })[0];
    const val=hit?String(hit[c.src.col]==null?"":hit[c.src.col]):"";
    return val?`<span>${esc(val)}</span>`:`<span style="color:#bbb">— sin registrar —</span>`;
  }
  /* Igual que namedrop, pero además deja escribir un nombre que no esté en
     la lista: los comités pueden tener integrantes que no son directores. */
  if(c.type==="nameopen"){
    const opts=[...new Set((TBL[(c.src&&c.src.table)]||[]).map(function(r2){ return r2&&r2[c.src.col]; }).filter(Boolean))];
    const lid=`dl-${f.id}-${i}-${c.k}`;
    return `<input list="${lid}" style="min-width:150px" value="${esc(v)}" placeholder="${esc(c.ph||"Nombre")}" ${dis?'disabled':''} oninput="tblSetCell('${f.id}',${i},'${c.k}',this.value)"/>`
      + `<datalist id="${lid}">`+opts.map(function(x){ return `<option value="${esc(x)}"></option>`; }).join("")+`</datalist>`;
  }
  if(c.type==="namedrop"){ const opts=[...new Set((TBL[c.src.table]||[]).map(r2=>r2&&r2[c.src.col]).filter(Boolean))]; const o=`<option value="">—</option>`+opts.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join(""); return `<select ${dis?'disabled':''} onchange="tblSetCell('${f.id}',${i},'${c.k}',this.value)">${o}</select>`; }
  if(c.type==="select"){ let o=`<option value="">—</option>`+(c.opts||[]).map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join("");
    return `<select ${dis?'disabled':''} onchange="tblSetCell('${f.id}',${i},'${c.k}',this.value)">${o}</select>`; }
  if(c.type==="textarea") return `<textarea rows="2" style="min-width:150px" ${dis?'disabled':''} oninput="tblSetCell('${f.id}',${i},'${c.k}',this.value)">${esc(v)}</textarea>`;
  if(c.type==="check") return `<input type="checkbox" ${v===true||v==="1"?'checked':''} ${dis?'disabled':''} onchange="tblSetCell('${f.id}',${i},'${c.k}',this.checked)"/>`;
  if(c.type==="date") return `<input type="date" value="${esc(v)}" ${dis?'disabled':''} onchange="tblSetCell('${f.id}',${i},'${c.k}',this.value)"/>`;
  if(c.type==="rut") return `<input type="text" value="${esc(v)}" placeholder="12.345.678-9" ${dis?'disabled':''} oninput="this.value=formatRUT(this.value);tblSetCell('${f.id}',${i},'${c.k}',this.value)"/>`;
  if(c.type==="num"){ const inp=`<input type="text" inputmode="decimal" style="width:66px" value="${esc(v)}" ${dis?'disabled':''} oninput="tblSetCellNum('${f.id}',${i},'${c.k}',this.value)" onchange="normNumBlur(this)"/>`;
    return c.suffix?`<span class="withsuffix">${inp}<span class="sfx">${esc(c.suffix)}</span></span>`:inp; }
  if(c.type==="odsmeta"){ const arr=Array.isArray(v)?v:[]; const chips=arr.length?arr.slice().sort(odsMetaSort).map(x=>odsMetaChip(x)).join(""):`<span class="ods-empty">— sin asignar —</span>`; const btn=dis?"":`<button type="button" class="tiny-btn ods-edit" onclick="odsMetaOpen('${f.id}',${i},'${c.k}')">ODS ▾</button>`; return `<div class="ods-cell">${chips} ${btn}</div>`; }
  // text
  return `<input type="text" style="min-width:120px" value="${esc(v)}" placeholder="${esc(c.ph||'')}" ${dis?'disabled':''} oninput="tblSetCell('${f.id}',${i},'${c.k}',this.value)"/>`;
}
function recalcTables(){
  document.querySelectorAll("[id^='tc-']").forEach(el=>{
    const m=el.id.match(/^tc-(.+)-(TOT|\d+)-(.+)$/); if(!m) return;
    const tid=m[1], part=m[2], k=m[3]; const f=tdefById(tid); if(!f) return;
    if(part==="TOT"){ el.textContent=fmtCL(colTotal(f,k)); }
    else { const row=(TBL[tid]||[])[+part]||{}; const col=f.cols.find(c=>c.k===k); if(col&&col.calc) el.textContent=calcDisplay(f,row,col,+part); }
  });
  document.querySelectorAll("[id^='tcv-']").forEach(el=>{ const fid=el.id.slice(4); const fn=TCALC[fid]; if(fn) el.textContent=fn(); });
}
/* table-derived summary fields (tcalc) */
let TCALC={};
/* Porcentaje que se calcula solo a partir de otros dos campos numéricos.
   No se escribe: se muestra. */
/* ---- Campo de archivo: sube una imagen o un PDF y lo muestra ahí mismo ----
   Reutiliza el mismo almacenamiento que los documentos de respaldo (bucket
   «respaldo» + tabla documents), así que hereda sus permisos y su cuota. */
var FILEFIELD={};
(function buildFileFields(){ try{
  DATA.forEach(function(d){ const sc=SCHEMA[sk(d)]; if(!sc||!Array.isArray(sc.fields))return;
    sc.fields.forEach(function(f){ if(f&&f.t==="file"&&f.id) FILEFIELD[f.id]={req:d.id,accept:(f.accept||["pdf","png","jpg","jpeg"])}; }); });
}catch(e){ console.warn("[file] buildFileFields:",e); } })();

/* ===================================================================
   1.1 — Índice de contenidos, armado solo
   -------------------------------------------------------------------
   La norma pide un índice que permita al regulador localizar cada
   contenido: el código de la sección de la NCG (por ejemplo «5.4.2
   Brecha salarial»), la página de la memoria donde está, y la
   referencia al estándar internacional usado. La estructura ya la
   conoce el sitio, así que se genera sola; lo único que hay que
   escribir es la página, y eso recién cuando el Word esté armado.
   Las páginas de la memoria anterior vienen precargadas como punto
   de partida.
   =================================================================== */
function indiceRows(){
  const out=[];
  MAIN.forEach(function(m){
    if(String(m.code)==="1") return;                 /* el índice no se indexa a sí mismo */
    const reqs=DATA.filter(function(d){ return String(d.sec)===String(m.code) && countableReq(d); });
    const narr=LEAF_NARR[m.code];
    if(!reqs.length && !narr) return;
    out.push({tipo:"sec",code:m.code,label:m.code+". "+m.name});
    let subActual=null;
    reqs.forEach(function(d){
      const sub=d.sub||d.sec;
      if(sub!==subActual && sub!==String(m.code)){
        subActual=sub;
        /* La sección 9 tiene numeración propia (las NIIF son voluntarias),
           así que su nombre y su número salen de sec9subs, no de SUBNAME:
           ahí «9.1» es el código interno de Métricas SASB y confundía. */
        const i9=(String(m.code)==="9")?sec9info(sub):null;
        if(i9){
          if(!i9.off) out.push({tipo:"sub",code:i9.num,label:i9.num+" "+i9.name});
        } else {
          let nom=(typeof SUBNAME!=="undefined"&&SUBNAME[sub])?SUBNAME[sub]:"";
          if(!nom&&typeof SUBGROUP!=="undefined"&&SUBGROUP[sub]) nom=SUBGROUP[sub];
          if(!nom){ const padre=String(sub).split(".").slice(0,2).join(".");
            if(typeof SUBNAME!=="undefined"&&SUBNAME[padre]) nom=SUBNAME[padre]; }
          out.push({tipo:"sub",code:sub,label:sub+(nom?" "+nom:"")});
        }
      }
      /* si las NIIF no aplican, esa materia no va en la memoria */
      if(String(m.code)==="9"){ const i9=sec9info(d.sub); if(i9&&i9.off) return; }
      out.push({tipo:"req",key:d.id,code:reqLabel(d),
        label:reqShort(d)+((reqVoluntario(d)&&!/voluntari/i.test(reqShort(d)))?" (voluntario)":""),
        vol:reqVoluntario(d),d:d});
    });
    if(!reqs.length && narr) out.push({tipo:"req",key:narr,code:String(m.code),label:m.name,d:null});
  });
  return out;
}
/* Sincroniza t_indice con la estructura actual, sin pisar lo ya escrito.
   Las filas se guardan por _key (id del requerimiento), igual que las tablas
   espejo, así que agregar o quitar requerimientos no desordena nada. */
function indiceSync(){
  const items=indiceRows().filter(function(x){ return x.tipo==="req"; });
  const cur=Array.isArray(TBL["t_indice"])?TBL["t_indice"]:[];
  const out=items.map(function(it){
    const prev=cur.filter(function(r){ return r&&r._key===it.key; })[0];
    if(prev) return prev;
    /* Sin páginas precargadas: las de la memoria anterior no sirven, porque el
       documento de este año todavía no está diagramado y confundirían. */
    return {_key:it.key};
  });
  TBL["t_indice"]=out;
  return out;
}
function indiceCell(key){ const r=(TBL["t_indice"]||[]).filter(function(x){ return x&&x._key===key; })[0]; return r||{}; }
function indiceIdx(key){ return (TBL["t_indice"]||[]).findIndex(function(x){ return x&&x._key===key; }); }
function indiceStats(){ const rows=TBL["t_indice"]||[];
  return {total:rows.length, conPag:rows.filter(function(r){ return r&&String(r.pag||"").trim()!==""; }).length}; }
function renderIndice(f,dis){
  indiceSync();
  const items=indiceRows(); const st=indiceStats();
  let body="";
  items.forEach(function(it){
    if(it.tipo==="sec"){ body+=`<tr class="idx-sec"><td colspan="3">${esc(it.label)}</td></tr>`; return; }
    if(it.tipo==="sub"){ body+=`<tr class="idx-sub"><td colspan="3">${esc(it.label)}</td></tr>`; return; }
    const i=indiceIdx(it.key), c=indiceCell(it.key);
    body+=`<tr><td class="idx-code">${esc(it.code)}</td><td class="idx-txt">${esc(it.label)}</td>`
      + `<td><input type="text" style="width:80px" value="${esc(c.pag||"")}" placeholder="p. ej. 24" ${dis?'disabled':''} oninput="tblSetCell('t_indice',${i},'pag',this.value)"/></td></tr>`;
  });
  const barra=st.total?Math.round(st.conPag/st.total*100):0;
  return `<div class="progress-wrap" style="margin:0 0 10px"><div class="bar"><i style="width:${barra}%"></i></div><div class="pct">${st.conPag} de ${st.total} con página</div></div>
  <div style="overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid #e6e4dd;border-radius:4px">
   <table class="dt idx"><tr><th style="text-align:left;width:110px">Código NCG</th><th style="text-align:left">Contenido</th><th style="width:100px">Página</th></tr>${body}</table></div>
  <div class="row-actions" style="margin-top:10px"><button class="btn ghost" onclick="descargarIndice()">⬇ Descargar índice (CSV)</button><span class="saved-note">Para pegarlo en el Word o entregárselo a la IA que arma el borrador.</span></div>`;
}

/* ===================================================================
   3.2.xiii — Conformación del Directorio, calculada desde 3.2.i
   -------------------------------------------------------------------
   La norma pide cinco desgloses de los directores (sexo, nacionalidad,
   edad, antigüedad y discapacidad), todos «distinguiendo entre titulares
   y suplentes». Antes había que escribirlos a mano, uno por uno, con la
   información que ya estaba en la tabla de directores. Ahora se calculan
   solos: se completa 3.2.i y estas tablas se llenan.
   =================================================================== */
/* Los cuadros derivados de 3.2.xiii y la brecha del Directorio se informan CON LA
   COMPOSICIÓN AL CIERRE DEL EJERCICIO. Quien renunció durante el año se registra en
   3.2.i con «¿Vigente al cierre?» = No para poder declarar su remuneración en 3.2.ii
   —el cuadro de remuneraciones sí lo muestra, porque percibió dieta— pero no cuenta
   en los conteos por sexo, nacionalidad, edad, antigüedad ni discapacidad.
   Vacío se toma como vigente, para no romper lo ya cargado. */
function dirRows(){ return (TBL["t_dir"]||[]).filter(function(r){
  return r && String(r.nombre||"").trim()!=="" && norm(r.vigente)!=="no"; }); }
/* Todos los directores del ejercicio, vigentes o no (lo que usa 3.2.ii). */
function dirRowsAll(){ return (TBL["t_dir"]||[]).filter(function(r){
  return r && String(r.nombre||"").trim()!==""; }); }
/* En qué casilla cae cada director: titular/suplente × hombre/mujer */
function dirSlot(r){
  const g=norm(r.genero), t=norm(r.titular);
  const h=(g.indexOf("hombre")===0||g==="h"||g.indexOf("masc")===0);
  const m=(g.indexOf("mujer")===0||g==="m"||g.indexOf("fem")===0);
  if(!h&&!m) return null;
  return (t.indexOf("suplente")>=0?"s":"t")+(h?"h":"m");
}
function dirEdad(r){ const d=excelDate(r.fnac); return d?(YEAR-d.getFullYear()):null; }
function dirAntig(r){ const d=excelDate(r.f_ing)||excelDate(r.f_elec); return d?(YEAR-d.getFullYear()):null; }
const DIR_EDAD_LBL =["Menor de 30","30 a 40","41 a 50","51 a 60","61 a 70","Mayor de 70"];
const DIR_ANTIG_LBL=["Menos de 3 años","3 a 6 años","Más de 6 a 9 años","9 a 12 años","Más de 12 años"];

/* Arma las filas de cada desglose y avisa a quién le falta el dato. */
function dirBreak(kind){
  const rows=dirRows(); const faltan=[]; const sinSexo=[];
  const mk=function(l){ return {l:l,th:0,tm:0,sh:0,sm:0}; };
  let out=[];
  if(kind==="total")      out=[mk("Directores")];
  else if(kind==="edad")  out=DIR_EDAD_LBL.map(mk);
  else if(kind==="antig") out=DIR_ANTIG_LBL.map(mk);
  else if(kind==="disc")  out=[mk("En situación de discapacidad")];
  const porNac={};
  rows.forEach(function(r){
    const slot=dirSlot(r);
    if(!slot){ sinSexo.push(r.nombre); return; }
    if(kind==="total"){ out[0][slot]++; return; }
    if(kind==="nac"){
      const nm=String(r.nac||"").trim();
      if(!nm){ faltan.push(r.nombre); return; }
      const key=nm.charAt(0).toUpperCase()+nm.slice(1).toLowerCase();
      if(!porNac[key]) porNac[key]=mk(key);
      porNac[key][slot]++; return; }
    if(kind==="edad"){ const a=dirEdad(r); if(a==null){ faltan.push(r.nombre); return; }
      out[ageBucket(a)][slot]++; return; }
    if(kind==="antig"){ const y=dirAntig(r); if(y==null){ faltan.push(r.nombre); return; }
      out[senBucket(y)][slot]++; return; }
    if(kind==="disc"){ const v=norm(r.disc);
      if(!v){ faltan.push(r.nombre); return; }
      if(v==="si"||v.indexOf("si")===0) out[0][slot]++; return; }
  });
  if(kind==="nac") out=Object.keys(porNac).sort().map(function(k){ return porNac[k]; });
  return {rows:out,faltan:faltan,sinSexo:sinSexo,total:rows.length};
}

/* ---- 3.2.xiii.f — Brecha del Directorio, desde la tabla de remuneraciones ---- */
function dirRemTot(nombre){
  const r=(TBL["t_rem"]||[]).filter(function(x){ return x&&x._key===nombre; })[0];
  if(!r) return null;
  const fija=parseFloat(r.f0);
  const varr=(fv("flag_remvar")==="si")?parseFloat(r.v0):NaN;
  if(isNaN(fija)&&isNaN(varr)) return null;
  return (isNaN(fija)?0:fija)+(isNaN(varr)?0:varr);
}
function mediana(a){ if(!a.length) return null; const b=a.slice().sort(function(x,y){return x-y;});
  const m=Math.floor(b.length/2); return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function promedio(a){ return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null; }
function dirBrecha(){
  const H=[],M=[],sinDato=[],monedas={};
  dirRows().forEach(function(r){
    const slot=dirSlot(r); if(!slot) return;
    const v=dirRemTot(r.nombre);
    const rr=(TBL["t_rem"]||[]).filter(function(x){ return x&&x._key===r.nombre; })[0];
    if(rr&&rr.mon) monedas[rr.mon]=1;
    if(v==null){ sinDato.push(r.nombre); return; }
    (slot.charAt(1)==="h"?H:M).push(v);
  });
  const pH=promedio(H), pM=promedio(M), mH=mediana(H), mM=mediana(M);
  const pct=function(h,m){ return (h!=null&&m!=null&&h!==0)?Math.round((h-m)/h*1000)/10:null; };
  return {nH:H.length,nM:M.length,promH:pH,promM:pM,medH:mH,medM:mM,
          brechaMedia:pct(pH,pM),brechaMediana:pct(mH,mM),
          sinDato:sinDato,monedas:Object.keys(monedas)};
}
function renderDirBrecha(f,dis){
  if(!dirRows().length)
    return `<div class="gnote wait">Primero registra a los directores en <b>3.2.i</b> y sus remuneraciones en <b>3.2.ii</b>.</div>`;
  const b=dirBrecha();
  const num=function(x){ return x==null?"—":fmtCL(Math.round(x*100)/100); };
  const p=function(x){ return x==null?"—":(x+" %"); };
  const tab=`<div style="overflow-x:auto"><table class="dt">
    <tr><th style="text-align:left">Indicador</th><th>Hombres</th><th>Mujeres</th><th>Brecha</th></tr>
    <tr><td class="catname">Remuneración promedio (${repYear()})</td><td>${num(b.promH)}</td><td>${num(b.promM)}</td><td><b>${p(b.brechaMedia)}</b></td></tr>
    <tr><td class="catname">Remuneración mediana (${repYear()})</td><td>${num(b.medH)}</td><td>${num(b.medM)}</td><td><b>${p(b.brechaMediana)}</b></td></tr>
    <tr><td class="catname">Nº de directores considerados</td><td>${b.nH}</td><td>${b.nM}</td><td>${b.nH+b.nM}</td></tr>
  </table></div>`;
  let avisos="";
  if(b.sinDato.length) avisos+=`<div class="gnote" style="border-left-color:#d4a017;background:#fdf7e8;color:#7a5a10">Sin remuneración registrada en 3.2.ii (quedan fuera del cálculo): ${b.sinDato.map(esc).join(", ")}.</div>`;
  if(b.monedas.length>1) avisos+=`<div class="gnote" style="border-left-color:var(--burgundy);background:#fbe9e9;color:#8c2b2b">⚠️ Hay remuneraciones en más de una moneda (${b.monedas.map(esc).join(", ")}). El promedio mezcla unidades distintas: conviene registrar todo en la misma moneda en 3.2.ii.</div>`;
  if(b.nH===0||b.nM===0) avisos+=`<div class="gnote">Con directores de un solo sexo la brecha no se puede calcular.</div>`;
  return `<div class="saved-note" style="margin-bottom:6px">Calculado desde <b>3.2.ii — Remuneraciones del Directorio</b> (remuneración fija de ${repYear()}, más la variable si está activada). La brecha es <i>(hombres − mujeres) / hombres</i>.</div>`
    + tab + avisos;
}

/* ===== Section 3.3 — Comités (bespoke: Parte A registro + Parte B integrantes) ===== */
function renderComites(f,disIn){

/* ----- notificar una sola vez por persona ----- */
/* Acumula en un solo aviso todos los requerimientos que el revisor va asignando a una
   persona. No se envía nada solo: el revisor aprieta "Enviar" en Notificaciones. Una vez
   enviado, esa persona queda en NOTIF.notified y no se le vuelve a armar un aviso de
   asignación (los recordatorios de pendientes son aparte). */
function maybeNotify(name,reqId){ if(!name) return;
  let e=NOTIF.queue.filter(function(x){ return x.type==="assign"&&x.name===name&&!x.sent; })[0];
  if(!e){ if(NOTIF.notified[name]) return;
    e={type:"assign",name:name,email:emailOf(name),ts:nowStr(),reqs:[],sent:false}; NOTIF.queue.push(e); }
  e.email=emailOf(name); e.reqs=e.reqs||[];
  if(reqId&&e.reqs.indexOf(reqId)<0) e.reqs.push(reqId);
  e.updated=nowStr(); saveNotif(); }
/* Quita un requerimiento del aviso pendiente si se desasigna antes de enviarlo */
function unNotify(name,reqId){ if(!name||!reqId) return;
  NOTIF.queue.forEach(function(x){ if(x.type==="assign"&&x.name===name&&!x.sent&&Array.isArray(x.reqs)){
    const i=x.reqs.indexOf(reqId); if(i>=0) x.reqs.splice(i,1); } });
  NOTIF.queue=NOTIF.queue.filter(function(x){ return !(x.type==="assign"&&!x.sent&&Array.isArray(x.reqs)&&x.reqs.length===0); });
  saveNotif(); }

/* ----- permisos ----- */
/* ----- cadena lineal de estados -----
   pend / draft / fix  → editable por el responsable asignado y por el revisor
   sent (en revisión)  → el responsable queda bloqueado; el revisor sí puede editar
   rev (aprobado)      → nadie edita, hasta que el revisor presione «Editar» (reabreReq)
   comp                → igual que aprobado                                          */
const ST_LOCK_ALL={rev:1,comp:1};   // completado: bloqueado para todos (incluye comentarios)
const ST_LOCK_RESP={sent:1};        // enviado a revisión: bloqueado para el responsable (turno del revisor)
const ST_LOCK_REV={fix:1};          // requiere ajustes: bloqueado para el revisor (turno del responsable)
/* Desbloqueo momentáneo que el revisor puede pedir sin cambiar la etiqueta.
   Se limpia solo cuando el requerimiento cambia de estado. */
const REVUNLOCK={};
function revUnlock(id){ if(role!=="revisor") return; REVUNLOCK[id]=true; renderSide(); renderCurrentKeepOpen(); }
function clearRevUnlock(id){ delete REVUNLOCK[id]; }
function canEditStatus(id){ const st=statusOf(id);
  if(ST_LOCK_ALL[st]) return false;
  if(role==="revisor") return !ST_LOCK_REV[st] || !!REVUNLOCK[id];
  return !ST_LOCK_RESP[st]; }
/* Comentar: solo el revisor, y nunca sobre un requerimiento completado. */
function canComment(id){ return role==="revisor" && !ST_LOCK_ALL[statusOf(id)]; }
function canEditReq(d){ if(!d) return false; if(!canEditStatus(d.id)) return false;
  if(role==="revisor") return true;
  if(role==="gerente") return respOf(d)===AUTH.name;
  return false; }
function canEditNow(){ return role==="revisor"||role==="gerente"; }
/* Para bloques narrativos y estructurados que no tienen responsable asignado */
function canEditAns(id){ return canEditNow()&&canEditStatus(id); }
/* Explica en una línea por qué está bloqueado (vacío si no lo está) */
function lockNote(d){ if(!d) return ""; const st=statusOf(d.id);
  if(st==="rev"||st==="comp") return "Completado. Todo está bloqueado (incluidos los comentarios) hasta que el revisor presione «Editar».";
  if(st==="sent"&&role!=="revisor") return "Enviado a revisión. Quedará bloqueado hasta que el revisor apruebe o solicite ajustes.";
  if(st==="fix"&&role==="revisor"&&!REVUNLOCK[d.id]) return "Solicitaste ajustes. La edición queda en manos del responsable; usa «Editar» si necesitas modificar el contenido tú mismo.";
  if(role==="gerente"&&respOf(d)!==AUTH.name) return "Solo el área responsable puede editar.";
  return ""; }
function lockNoteHtml(d){ const n=lockNote(d); return n?`<div class="row-actions"><span class="saved-note">${esc(n)}</span></div>`:""; }
/* El revisor reabre un requerimiento aprobado: vuelve a Borrador y queda editable */
function reabreReq(id){ const d=BYID[id]; if(role!=="revisor") return;
  clearRevUnlock(id);
  ANS[id]=Object.assign({text:""},ANS[id],{status:"draft",updated:nowStr()}); save(LS.answers,ANS); sbUpsertAnswer(id);
  COM[id]=COM[id]||[]; COM[id].push({author:"Revisor",ts:nowStr(),text:"↺ Reabierto para edición",kind:""}); save(LS.comments,COM); sbInsertComment(id,COM[id][COM[id].length-1]);
  if(typeof logActivity==="function"&&d)logActivity("save",d);
  renderSide(); renderCurrentKeepOpen(); }
/* Permiso a partir de un id de campo o de tabla: busca su requerimiento y aplica canEditReq.
   Si el campo no pertenece a ningún requerimiento (ej. bloque NIIF), cae en canEditNow. */
function canEditFieldId(id){ const rq=(typeof reqOfField==="function")?reqOfField(id):null; const d=rq?BYID[rq]:null; return d?canEditReq(d):canEditNow(); }
function canEditTableId(id){ const rq=(typeof reqOfTable==="function")?reqOfTable(id):null;
  /* Tabla compartida: la puede escribir cualquiera del grupo. */
  const g=rq?grupoDe(rq):null;
  if(g) return g.some(function(r){ const o=BYID[r]; return !!o&&canEditReq(o); });
  const d=rq?BYID[rq]:null; return d?canEditReq(d):canEditNow(); }

function countableReq(d){ return !(d.intro||isInstr(d)||isCtxOnly(d)||isHidden(d)); }
function reqLabel(d){

     al que acompañan: no se inventan códigos que la norma no tiene. */
  if(d&&d.lbl) return d.lbl;
  const base=d.sub||d.sec||""; const itm=(d.item&&d.item!==base)?String(d.item):"";
  const raw=(!itm?base:(itm.indexOf(base)===0?itm:base+" "+itm));
  return (typeof sec9Renum==="function")?sec9Renum(d,raw):raw; }

/* ===================================================================
   Recordatorios ya enviados
   -------------------------------------------------------------------
   La lista de recordatorios se arma sola con quien tiene pendientes, así
   que enviar el correo no la vaciaba: la persona seguía teniendo
   pendientes y el mismo aviso volvía a aparecer.
   Ahora, al enviar, la persona sale de la lista y pasa a un resumen de
   «ya recordados». Vuelve a aparecer sola cuando cambia lo que tiene
   pendiente —se le asignó algo nuevo o completó parte de lo suyo—,
   que es cuando hay algo distinto que decirle.
   =================================================================== */
function remSig(name){ return pendingForName(name).map(function(d){ return d.id; }).sort().join("|"); }
function remGet(name){ return (NOTIF.reminded&&NOTIF.reminded[name])||null; }
function remDue(name){ const r=remGet(name); if(!r) return true; return r.sig!==remSig(name); }
function remMark(name){ NOTIF.reminded=NOTIF.reminded||{};
  NOTIF.reminded[name]={ts:nowStr(),sig:remSig(name)}; saveNotif(); }
function remClear(name){ if(NOTIF.reminded) delete NOTIF.reminded[name]; saveNotif(); renderAll(); }
/* El servidor ya guarda cada envío en notification_queue: al entrar se lee de
   ahí para que las marcas no dependan del navegador que se esté usando. */
async function loadRemindersFromSB(){
  if(!SB || role!=="revisor") return;
  try{
    const q=await SB.from("notification_queue")
      .select("person_name,sent_at").eq("type","reminder").eq("status","sent")
      .order("sent_at",{ascending:true});
    if(q.error||!q.data) return;
    NOTIF.reminded=NOTIF.reminded||{};
    q.data.forEach(function(x){ const nm=x.person_name; if(!nm) return;
      const prev=NOTIF.reminded[nm];
      /* si acá no había marca, se asume que lo enviado cubre lo que hay hoy */
      if(!prev) NOTIF.reminded[nm]={ts:(x.sent_at||"").slice(0,16).replace("T"," "),sig:remSig(nm)}; });
    saveNotif();
  }catch(e){ console.warn("[notif] no se pudo leer el historial de recordatorios:",e); }
}

/* ===================================================================
   Fecha límite del informe
   -------------------------------------------------------------------
   Por defecto es la última semana de marzo, que es lo que exige la CMF.
   El revisor puede fijar otra fecha desde Configuración; se guarda como
   campo global en el servidor, así que la ve todo el equipo y solo el
   revisor la puede cambiar (lo impone la base de datos, no la pantalla).
   Todo lo que habla del plazo —el banner, el contador, el texto de los
   correos y el pie de Notificaciones— sale de esta única función.
   =================================================================== */
const CFG_PLAZO="cfg_plazo";                       /* campo global: fecha ISO */
const MESES_ES=["enero","febrero","marzo","abril","mayo","junio","julio",
                "agosto","septiembre","octubre","noviembre","diciembre"];
function fechaLarga(d){ return d.getDate()+" de "+MESES_ES[d.getMonth()]+" de "+d.getFullYear(); }
function plazoCustom(){
  const v=String(fv(CFG_PLAZO)||"").trim();
  const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return isNaN(d.getTime())?null:d;
}
function deadlineInfo(){
  const now=new Date();
  const cust=plazoCustom();
  if(cust){
    const days=Math.ceil((new Date(cust.getFullYear(),cust.getMonth(),cust.getDate(),23,59,59)-now)/86400000);
    const txt=fechaLarga(cust);
    return {year:cust.getFullYear(), dateStr:txt, weekStr:txt, daysLeft:days, custom:true, iso:fv(CFG_PLAZO)};
  }
  let y=now.getFullYear(); const endMar=new Date(y,2,31,23,59,59); if(now>endMar) y+=1;
  const target=new Date(y,2,31,23,59,59); const days=Math.ceil((target-now)/86400000);
  return {year:y, dateStr:"31 de marzo de "+y, weekStr:"última semana de marzo de "+y,
          daysLeft:days, custom:false, iso:y+"-03-31"}; }
/* Solo el revisor; el servidor lo vuelve a comprobar al guardar. */
function setPlazo(v){ if(role!=="revisor") return; setF(CFG_PLAZO,String(v||"").trim()); renderAll(); }
function resetPlazo(){ if(role!=="revisor") return;
  vntConfirm("Se vuelve a la fecha por defecto: la última semana de marzo, que es lo que exige la CMF.",
    "Sí, volver al plazo normal","Cancelar",function(){ setF(CFG_PLAZO,""); renderAll(); }); }
function deadlineBanner(){ const di=deadlineInfo(); const late=di.daysLeft<0; const soon=di.daysLeft>=0&&di.daysLeft<=30;
  const col=late?"#b03440":(soon?"#d4a017":"#2e7d5b"); const txt=late?("Plazo vencido ("+di.dateStr+")"):("Faltan "+di.daysLeft+" días · meta: "+di.weekStr);
  return `<div class="dl-banner" style="border-left-color:${col}"><b>Plazo del informe:</b> El Estado del Informe debe estar al 100% la <b>${di.weekStr}</b>. <span style="color:${col};font-weight:600">${txt}</span></div>`; }

/* ----- plantillas ----- */
/* Sustituye {campos} en las plantillas de correo.
   El artículo de {fecha_limite} se ajusta al valor: «la última semana de
   marzo» pero «el 15 de mayo de 2027». Así el revisor puede cambiar la
   fecha sin tener que reescribir la plantilla. */
function tplSubstitute(tpl,ctx){
  let s=String(tpl);
  if(ctx&&ctx.fecha_limite!=null){
    const art=/^(última|ultima|primera|segunda|tercera|cuarta|semana)/i.test(String(ctx.fecha_limite))?"la":"el";
    s=s.replace(/\b(el|la)(\s+)\{fecha_limite\}/gi,art+"$2{fecha_limite}");
  }
  return s.replace(/\{(\w+)\}/g,function(m,k){ return (ctx[k]!=null?ctx[k]:m); });
}

function respRequestCode(email){
  const box=document.getElementById("lg-code-box");
  email=(email||"").trim();
  if(!email){ if(box)box.innerHTML='<div class="login-err">Escribe tu correo primero.</div>'; return; }
  if(!SB){ if(box)box.innerHTML='<div class="login-err">Sin conexión con el servidor. Recarga la página.</div>'; return; }
  // Pide el código al backend (request-code lo envía por correo). Respuesta siempre genérica.
  fetch(SB_URL+"/functions/v1/request-code",{method:"POST",headers:{"apikey":SB_PUBLISHABLE_KEY,"Authorization":"Bearer "+SB_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email})}).catch(function(e){});
  if(box) box.innerHTML=`<div class="code-step"><div class="login-hint">Código enviado a <b>${esc(email)}</b>. Revisa tu bandeja y la carpeta de spam.</div><label class="glbl">Código recibido</label><input type="text" id="lg-code" maxlength="6" placeholder="Ej. 4KD9PX" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')respVerify('${esc(email)}')"/><div id="lg-code-err" class="login-err"></div><button class="btn primary lg-btn" onclick="respVerify('${esc(email)}')">Ingresar</button></div>`;
}
async function respVerify(email){
  const errEl=document.getElementById("lg-code-err"); if(errEl)errEl.textContent="";
  const inp=document.getElementById("lg-code"); const code=(inp?inp.value:"").trim().toUpperCase();
  email=(email||"").trim();
  if(!code){ if(errEl)errEl.textContent="Escribe el código que te llegó."; return; }
  if(!SB){ if(errEl)errEl.textContent="Sin conexión con el servidor. Recarga la página."; return; }
  // 1) Verificar el código con el backend → devuelve un token de magic link
  let vr;
  try{
    const r=await fetch(SB_URL+"/functions/v1/verify-code",{method:"POST",headers:{"apikey":SB_PUBLISHABLE_KEY,"Authorization":"Bearer "+SB_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,code:code})});
    vr=await r.json();
  }catch(e){ if(errEl)errEl.textContent="No se pudo conectar. Intenta de nuevo."; return; }
  if(!vr||!vr.ok||!vr.hashed_token){ if(errEl)errEl.textContent="Código incorrecto o vencido. Pide uno nuevo."; return; }
  // 2) Canjear el token por una sesión real de Supabase
  let sess;
  try{ sess=await SB.auth.verifyOtp({token_hash:vr.hashed_token,type:"magiclink"}); }
  catch(e){ if(errEl)errEl.textContent="No se pudo iniciar la sesión. Intenta de nuevo."; return; }
  if(sess&&sess.error){ if(errEl)errEl.textContent="No se pudo iniciar la sesión. Intenta de nuevo."; return; }
  AUTH={role:"gerente",name:vr.person_name||"Responsable"}; saveAuth(); role="gerente"; if(typeof actLogin==="function")actLogin(); view={type:"estado"}; hideLogin();
  await conEspera("Cargando la información del informe…",loadFromSupabase); renderTopbar(); renderAll();
}
async function loginRevisor(email,pw){
  const e=document.getElementById("lg-err"); if(e)e.textContent="";
  email=(email||"").trim();
  if(!SB){ if(e)e.textContent="Sin conexión con el servidor. Recarga la página e intenta de nuevo."; return; }
  if(!email||!pw){ if(e)e.textContent="Ingresa tu correo y tu contraseña."; return; }
  let resp; try{ resp=await SB.auth.signInWithPassword({email:email,password:pw}); }
  catch(ex){ if(e)e.textContent="No se pudo conectar. Revisa tu conexión e intenta de nuevo."; return; }
  if(resp&&resp.error){ if(e)e.textContent="Correo o contraseña incorrectos."; return; }
  AUTH={role:"revisor",name:"Revisor"}; saveAuth(); role="revisor"; if(typeof actLogin==="function")actLogin(); view={type:"estado"}; hideLogin();
  await conEspera("Cargando la información del informe…",loadFromSupabase); renderTopbar(); renderAll();
}

/* ===== Etapa 3.2 — guardar en Supabase (upsert por registro; la escritura la controla RLS) ===== */
const FIELD2REQ={}, TABLE2REQ={};
(function buildFieldReqMaps(){
  try{
    DATA.forEach(d=>{ const s=SCHEMA[sk(d)]; if(s&&Array.isArray(s.fields)) s.fields.forEach(fld=>{
      if(!fld||fld.id==null) return;
      if(fld.t==="yesno") { if(_YESNO===null)_YESNO={}; _YESNO[fld.id]=true; }
      if(fld.t==="dirtab"||fld.t==="dirbrecha") return;
      if(fld.t==="table"||fld.t==="comites"||fld.t==="comites_int"||fld.t==="indice") TABLE2REQ[fld.id]=d.id;
      else if(fld.t==="emissions"||fld.t==="aumcov"){ dynFieldIds(fld).forEach(function(i){ FIELD2REQ[i]=d.id; }); }
      else FIELD2REQ[fld.id]=d.id;
    }); });
    const head=code=>{ const d=DATA.find(x=>x.sub===code&&x.item===code); return d?d.id:null; };
    const r32=head("3.2"),r33=head("3.3"),r51=head("5.1"),r54=head("5.4");
    if(r32)["dir-total","dir-indep","dir-mujeres","dir-tit-h","dir-tit-m","dir-sup-h","dir-sup-m"].forEach(k=>FIELD2REQ[k]=r32);
    if(r33)["com-n","com-nombres","com-marco"].forEach(k=>FIELD2REQ[k]=r33);
    if(r51)CATS.forEach((_,i)=>["dot-"+i+"-h","dot-"+i+"-m","dot-"+i+"-na"].forEach(k=>FIELD2REQ[k]=r51));
    if(r54)CATS.forEach((_,i)=>["brecha-"+i+"-media","brecha-"+i+"-mediana","brecha-"+i+"-na"].forEach(k=>FIELD2REQ[k]=r54));
  }catch(e){ console.warn("[Supabase] buildFieldReqMaps:",e); }
})();
function reqOfField(id){ return (id in FIELD2REQ)?FIELD2REQ[id]:null; }
/* ===================================================================
   Tablas que comparten dos requerimientos
   -------------------------------------------------------------------
   Los integrantes de los comités (t_comint_0, t_comint_1, …) son UNA sola
   lista de filas: en 3.3.ii se registra quién es cada uno y en 3.3.iii
   cuánto recibió. Por eso la tabla es la misma.
   Antes estaba archivada bajo 3.3.i —que es la lista de comités, otra cosa—
   y eso traía tres problemas: limpiar 3.3.i borraba de paso los integrantes,
   el bloqueo de 3.3.ii seguía al estado de 3.3.i en vez de al suyo, y si
   3.3.ii se asignaba a otra persona esa persona no podía guardar.
   Ahora la tabla es de 3.3.ii (ahí se crean las filas) y 3.3.iii entra como
   invitado: puede escribir, pero al limpiar solo vacía SUS columnas.
   =================================================================== */
const TBL_COMINT=/^t_comint_\d+$/;
const TBL_DUENO="3_3_ii";                                   /* dueño de la tabla */
const TBL_INVITADO={"3_3_iii":{test:TBL_COMINT,cols:["ej1","ej2"]}};
function grupoDe(reqId){ return (reqId==="3_3_ii"||reqId==="3_3_iii")?["3_3_ii","3_3_iii"]:null; }
/* ===================================================================
   Requerimientos que dependen de otro
   -------------------------------------------------------------------
   3.3.ii y 3.3.iii solo tienen sentido si existe al menos un comité en
   3.3.i: sin comités la pantalla dice «Primero registra los comités» y no
   hay nada que responder. Por eso, cuando 3.3.i se queda sin comités
   —porque se limpió o porque se quitó el último— sus dependientes se
   vacían y vuelven a «Pendiente».
   No es deducir el estado del contenido: es propagar el borrado.
   =================================================================== */
const HIJOS_DE={"3_3_i":["3_3_ii","3_3_iii"]};
const TABLA_PADRE={"t_com":"3_3_i"};                 /* tabla que sostiene a los hijos */
function hijosDe(reqId){ return (HIJOS_DE[reqId]||[]).filter(function(r){ return !!BYID[r]; }); }
function hijosConDatos(reqId){
  return hijosDe(reqId).filter(function(r){ const o=BYID[r]; return o&&!reqVacio(o); }); }
function reqOfTable(id){ if(id in TABLE2REQ)return TABLE2REQ[id];
  if(TBL_COMINT.test(String(id))) return (BYID[TBL_DUENO]?TBL_DUENO:(("t_com" in TABLE2REQ)?TABLE2REQ["t_com"]:null));
  const b=String(id).replace(/__(g|sd)$/,""); return (b in TABLE2REQ)?TABLE2REQ[b]:null; }
/* Tablas compartidas donde este requerimiento solo pone algunas columnas. */
function tblColsOf(d){ const inv=TBL_INVITADO[d&&d.id]; if(!inv) return [];
  return Object.keys(typeof TBL!=="undefined"?TBL:{}).filter(function(i){
    return inv.test.test(i) && (TBL[i]||[]).some(function(r){
      return r&&inv.cols.some(function(c){ return r[c]!==""&&r[c]!=null; }); }); }); }
function limpiarCols(d){ const inv=TBL_INVITADO[d&&d.id]; if(!inv) return [];
  const tocadas=tblColsOf(d);
  tocadas.forEach(function(i){ (TBL[i]||[]).forEach(function(r){ if(r) inv.cols.forEach(function(c){ delete r[c]; }); }); });
  return tocadas; }
/* ¿Este requerimiento quedó sin nada adentro? */
function reqVacio(d){ if(!d) return true;
  if(ansText(d.id).trim()!=="") return false;
  if(fieldIdsOf(d).some(function(i){ return FIELDS[i]!==undefined; })) return false;
  if(tableIdsOf(d).some(function(i){ return TBL[i]!==undefined; })) return false;
  if(tblColsOf(d).length) return false;
  if((COM[d.id]||[]).length) return false;
  return true; }
const _sbTimers={};
/* ---- Registro de escrituras fallidas -------------------------------------
   Antes un rechazo de RLS solo iba a console.warn: la pantalla parecía haber
   guardado y el dato nunca llegaba al servidor. Ahora se anota, se muestra en
   la barra superior y el botón «Guardar» lo reintenta.                       */
const SBERR={};
function sbNote(kind,id,err){
  const k=kind+":"+id;
  if(err){ SBERR[k]={kind:kind,id:id,msg:(err.message||String(err)),ts:nowStr()}; console.warn("[SB] "+k+":",err.message||err); }
  else { delete SBERR[k]; }
  renderSaveChip();
}
function sbErrCount(){ return Object.keys(SBERR).length; }
function sbRetryAll(){
  const keys=Object.keys(SBERR); if(!keys.length) return 0;
  keys.forEach(function(k){ const e=SBERR[k];
    if(e.kind==="answers") sbUpsertAnswer(e.id);
    else if(e.kind==="fields") sbUpsertField(e.id);
    else if(e.kind==="table_data") sbUpsertTable(e.id);
    else if(e.kind==="assignments") sbUpsertAssign(e.id);
    else if(e.kind==="section_status") sbUpsertSection(e.id);
    else if(e.kind==="refs") sbSyncRefs(e.id);
  });
  return keys.length;
}
/* Las escrituras se agrupan medio segundo para no golpear el servidor a cada
   tecla. Eso dejaba un hueco: si alguien escribía y cerraba al instante, lo
   último no alcanzaba a salir. Ahora quedan registradas como pendientes, y el
   botón «Guardar» y el aviso de salida las fuerzan. */
const _sbPend={};
function sbDebounce(key,fn,ms){ clearTimeout(_sbTimers[key]); _sbPend[key]=fn;
  _sbTimers[key]=setTimeout(function(){ delete _sbPend[key]; fn(); },ms||600); }
function sbPendCount(){ return Object.keys(_sbPend).length; }
function sbFlushPending(){ const keys=Object.keys(_sbPend);
  keys.forEach(function(k){ const fn=_sbPend[k]; clearTimeout(_sbTimers[k]); delete _sbPend[k]; delete _sbTimers[k]; try{ fn(); }catch(e){} });
  return keys.length; }
function sbWho(){ return (AUTH&&AUTH.name)||null; }
function sbUpsertField(id){ if(!SB)return; sbDebounce("f:"+id,function(){ const fl=FIELDS[id]||{}; SB.from("fields").upsert({field_id:id,requirement_id:reqOfField(id),value:(fl.v==null?null:String(fl.v)),na:!!fl.na,updated_by:sbWho(),updated_at:new Date().toISOString()},{onConflict:"field_id"}).then(r=>{ sbNote("fields",id,r.error); }); }); }
function sbUpsertAnswer(id){ if(!SB)return; const a=ANS[id]||{}; SB.from("answers").upsert({requirement_id:id,text:(a.text==null?null:a.text),status:a.status||"pend",updated_by:sbWho(),updated_at:new Date().toISOString()},{onConflict:"requirement_id"}).then(r=>{ sbNote("answers",id,r.error); }); }
function sbUpsertTable(tid){ if(!SB)return; sbDebounce("t:"+tid,function(){ SB.from("table_data").upsert({table_id:tid,requirement_id:reqOfTable(tid),rows:(TBL[tid]!==undefined?TBL[tid]:[]),updated_by:sbWho(),updated_at:new Date().toISOString()},{onConflict:"table_id"}).then(r=>{ sbNote("table_data",tid,r.error); }); }); }
/* ----- Etapa 3.3: asignaciones, estado de secciones, comentarios y referencias ----- */
function sbUpsertAssign(reqId){ if(!SB)return; const a=ASSIGN[reqId]||{}; SB.from("assignments").upsert({requirement_id:reqId,responsable:(a.responsable||null),area:(a.area||null),updated_at:new Date().toISOString()},{onConflict:"requirement_id"}).then(r=>{ sbNote("assignments",reqId,r.error); }); }
function sbUpsertSection(code){ if(!SB)return; SB.from("section_status").upsert({seccion:code,status:SEC[code],updated_at:new Date().toISOString()},{onConflict:"seccion"}).then(r=>{ sbNote("section_status",code,r.error); }); }
function sbInsertComment(reqId,c){ if(!SB||!c)return; SB.from("comments").insert({requirement_id:reqId,author:(c.author||null),text:(c.text||null),kind:(c.kind||null)}).then(r=>{ sbNote("comments",reqId,r.error); }); }
function sbSyncRefs(reqId){ if(!SB)return; SB.from("refs").delete().eq("requirement_id",reqId).then(function(){ const arr=REF[reqId]||[]; if(arr.length){ SB.from("refs").insert(arr.map(function(r){return {requirement_id:reqId,label:(r.label||null),url:(r.url||"#")};})).then(function(rr){ sbNote("refs",reqId,rr.error); }); } }); }

async function boot(){ try{var _bl=document.getElementById("brandLogo"); if(_bl)_bl.src=LOGO_VT;}catch(e){}
  if(AUTH&&AUTH.role){   // revisor o responsable: ambos usan sesión real de Supabase
    let sess=null;

    AUTH={}; saveAuth(); role="gerente"; showLogin(); return;   // sesión real caída → pedir login otra vez
  }

}

  /* Almacenamiento: total real usado por los documentos de respaldo. */
  { const g=docsGlobal();

/* ---- Puente con el backend de correo ----
   Llama a la Edge Function send-now con el token de sesión del revisor. Esa función
   valida el rol contra app_users, manda el correo por Gmail y lo registra en
   notification_queue. Acá nunca viaja ningún secreto: solo la sesión del usuario.
   Devuelve {ok:true} o {ok:false,error:"texto en castellano"}. */
const SB_ERR_MSG={falta_sesion:"tu sesión se cerró; vuelve a entrar",
  sesion_invalida:"tu sesión venció; vuelve a entrar",
  solo_el_revisor_puede_enviar:"solo el revisor puede enviar correos",
  correo_invalido:"el correo de esa persona no es válido",
  faltan_asunto_o_cuerpo:"el correo quedó sin asunto o sin texto",
  no_se_pudo_enviar_el_correo:"Gmail rechazó el envío; revisa los registros de la función",
  server_error:"error en el servidor"};
async function sbEnqueueMail(mail){
  if(!SB) return {ok:false,error:"sin conexión con el servidor"};
  let tok=null;
  try{ const s=await SB.auth.getSession(); tok=s&&s.data&&s.data.session&&s.data.session.access_token; }catch(e){}
  if(!tok) return {ok:false,error:"tu sesión se cerró; vuelve a entrar"};
  try{
    const r=await fetch(SB_URL+"/functions/v1/send-now",{method:"POST",
      headers:{"apikey":SB_PUBLISHABLE_KEY,"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify({to:mail.to,subject:mail.subject,body:mail.body,
        type:(mail.kind==="reminder"?"reminder":"assign"),person_name:mail.name||null})});
    const j=await r.json().catch(function(){ return null; });
    if(j&&j.ok===true) return {ok:true};
    const code=(j&&j.error)||("HTTP "+r.status);
    return {ok:false,error:(SB_ERR_MSG[code]||code)};
  }catch(e){ return {ok:false,error:"no se pudo conectar con el servidor"}; }
}
/* Envía el aviso de asignación acumulado de una persona.
   Solo marca como enviado si el backend confirma; si falla, el aviso queda en la cola. */
async function sendAssignMail(name){
  if(role!=="revisor") return;
  const e=NOTIF.queue.filter(function(x){ return x.type==="assign"&&x.name===name&&!x.sent; })[0];
  if(!e) return;
  const email=emailOf(name);
  if(!email){ vntAlert("«"+name+"» no tiene correo registrado. Agrégalo en Configuración."); return; }
  const di=deadlineInfo();
  const reqs=(e.reqs||[]).map(function(id){ return BYID[id]; }).filter(Boolean);
  const lista=reqs.map(function(d){ return "• "+reqLabel(d)+" — "+reqShort(d); }).join("\n");
  const ctx={nombre:name,area:areaForPerson(name),total:reqs.length,lista:lista,fecha_limite:di.weekStr};
  const subject="Memoria Anual Integrada AGF: requerimientos asignados";
  const body=tplSubstitute(NOTIF.config.tplAssign,ctx)+(lista?"\n\nRequerimientos asignados:\n"+lista:"");
  const res=await conEspera("Enviando el correo a "+name+"…",function(){ return sbEnqueueMail({to:email,name:name,subject:subject,body:body,kind:"assign",reqs:e.reqs||[]}); });
  if(!res.ok){ vntAlert("No se pudo enviar: "+(res.error||"error desconocido")+"\n\nEl aviso sigue en la cola."); return; }
  e.sent=true; e.sentAt=nowStr(); NOTIF.notified[name]=e.sentAt; saveNotif();
  vntAlert("Correo enviado a "+name+" ("+email+") con "+reqs.length+" requerimiento(s).");
  renderAll();
}
/* Punto 8 — Recordatorio de pendientes: mismo camino que el aviso de asignación

async function sendReminderMail(name){
  if(role!=="revisor") return;
  const email=emailOf(name);
  if(!email){ vntAlert("«"+name+"» no tiene correo registrado. Agrégalo en Configuración."); return; }
  const pend=pendingForName(name);

  const di=deadlineInfo();

  const subject="Memoria Anual Integrada AGF: requerimientos pendientes";
  const body=tplSubstitute(NOTIF.config.tplReminder,ctx);

async function sendAllReminders(){
  if(role!=="revisor") return;
  /* Solo a quien todavía no se le ha recordado lo que tiene hoy pendiente. */
  const names=peopleNames().filter(function(n){ return pendingForName(n).length && emailOf(n) && remDue(n); });
  const sinCorreo=peopleNames().filter(function(n){ return pendingForName(n).length && !emailOf(n) && remDue(n); });
  if(!names.length){ vntAlert("No hay a quién enviar: o nadie tiene pendientes, o ya se le recordó a todos, o no tienen correo registrado."); return; }
  vntConfirm("Se enviará un recordatorio a "+names.length+" responsable(s):\n\n"+names.join("\n")
    +(sinCorreo.length?"\n\nSin correo registrado (no se les enviará): "+sinCorreo.join(", "):""),
    "Enviar "+names.length+" correo(s)","Cancelar", async function(){
      const di=deadlineInfo(); let ok=0; const errores=[];
      vntBusy("Enviando 1 de "+names.length+"…");
      for(let i=0;i<names.length;i++){ const n=names[i];
        vntBusyMsg("Enviando "+(i+1)+" de "+names.length+" · "+n);
        const pend=pendingForName(n);
        const lista=pend.map(function(d){ return "• "+reqLabel(d)+" — "+reqShort(d); }).join("\n");
        const ctx={nombre:n,area:areaForPerson(n),pendientes:pend.length,lista:lista,fecha_limite:di.weekStr};
        const res=await sbEnqueueMail({to:emailOf(n),name:n,

        if(res.ok){ ok++; remMark(n); } else errores.push(n+": "+(res.error||"error")); }
      vntBusyOff();
      vntAlert("Recordatorios enviados: "+ok+" de "+names.length+(errores.length?"\n\nCon problemas:\n"+errores.join("\n"):""));
      renderAll();
    });
}
/* ===================================================================
   Descartar un aviso sin mandarlo
   -------------------------------------------------------------------
   A veces el revisor no quiere enviar un correo (ya avisó por otra vía,
   o la asignación fue un error) y el aviso queda estorbando en la lista.
   Descartarlo lo saca de la pantalla SIN enviar nada. Se avisa antes,
   porque la persona no se entera de nada.
   =================================================================== */
function descartarAviso(kind,name){
  if(role!=="revisor") return;
  const esAsign=(kind==="assign");
  const cuantos=esAsign
    ? (((NOTIF.queue.filter(function(x){ return x.type==="assign"&&x.name===name&&!x.sent; })[0])||{reqs:[]}).reqs||[]).length
    : pendingForName(name).length;
  const msg="Vas a descartar este aviso SIN enviarlo.\n\n"
    +"⚠️ "+name+" NO va a recibir ningún correo y no se va a enterar de "
    +(esAsign?("los "+cuantos+" requerimiento(s) que le asignaste."):("sus "+cuantos+" requerimiento(s) pendientes."))+"\n\n"
    +(esAsign
       ? "El aviso desaparece de la lista y no se vuelve a armar solo para esta persona, aunque le asignes más requerimientos. Si después quieres avisarle, tendrás que hacerlo por fuera del sitio."
       : "Pasa a «Ya recordados» con la marca de descartado. Si cambias de opinión, ahí mismo puedes insistir o devolverlo a la lista.");
  vntConfirm(msg,"Sí, descartar sin enviar","Cancelar",function(){
    if(esAsign){
      NOTIF.queue=NOTIF.queue.filter(function(x){ return !(x.type==="assign"&&x.name===name&&!x.sent); });
      NOTIF.notified[name]=nowStr()+" (descartado sin enviar)";
      saveNotif();
    } else {
      NOTIF.reminded=NOTIF.reminded||{};
      NOTIF.reminded[name]={ts:nowStr()+" (descartado sin enviar)",sig:remSig(name)};
      saveNotif();
    }
    renderAll();
  });
}
function notifCard(name,email,subject,body,badge,send){
  const acc=accId("notif-"+name+"-"+subject);
  const open=!!ACC[acc];
  let acts="";
  if(send&&(send.kind==="assign"||send.kind==="reminder")){
    const fn = send.kind==="assign" ? "sendAssignMail" : "sendReminderMail";
    const nm=esc(name).replace(/'/g,"\\'");
    const descartar=`<button class="btn ghost" onclick="descartarAviso('${send.kind}','${nm}')" title="Sacarlo de la lista sin mandar el correo">🗑 Descartar sin enviar</button>`;
    acts=email
      ? `<div class="row-actions"><button class="btn primary" onclick="${fn}('${nm}')">✉ Enviar ahora</button>${descartar}<span class="saved-note" id="sm-${accId('sm-'+name)}"></span></div>`
      : `<div class="row-actions"><span class="saved-note">Sin correo registrado: agrégalo en Configuración para poder enviar.</span>${descartar}</div>`;
  }
  return `<div class="acc ${open?'open':''}" data-acc="${acc}"><div class="acc-h" onclick="toggleAcc('${acc}')"><span>✉ ${esc(name)} &lt;${esc(email||'sin correo')}&gt; · <span class="saved-note">${esc(badge)}</span></span><span class="acc-c">▾</span></div><div class="acc-b"><div class="notif-mail"><div><b>Para:</b> ${esc(email||'(sin correo registrado)')}</div><div><b>Asunto:</b> ${esc(subject)}</div><div class="notif-body">${esc(body)}</div></div>${acts}</div></div>`;
}

/* ---- Métricas compartidas -------------------------------------------------
   Antes cada evento se guardaba solo en el navegador de quien lo generaba, así
   que el revisor jamás veía lo que hacían los demás: las métricas medían su

let ACTQ=[]; let ACT_TIMER=null;
const ACT_ROL={revisor:"revisor",gerente:"responsable"};
function actRow(e){
  const rid=(e.requirement_id&&typeof BYID!=="undefined"&&BYID[e.requirement_id])?e.requirement_id:null;
  return { user_id:(typeof AUTH!=="undefined"&&AUTH.uid)||null,
           user_name:e.user_name||null,
           role:ACT_ROL[e.role]||null,
           section_id:e.section_id||null,
           requirement_id:rid,
           event_type:e.event_type,
           timestamp_start:e.ts||new Date().toISOString(),
           timestamp_end:e.ts_end||null,
           session_id:e.session_id||null };
}
function actQueue(e){ ACTQ.push(e);
  if(ACTQ.length>=25){ actFlush(); return; }
  if(!ACT_TIMER) ACT_TIMER=setTimeout(function(){ ACT_TIMER=null; actFlush(); },15000); }
function actFlush(){
  if(ACT_TIMER){ clearTimeout(ACT_TIMER); ACT_TIMER=null; }
  if(!SB||!ACTQ.length) return Promise.resolve();
  const lote=ACTQ.slice(); ACTQ=[];
  return SB.from("activity_log").insert(lote.map(actRow)).then(function(r){
    if(r&&r.error) console.warn("[SB] activity_log:",r.error.message);
  }).catch(function(){});
}
/* El revisor lee la actividad de todo el equipo desde el servidor. */
async function loadActivityFromSB(){
  if(!SB||role!=="revisor") return false;
  await actFlush();
  const r=await SB.from("activity_log")
    .select("user_name,role,section_id,requirement_id,event_type,timestamp_start,timestamp_end,session_id")
    .order("timestamp_start",{ascending:true}).limit(20000);
  if(r.error){ console.warn("[SB] activity_log lectura:",r.error.message); return false; }
  ACTIVITY=(r.data||[]).map(function(x,i){
    const t0=x.timestamp_start?Date.parse(x.timestamp_start):null;
    const t1=x.timestamp_end?Date.parse(x.timestamp_end):null;
    return { id:"sb"+i, user_id:x.user_name, user_name:x.user_name,
             role:(x.role==="responsable"?"gerente":x.role),
             section_id:x.section_id||"", requirement_id:x.requirement_id||null,
             event_type:x.event_type, ts:x.timestamp_start, ts_end:x.timestamp_end,
             duration_ms:(t0&&t1)?(t1-t0):undefined, session_id:x.session_id };
  });
  return true;
}
let ACT_SESSION=null;
function actNewSession(){ ACT_SESSION="s"+Date.now()+"_"+Math.floor(Math.random()*1e4); }
function actUser(){ return (typeof AUTH!=="undefined"&&AUTH.name)?AUTH.name:""; }
function nowISO(){ return new Date().toISOString(); }
function logActivity(type,d){
  if(typeof AUTH==="undefined"||!AUTH.role) return;
  if(!ACT_SESSION) actNewSession();
  const ev={ id:"e"+Date.now()+"_"+ACTIVITY.length, user_id:actUser(), user_name:actUser(), role:AUTH.role,
    section_id: d?(d.sec||""):((typeof view!=="undefined"&&view.code)?String(view.code).split(".")[0]:""),
    requirement_id: d?d.id:null, event_type:type, ts:nowISO(), session_id:ACT_SESSION };
  ACTIVITY.push(ev); actSave(); actQueue(ev);
}
/* view_section con entrada/salida para medir tiempo */
let _actVisit=null;
function actVisit(code){ if(typeof AUTH==="undefined"||!AUTH.role) return; if(_actVisit&&_actVisit.code===code) return; actVisitClose();
  if(!ACT_SESSION)actNewSession(); _actVisit={code:code,start:Date.now(),sec:String(code).split(".")[0]}; }
function actVisitClose(){ if(_actVisit){ const ev={ id:"v"+_actVisit.start, user_id:actUser(), user_name:actUser(), role:(typeof AUTH!=="undefined"&&AUTH.role)||"",
    section_id:_actVisit.sec, requirement_id:null, event_type:"view_section", ts:new Date(_actVisit.start).toISOString(), ts_end:nowISO(), duration_ms:Date.now()-_actVisit.start, session_id:ACT_SESSION };
    ACTIVITY.push(ev); actSave(); actQueue(ev); _actVisit=null; } }
let _actEditLast={};
function actEdit(d){ const key=(d&&d.id)||((typeof view!=="undefined"&&view.code)||"x"); const t=Date.now(); if(_actEditLast[key]&&t-_actEditLast[key]<4000)return; _actEditLast[key]=t; logActivity("edit_field",d); }
function actLogin(){ actNewSession(); logActivity("login"); }
function actLogout(){ actVisitClose(); logActivity("logout"); ACT_SESSION=null; }

/* ---------- helpers de cálculo ---------- */
function fmtDur(ms){ ms=ms||0; const m=Math.round(ms/60000); if(m<1)return "<1 min"; if(m<60)return m+" min"; const h=Math.floor(m/60); return h+" h "+(m%60)+" min"; }
function fmtTs(iso){ if(!iso)return "—"; const d=new Date(iso); return isNaN(+d)?"—":d.toLocaleDateString("es-CL")+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}); }
function actByUser(name){ return ACTIVITY.filter(e=>e.user_name===name); }
function actSessionsOf(name){ return [...new Set(actByUser(name).map(e=>e.session_id).filter(Boolean))]; }
function actViewMsUser(name){ return actByUser(name).filter(e=>e.event_type==="view_section").reduce((a,e)=>a+(e.duration_ms||0),0); }
function actViewMsSec(sec){ return ACTIVITY.filter(e=>e.event_type==="view_section"&&e.section_id===String(sec)).reduce((a,e)=>a+(e.duration_ms||0),0); }
function actEditsReq(id){ return ACTIVITY.filter(e=>e.requirement_id===id&&(e.event_type==="edit_field"||e.event_type==="save")); }
function actLastTsUser(name){ const a=actByUser(name).map(e=>e.ts).sort(); return a.length?a[a.length-1]:null; }

function repairedSetFor(name){ const set=new Set();
  assignedForName(name).forEach(d=>{ const revEdit=ACTIVITY.some(e=>e.requirement_id===d.id&&e.role==="revisor"&&(e.event_type==="edit_field"||e.event_type==="save"));
    const fix=(COM[d.id]||[]).some(c=>c.kind==="fix"); if(revEdit||fix)set.add(d.id); }); return set; }
function metBlock3(){
  let h=`<div class="block-h" style="margin-top:20px">Bloque 3 — Métricas de revisión</div><div style="overflow-x:auto"><table class="dt estado"><thead><tr><th style="text-align:left">Responsable</th><th>Req. asignados</th><th>Reparados por Revisor</th><th>% reparados</th><th>Pendientes de revisión</th></tr></thead><tbody>`;
  peopleNames().forEach(n=>{ const asg=assignedForName(n); const rep=repairedSetFor(n).size; const pct=asg.length?Math.round(rep/asg.length*100):0;
    const pendRev=asg.filter(d=>statusOf(d.id)==="sent").length;
    h+=`<tr><td style="text-align:left"><b>${esc(n)}</b></td><td>${asg.length}</td><td>${rep}</td><td>${pct}%</td><td>${pendRev}</td></tr>`; });

}
function estFinish(){ const ctk=DATA.filter(countableReq); const done=ctk.filter(d=>narrDone(d.id)).length; const total=ctk.length;
  const saves=ACTIVITY.filter(e=>e.event_type==="save"||e.event_type==="paste_previous").map(e=>+new Date(e.ts)).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
  if(done>=total) return {done,total,txt:"Informe completo 🎉"};
  if(saves.length<2||done===0) return {done,total,txt:"Datos insuficientes para estimar"};
  const days=Math.max(1,(saves[saves.length-1]-saves[0])/86400000); const rate=done/days; if(rate<=0)return {done,total,txt:"Datos insuficientes para estimar"};
  const need=(total-done)/rate; const dt=new Date(Date.now()+need*86400000);
  return {done,total,txt:dt.toLocaleDateString("es-CL")+" (estim.)"};
}
function metBlock4(){
  const gp=generalPct(); const ef=estFinish(); const wk=Date.now()-7*86400000;
  const idle=DATA.filter(countableReq).filter(d=>!narrDone(d.id)).filter(d=>!ACTIVITY.some(e=>e.requirement_id===d.id&&+new Date(e.ts)>=wk));
