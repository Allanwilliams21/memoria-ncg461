 "numlabel": "5.8 v"}, {"id": "5_9_5_9", "node": "5.9", "sec": "5", "sub": "5.9", "item": "5.9", "req": "Se deberá divulgar si cuenta con una política que establezca las directrices que se tendrán en consideración al momento de elegir las empresas subcontratistas cuyo personal desempeñará funciones en la entidad; cuáles son los estándares laborales que son exigidos a esas empresas; y los procedimientos que se hayan adoptado para verificar que dichas empresas cumplen permanentemente con esos estándares.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "-", "comentarios": "Al parecer la empresa no cuenta con politicas de subcontratación. Pero tampoco tiene empleados subcontratados. Debemos revisar los contratos de las personas de aseo. En caso de que haya gente subcontratada. Podemos declarar que existe personal bajo esas condiciones, pero que no se ha elaborado una política. NO ES OBLIGATORIO TENERLO", "obligatoriedad": "NA", "intro": false, "numlabel": "5.9 5.9"}, {"id": "6_1_6_1", "node": "6.1", "sec": "6", "sub": "6.1", "item": "6.1", "req": "Se deberá describir el o los sectores industriales o económicos en los cuales se desarrollan las actividades de la entidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 6.1"}, {"id": "6_1", "node": "6.1", "sec": "6", "sub": "6.1", "item": "", "req": "La descripción por cada sector industrial deberá considerar a lo menos la siguiente información:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": false, "numlabel": "6.1"}, {"id": "6_1_i", "node": "6.1", "sec": "6", "sub": "6.1", "item": "i", "req": "i. La naturaleza de los productos y/o servicios de la entidad que se comercializan en la industria.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Describir los servicios que presta la AGF.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 i"}, {"id": "6_1_ii", "node": "6.1", "sec": "6", "sub": "6.1", "item": "ii", "req": "ii. La competencia que enfrenta la entidad en el sector industrial.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Benchmarking de la competencia nacional con mayor detalle.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 ii"}, {"id": "6_1_iii", "node": "6.1", "sec": "6", "sub": "6.1", "item": "iii", "req": "iii. En caso que exista algún marco legal o normativo que regule o que afecte la industria en la cual participa, se deberá indicar cuáles son esas normas y cómo afectan sus actividades.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Debemos volver a mencionar el marco normativo con un poco mas de detalle y las principales leyes que nos afectan.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 iii"}, {"id": "6_1_iv", "node": "6.1", "sec": "6", "sub": "6.1", "item": "iv", "req": "iv. Las entidades reguladoras nacionales o extranjeras que cuenten con atribuciones fiscalizadoras sobre la entidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Deberiamos mencionar a la UAF tambien??", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 iv"}, {"id": "6_1_v", "node": "6.1", "sec": "6", "sub": "6.1", "item": "v", "req": "v. Los principales grupos de interés que se hubieren identificado y las razones por las que tales grupos tienen esa condición. Esto incluye lo que puede entenderse como grupos de interés internos, tales como los trabajadores y sindicatos, así como también grupos de interés externos, entre los cuales podrían encontrarse clientes, proveedores, autoridades, organizaciones no gubernamentales, comunidades y pueblos originarios, entre otros.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Los grupos de interes ya fueron identificados en capitulos posteriores y anteriores. La diferencia aquí es que, debemos destacar los que compete a la industria y explicar por qué son relevantes.\nPodrian ser muy similares a los ya indentificados como grupos de interes de la empresa misma.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 v"}, {"id": "6_1_vi", "node": "6.1", "sec": "6", "sub": "6.1", "item": "vi", "req": "vi. La afiliación a gremios, asociaciones u organizaciones por parte de la entidad.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "-", "comentarios": "Declaramos afiliacion a entidades, pero no hemos dicho si somos partes de gremios o no, relacionados con la industria.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.1 vi"}, {"id": "6_2_6_2", "node": "6.2", "sec": "6", "sub": "6.2", "item": "6.2", "req": "Se deberá describir los negocios realizados por la entidad, considerando tanto a sus subsidiarias como a sus asociadas relevantes. Dicha descripción deberá considerar los distintos segmentos de negocios de la entidad. En tal sentido, se deberá entender por segmento de negocios la definición establecida según las NIIF o IFRS.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Nombramos los negocios (Fondos) pero no describimos cada uno. Podemos reportar una descripción general para un grupo de fondos. Debemos ahondar en la definicion de la ley para reportar el SEGMENTO DE NEGOCIOS", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 6.2"}, {"id": "6_2_6_2_2", "node": "6.2", "sec": "6", "sub": "6.2", "item": "6.2", "req": "La descripción de las actividades y negocios deberá referirse, para cada segmento de negocio, según corresponda, a lo menos a lo siguiente:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "6.2 6.2"}, {"id": "6_2_i", "node": "6.2", "sec": "6", "sub": "6.2", "item": "i", "req": "i. Los principales bienes producidos y/o servicios prestados y los principales mercados en los cuales son comercializados dichos productos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Revisar como podemos especificar el mercado en el que los servicios que prestamos operan, de manera clara y concisa.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 i"}, {"id": "6_2_ii", "node": "6.2", "sec": "6", "sub": "6.2", "item": "ii", "req": "ii. Los canales de venta y métodos de distribución utilizados para la comercialización de los bienes y servicios.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Cómo llegan los clientes a nuestros servicios? Pagina web, boca a boca, otros?", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 ii"}, {"id": "6_2_iii", "node": "6.2", "sec": "6", "sub": "6.2", "item": "iii", "req": "iii. Al número de proveedores que representen en forma individual, al menos el 10% del total de compras efectuadas en el período por el suministro de bienes y servicios del segmento. En caso de que ningún proveedor alcance dicha concentración deberá señalarlo expresamente.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "35", "comentarios": "No está declarado en la seccion correspondiente. En caso de que alguna sociedad fuera del grupo nos preste servicios debemos declararlo aquí.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 iii"}, {"id": "6_2_iv", "node": "6.2", "sec": "6", "sub": "6.2", "item": "iv", "req": "iv. Al número de clientes que concentren en forma individual, a lo menos, un 10% del ingreso del segmento. En caso de que ningún cliente alcance dicha concentración deberá señalarlo expresamente.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Debemos reportar el numero de clientes que representan este total dentro de algun segmento/fondo. Sino, declarar en el caso contrario.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 iv"}, {"id": "6_2_v", "node": "6.2", "sec": "6", "sub": "6.2", "item": "v", "req": "v. Las principales marcas utilizadas en la comercialización de los bienes y servicios.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Aca se debe destacar que los productos de comercializan con marca propia", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 v"}, {"id": "6_2_vi", "node": "6.2", "sec": "6", "sub": "6.2", "item": "vi", "req": "vi. En caso que sea de importancia, las patentes de propiedad de la entidad, indicando en qué procesos productivos son utilizadas dichas patentes.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Aca se debe saber si hay patentes de propiedad", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 vi"}, {"id": "6_2_vii", "node": "6.2", "sec": "6", "sub": "6.2", "item": "vii", "req": "vii. Las principales licencias, franquicias, royalties y/o concesiones de propiedad de la entidad. En tal sentido, se deberá presentar un resumen de las principales características de dichos convenios, en cuanto a derechos, deberes y plazos de vigencia.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "saber si tenemos, sino, chao", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 vii"}, {"id": "6_2_viii", "node": "6.2", "sec": "6", "sub": "6.2", "item": "viii", "req": "viii. Otros factores del entorno externo que fueran relevantes para el desarrollo de los negocios de la entidad, incluyendo aspectos legales, comerciales, sociales, medioambientales y políticos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "35", "comentarios": "Podria parecer redundante, pero hay que reportarlo. \nPrincipalmente aclarar entorno politico, economico, social y legislativo, que pudieran afectarnos.", "obligatoriedad": "SI", "intro": false, "numlabel": "6.2 viii"}, {"id": "6_3_6_3", "node": "6.3", "sec": "6", "sub": "6.3", "item": "6.3", "req": "Se deberá describir aquellos grupos de interés que son relevantes para la entidad y las razones por las que tales grupos tienen esa condición. Además, si la entidad pertenece, está afiliada o participa en gremios, asociaciones u organizaciones.", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "35", "comentarios": "Falta aclarar las razones de haber elegido estos grupos de interes. Al ser un item especifico para esto, podemos dar mayor detalle de aquellos grupos de interés (Quienes son, especificamente).", "obligatoriedad": "SI", "intro": false, "numlabel": "6.3 6.3"}, {"id": "6_4_6_4", "node": "6.4", "sec": "6", "sub": "6.4", "item": "6.4", "req": "Se deberá entregar, de una manera clara y precisa, información relativa a las principales propiedades con las que cuenta la entidad para la realización de sus actividades. Al respecto, se entenderá por propiedades a las instalaciones utilizadas por ésta para la producción, distribución y/o comercialización de los bienes elaborados, como también aquéllas que son utilizadas para prestar los servicios ofrecidos por la entidad y, en general, cualquier propiedad utilizada por ésta para llevar a cabo el giro del negocio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "39", "comentarios": "-", "obligatoriedad": "SI", "intro": true, "numlabel": "6.4 6.4"}, {"id": "6_4_6_4_2", "node": "6.4", "sec": "6", "sub": "6.4", "item": "6.4", "req": "En razón de lo anteriormente expuesto, se deberá considerar la siguiente información:", "responsable": "", "area": "", "pagina": "-", "comentarios": "-", "obligatoriedad": "-", "intro": true, "numlabel": "6.4 6.4"}, {"id": "6_4_i", "node": "6.4", "sec": "6", "sub": "6.4", "item": "i", "req": "i. Se deberá informar las características más relevantes de las principales propiedades con las que cuenta la entidad para desarrollar el giro de negocio, precisando su ubicación. Se recomienda que la información sea proporcionada en forma segmentada, según áreas de negocios.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "39", "comentarios": "Nos falta área de negocio", "obligatoriedad": "SI", "intro": false, "numlabel": "6.4 i"}, {"id": "6_4_ii", "node": "6.4", "sec": "6", "sub": "6.4", "item": "ii", "req": "ii. Para el caso de empresas de extracción de recursos naturales, se deberán identificar las áreas de concesión y/o los terrenos que posee, señalando la superficie y ubicación de ellos, el volumen de los principales recursos con los que cuenta la entidad para futuros ejercicios, señalando el estado de dichos recursos para su explotación e identificando para este último caso, la fuente de ésta información. La misma información deberá remitirse respecto de aquellos terrenos, recursos y otros aún no explotados. En particular, las sociedades de exploración o explotación de recursos y reservas mineras deberán presentar información relativa a los resultados de sus actividades de exploración de yacimientos mineros, estimación de recursos, así como las reservas asociadas a la explotación minera, según corresponda, identificando a la persona competente en recursos y reservas mineras que haya suscrito o emitido el reporte técnico, conforme a lo indicado en el artículo 18 de la Ley N°20.235. Finalmente, en caso de empresas de extracción de recursos renovables, se deberán señalar las políticas seguidas para la renovación de los recursos.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.4 ii"}, {"id": "6_4_iii", "node": "6.4", "sec": "6", "sub": "6.4", "item": "iii", "req": "iii. Para todos los casos anteriores, se deberá identificar si la entidad es propietaria de dichas instalaciones o si estas son utilizadas mediante algún otro tipo de contrato, como leasing financiero u operativo.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "39", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "6.4 iii"}, {"id": "6_5_1_6_5_1", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "6.5.1", "req": "Respecto de las subsidiarias y asociadas (directas e indirectas), de conformidad con la definición de las NIIF o IFRS deberá presentarse un detalle que contenga la información respecto de cada una de ellas, de acuerdo con lo siguiente:", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Debemos reportar que no aplica", "obligatoriedad": "NA", "intro": true, "numlabel": "6.5.1 6.5.1"}, {"id": "6_5_1_i", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "i", "req": "i. Individualización, domicilio y naturaleza jurídica.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 i"}, {"id": "6_5_1_ii", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "ii", "req": "ii. Capital suscrito y pagado.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 ii"}, {"id": "6_5_1_iii", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "iii", "req": "iii. Objeto social e indicación clara de la o las actividades que desarrolla.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 iii"}, {"id": "6_5_1_iv", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "iv", "req": "iv. Nombre y apellidos del o los directores, administradores, en su caso, y gerente general.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 iv"}, {"id": "6_5_1_v", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "v", "req": "v. Porcentaje actual de participación de la matriz o entidad inversora en el capital de la subsidiaria o asociada y variaciones ocurridas durante el último ejercicio.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 v"}, {"id": "6_5_1_vi", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "vi", "req": "vi. Porcentaje que representa la inversión en cada subsidiaria o asociada sobre el total de activos individuales de la sociedad matriz. En las subsidiarias el monto de la inversión se determinará considerando la participación de la matriz sobre los activos netos informados en los estados financieros usados en la consolidación y en las asociadas el valor determinado según el método de la participación.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 vi"}, {"id": "6_5_1_vii", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "vii", "req": "vii. Indicación del nombre y apellidos del director, gerente general o ejecutivos principales de la matriz o entidad inversora que desempeñen algunos de esos cargos en la subsidiaria o asociada.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 vii"}, {"id": "6_5_1_viii", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "viii", "req": "viii. Descripción clara y detallada de las relaciones comerciales habidas con las subsidiarias o asociadas durante el ejercicio y de la vinculación futura proyectada para con éstas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 viii"}, {"id": "6_5_1_ix", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "ix", "req": "ix. Relación sucinta de los actos y contratos celebrados con las subsidiarias o asociadas que influyan significativamente en las operaciones y resultados de la matriz o entidad inversora.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 ix"}, {"id": "6_5_1_x", "node": "6.5", "sec": "6", "sub": "6.5.1", "item": "x", "req": "x. Cuadro esquemático en que se expongan las relaciones de propiedad directa e indirecta existentes entre la matriz, las subsidiarias o asociadas, así como las existentes entre ellas.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "NA", "obligatoriedad": "NA", "intro": false, "numlabel": "6.5.1 x"}, {"id": "6_5_2_6_5_2", "node": "6.5", "sec": "6", "sub": "6.5.2", "item": "6.5.2", "req": "Respecto de aquellas entidades en que se posean inversiones que representen más del 20% del activo total de la entidad, y que no revistan el carácter de subsidiarias o asociadas, deberá presentarse un detalle que contenga la siguiente información:", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Debemos considerar participación en sociedades cuando la AGF destina fondos en acciones de empresas? RESPUESTA KMPG:SI\nTenemos que levantar el porcentage de particiapcion que tenemos en todas las empresa de cada fondo y reportar aquellas que sean superior a un 20%", "obligatoriedad": "SI", "intro": true, "numlabel": "6.5.2 6.5.2"}, {"id": "6_5_2_i", "node": "6.5", "sec": "6", "sub": "6.5.2", "item": "i", "req": "i. Individualización de ellas y naturaleza jurídica.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Sigue comentario del item 6.5.2", "obligatoriedad": "SI", "intro": false, "numlabel": "6.5.2 i"}, {"id": "6_5_2_ii", "node": "6.5", "sec": "6", "sub": "6.5.2", "item": "ii", "req": "ii. Porcentaje de participación.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Sigue comentario del item 6.5.2", "obligatoriedad": "SI", "intro": false, "numlabel": "6.5.2 ii"}, {"id": "6_5_2_iii", "node": "6.5", "sec": "6", "sub": "6.5.2", "item": "iii", "req": "iii. Descripción de las principales actividades que realicen.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Sigue comentario del item 6.5.2", "obligatoriedad": "SI", "intro": false, "numlabel": "6.5.2 iii"}, {"id": "6_5_2_iv", "node": "6.5", "sec": "6", "sub": "6.5.2", "item": "iv", "req": "iv. Porcentaje del activo total individual de la sociedad que representan estas inversiones.", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "NA", "comentarios": "Sigue comentario del item 6.5.2", "obligatoriedad": "SI", "intro": false, "numlabel": "6.5.2 iv"}, {"id": "7_1_7_1", "node": "7.1", "sec": "7", "sub": "7.1", "item": "7.1", "req": "Se deberá explicar la política de pago a proveedores, indicando si ésta distingue entre proveedores críticos y no críticos; si la entidad cuenta con políticas que promuevan plazos de pago oportuno; y si se ha definido una meta, en número de días calendario, como plazo máximo de pago a sus proveedores nacionales y/o extranjeros.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "ok", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 7.1"}, {"id": "7_1_7_1_2", "node": "7.1", "sec": "7", "sub": "7.1", "item": "7.1", "req": "Junto con ello deberá divulgar, en rangos de hasta 30 días, entre 31 y 60 días, y más de 60 días calendario, desde la fecha de recepción de la factura, distinguiendo, al menos, entre proveedores nacionales y extranjeros, cuando corresponda:", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "Revisar lo de abajo.", "obligatoriedad": "SI", "intro": true, "numlabel": "7.1 7.1"}, {"id": "7_1_i", "node": "7.1", "sec": "7", "sub": "7.1", "item": "i", "req": "i. Número de Facturas pagadas: el número de facturas pagadas durante el año a proveedores por cada uno de los rangos ya señalados.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "Debemos levantar informacion al area correspondiente y reportarlo.", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 i"}, {"id": "7_1_ii", "node": "7.1", "sec": "7", "sub": "7.1", "item": "ii", "req": "ii. Monto Total (millones de pesos): la suma del valor de las facturas pagadas durante el año por cada uno de los rangos ya señalados.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "Debemos levantar informacion al area correspondiente y reportarlo.", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 ii"}, {"id": "7_1_iii", "node": "7.1", "sec": "7", "sub": "7.1", "item": "iii", "req": "iii. Monto Total intereses por mora en pago de facturas (millones de pesos): la suma del valor de los intereses que se pagaron o deberán pagar por mora o simple retardo por las facturas emitidas durante el período reportado.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "Debemos levantar informacion al area correspondiente y reportarlo.", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 iii"}, {"id": "7_1_iv", "node": "7.1", "sec": "7", "sub": "7.1", "item": "iv", "req": "iv. Número de Proveedores: la cantidad de proveedores al que corresponden las facturas pagadas durante el año en cada uno de los rangos ya señalados.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "Debemos levantar informacion al area correspondiente y reportarlo.", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 iv"}, {"id": "7_1_v", "node": "7.1", "sec": "7", "sub": "7.1", "item": "v", "req": "v. Número de acuerdos inscritos en el Registro de Acuerdos con Plazo Excepcional de Pago que lleva el Ministerio de Economía cuando corresponda.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "40", "comentarios": "ok", "obligatoriedad": "SI", "intro": false, "numlabel": "7.1 v"}, {"id": "7_2_i", "node": "7.2", "sec": "7", "sub": "7.2", "item": "i", "req": "Deberá indicar si cuenta con políticas para evaluar a los proveedores y, en particular, si la entidad cuenta con procedimientos implementados con el objetivo de conocer y evaluar para sus propios fines la calidad del gobierno corporativo, sistema de gestión de riesgos y otros aspectos de sostenibilidad de sus proveedores, y las prácticas de aquellos en esas materias. Para esos efectos, se deberá mencionar qué tipo de criterios se emplean.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "-", "comentarios": "Debemos revisar la politica de proveedores y ver si en esta se detalla los procesos de evaluación. Sino, debemos explicitamente que no tenemos procedimiento de evaluacion.", "obligatoriedad": "NO", "intro": false, "numlabel": "7.2 i"}, {"id": "7_2_ii", "node": "7.2", "sec": "7", "sub": "7.2", "item": "ii", "req": "Junto con ello deberá divulgar el número de proveedores que se hubieren analizado durante al año considerando aquellos criterios de sostenibilidad que la propia entidad se hubiere definido, el porcentaje que éstos representan del total de proveedores evaluados, el porcentaje de las compras totales del año que corresponde a proveedores analizados bajo criterios de sostenibilidad, distinguiendo, al menos, entre proveedores nacionales y extranjeros.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "-", "comentarios": "Explicar que se evaluan en materia de derechos humanos este 2025", "obligatoriedad": "SI", "intro": false, "numlabel": "7.2 ii"}, {"id": "7_2_iii", "node": "7.2", "sec": "7", "sub": "7.2", "item": "iii", "req": "Lo anterior se deberá referir a todos los proveedores evaluados durante el año, ya sea que fueren analizados para decidir sobre el inicio de una relación contractual o comercial, independientemente si aquella se llegara a celebrar o no, o bien a consecuencia de procesos de revisión de aquellos con los cuales ya contara con una relación de ese tipo.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "-", "comentarios": "En caso de no exisitir procesos o guias de evaluacion. Debemos elaborarlas.", "obligatoriedad": "SI", "intro": false, "numlabel": "7.2 iii"}, {"id": "8_1_8_1", "node": "8.1", "sec": "8", "sub": "8.1", "item": "8.1", "req": "Se deberá informar si la entidad cuenta con procedimientos destinados a prevenir y detectar incumplimientos regulatorios referidos a los derechos de sus clientes, en especial respecto a la Ley N°19.496 sobre Protección de los Derechos del Consumidor o aquella legislación equivalente cuando la entidad opere en jurisdicciones extranjeras. Además, se deberá informar el número de sanciones ejecutoriadas en este ámbito y el monto en pesos que representaron esas sanciones.", "responsable": "Ivonne Muller", "area": "Clientes, Calidad y Proveedores", "pagina": "42", "comentarios": "Reportamos tener politicas y procedimientos de incumplimientos regulatorios, pero no especificamos cuales son esos. Debemos relacionarlos con nuestros clientes.", "obligatoriedad": "SI", "intro": false, "numlabel": "8.1 8.1"}, {"id": "8_2_8_2", "node": "8.2", "sec": "8", "sub": "8.2", "item": "8.2", "req": "Se deberá informar si la entidad cuenta con procedimientos destinados a prevenir y detectar incumplimientos regulatorios referidos a los derechos de sus trabajadores. Además, se deberá informar el número de sanciones ejecutoriadas en este ámbito y el monto en pesos que representaron esas sanciones. Deberá referirse especialmente a si ha sido objeto de acciones de tutela laboral.", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "42", "comentarios": "Reportamos tener politicas y procedimientos de incumplimientos regulatorios en relacion a los trabajadores. Pero no damos detalles si estos procedimientos son para PREVENIR Y DETECTAR incumplimientos regulatorios de la empresa para con los trabajadores.\nDe no existir sanciones en este ambito debemos explicitarlo", "obligatoriedad": "SI", "intro": false, "numlabel": "8.2 8.2"}, {"id": "8_3_8_3_i", "node": "8.3", "sec": "8", "sub": "8.3", "item": "8.3.i", "req": "Se deberán informar los modelos de cumplimiento o programas de cumplimiento que contengan información sobre la definición de sus obligaciones ambientales, modalidad de cumplimiento fijada, plazo de implementación de la conducta de cumplimiento, unidad responsable, matriz de riesgo ambiental y todo antecedente relevante relativo a la comprensión de dicha obligación y su cumplimiento. En caso de no contar con tales modelos o programas, se deberá especificar claramente ese hecho e indicar las razones.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "42", "comentarios": "Considerar la elaboracion de aspectos medioambientales relevantes para la compañía. PODEMOS REPORTAR QUE NO CONTAMOS CON LOS REQUERIMIENTOS.", "obligatoriedad": "NA", "intro": false, "numlabel": "8.3.i"}, {"id": "8_3_8_3_ii", "node": "8.3", "sec": "8", "sub": "8.3", "item": "8.3.ii", "req": "Además, se deberá reportar el número de sanciones ejecutoriadas del Registro Público de Sanciones de la Superintendencia de Medio Ambiente o de aquel órgano equivalente en jurisdicciones extranjeras, el total de multas; y el número de programas de cumplimiento aprobados; programas de cumplimiento ejecutados satisfactoriamente; planes de reparación por daño ambiental presentados; y planes de reparación por daño ambiental ejecutados satisfactoriamente.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "42", "comentarios": "-", "obligatoriedad": "NA", "intro": false, "numlabel": "8.3.ii"}, {"id": "8_4_8_4", "node": "8.4", "sec": "8", "sub": "8.4", "item": "8.4", "req": "Se deberá informar si la entidad cuenta con procedimientos destinados a prevenir y detectar incumplimientos regulatorios que puedan afectar la libre competencia. Además, se deberá informar el número de sanciones ejecutoriadas en este ámbito y el monto en pesos que representaron esas sanciones.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "43", "comentarios": "Detallar un poco mas lo que el codigo de etica dice respecto a la libre competencia.", "obligatoriedad": "SI", "intro": false, "numlabel": "8.4 8.4"}, {"id": "8_5_8_5", "node": "8.5", "sec": "8", "sub": "8.5", "item": "8.5", "req": "Se deberá informar si la entidad cuenta con procedimientos destinados a prevenir y detectar incumplimientos regulatorios a la Ley N°20.393 que establece la responsabilidad penal de las personas jurídicas. Además, se deberá informar el número de sanciones ejecutoriadas en este ámbito y el monto en pesos que representaron esas sanciones.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "44", "comentarios": "-", "obligatoriedad": "SI", "intro": false, "numlabel": "8.5 8.5"}, {"id": "9_1_9_1", "node": "__niif", "sec": "9", "sub": "9.1", "item": "9.1", "req": "Deberá reportar conforme al estándar NIIF S1 Requerimientos Generales para la Información Financiera a Revelar Relacionada con la Sostenibilidad del International Sustainability Standards Board (ISSB) y NIIF S2 Información a Revelar Relacionada con el Clima del ISSB, considerando el mismo periodo anual al que está referida la memoria.”", "responsable": "", "area": "", "pagina": "", "comentarios": "", "obligatoriedad": "NA", "intro": false, "numlabel": "9.1 9.1"}, {"id": "9_2_FN_AC_330a_1", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-330a.1", "req": "Porcentaje de representación de género para\n1) Gerencia ejecutiva\n2) Gerencia no ejecutiva\n3) Profesionales\n4) Todos los demás empleados", "responsable": "Loreto Cornejo", "area": "Gestión de Personas", "pagina": "45", "comentarios": "-", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-330a.1"}, {"id": "9_2_FN_AC_510a_1", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-510a.1", "req": "Importe total de las pérdidas monetarias como\nresultado de los procedimientos judiciales\nrelacionados con el fraude, uso de información\nprivilegiada, antimonopolio, competencia\ndesleal, manipulación del mercado, mala\npraxis u otras leyes o reglamentos relacionados\nde la industria5", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "45", "comentarios": "Creo que debemos reportar los desembolsos monetarios por concepto de procedimientos judiciales. Y no necesariamente una perdida operacional", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-510a.1"}, {"id": "9_2_FN_AC_510a_2", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-510a.2", "req": "Descripción de las políticas y los\nprocedimientos de denuncia de irregularidades", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "45", "comentarios": "Detallar un poco mas", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-510a.2"}, {"id": "9_2_FN_AC_410a_1", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-410a.1", "req": "Cantidad de activos en gestión, por clase de\nactivos, que emplean (1) integración de temas\nambientales, sociales y de gobierno\ncorporativo (ESG), (2) inversión temática en\nsotenibilidad, y (3) screening", "responsable": "Allan Ugarte", "area": "Sostenibilidad", "pagina": "45", "comentarios": "falta solo un porcentaje y volver a hacer seguimiento este año", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-410a.1"}, {"id": "9_2_FN_AC_410a_2", " _410b_4", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-410b.4", "req": "Descripción de la metodología utilizada para calcular las emisiones financiadas.", "responsable": "", "area": "", "pagina": "", "comentarios": "ok", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-410b.4"}, {"id": "9_2_FN_AC_270a_1", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-270a.1", "req": "Número y % de empleados con antecedentes \nde investigaciones relacionadas con inversio-\nnes, reclamos por parte de consumidores, \nlitigios civiles privados u otros procedimientos \nregulatorios.", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "45", "comentarios": "-", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-270a.1"}, {"id": "9_2_FN_AC_270a_2", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-270a.2", "req": "Importe total de las pérdidas monetarias como\nresultado de los procedimientos judiciales\nrelacionados con el marketing y la\ncomunicación de información relacionada con\nproductos financieros a clientes nuevos y\nantiguos", "responsable": "Rodrigo Avendaño", "area": "Compliance", "pagina": "45", "comentarios": "Creo que debemos reportar los desembolsos monetarios por concepto de procedimientos judiciales.", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-270a.2"}, {"id": "9_2_FN_AC_270a_3", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-270a.3", "req": "Descripción del enfoque para informar a los\nclientes sobre los productos y servicios", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "45", "comentarios": "Falta hacer el analisis y reportarlo", "obligatoriedad": "NO", "intro": false, "numlabel": "9.2 FN-AC-270a.3"}, {"id": "9_2_FN_AC_000_A", "node": "9.1", "sec": "9", "sub": "9.2", "item": "FN-AC-000.A", "req": "(1) Total de activos registrados", "responsable": "Jorge Venthur", "area": "AGF / Gerencia General", "pagina": "45", "comentarios": "Levantamiento olítica de inversión responsable; due diligence ESG; reporting a clientes.", "ods": ["12.6", "13.2"]}, {"tipo": "Oportunidad", "cat": "Social", "desc": "Cultura y bienestar social (tema material · prioridad principal, puntaje 3,52)", "horiz": "Mediano plazo", "impacto": "Productividad y bienestar del equipo; reducción de ausentismo.", "resp": "Programas de bienestar; políticas de conciliación y salud mental.", "ods": ["3.4", "8.8"]}, {"tipo": "Oportunidad", "cat": "Social", "desc": "Inclusión y educación financiera (tema material · prioridad relevante, puntaje 3,48)", "horiz": "Mediano plazo", "impacto": "Ampliación de la base de clientes y contribución social medible.", "resp": "Programas de educación financiera; registro de personas alcanzadas.", "ods": ["4.4", "8.10", "10.2"]}, {"tipo": "Oportunidad", "cat": "Ambiental — Físico", "desc": "Ecoeficiencia operacional (tema material · prioridad relevante, puntaje 3,34)", "horiz": "Mediano plazo", "impacto": "Reducción de costos y de la huella operacional propia.", "resp": "Inventario GEI alcance 1-2; metas de eficiencia energética; reciclaje.", "ods": ["12.2", "12.5", "13.2"]}, {"tipo": "Oportunidad", "cat": "Ambiental — Transición", "desc": "Financiamiento sostenible e impacto ambiental (tema material · prioridad relevante, puntaje 3,27)", "horiz": "Mediano plazo", "impacto": "Acceso a financiamiento verde y demanda creciente de productos sostenibles.", "resp": "Marco de bonos/fondos verdes; medición de impacto y tCO₂e evitadas.", "ods": ["7.2", "9.4", "13.2"]}]}]}};
const PREVANS={"2.1||2.1": {"ans": "MISIÓN\nPromover inversiones que generen rentas permanentes con propuestas de inversión en diferentes activos –tanto en Chile como en el extranjero– que a la vez contribuyan a la sostenibilidad y buenas prácticas empresariales. \n\nVISIÓN\nSer uno de los mejores originadores, gestores y distribuidores de productos de excelencia, dando acceso a múltiples y flexibles oportunidades de inversión en cada mercado que operemos, siendo un referente en el mercado financiero. Queremos ser una empresa con sentido, que se relaciona con la sociedad y nuestros clientes logrando cercanía, permanencia y continuidad. Buscamos de manera altruista ser agentes de    cambio en Chile y nuestra región.\n\nPROPÓSITO \nGenerar valor financiero sostenible, innovador y humano a nuestros clientes, colaboradores y organizaciones con las cuales nos relacionamos en el crecimiento.\n\nVALORES\nNuestros valores son una guía que marcan el sello de cómo operamos como organización y la forma en que nos relacionamos con los diferentes grupos de interés: colaboradores, clientes, comunidad y proveedores. Para esto hemos definido seis valores corporativos que nos caracterizan como grupo Vantrust Capital: colaboración, cercanía, excelencia, innovación, integridad y compromiso.", "year": 2025, "area": "AGF"}, "2.2||2.2": {"ans": "2018: Se constituye Vantrust Capital AGF por escritura pública y en agosto es autorizada por la CMF. \n2019: Se crea el primer Fondo de Inversión Vantrust Capital Acciones Nacionales que comienza sus operaciones bajo la administración de Vantrust Capital Administradora General de Fondos.\n2020: Nace Fondo Vantrust Península con inversiones en Estados Unidos y abierto a otros canales extranjeros.\n2021: Comienza a operar la plataforma de arquitectura abierta de inversión en el extranjero.\n2022: Inician operaciones en dos fondos: Fondo de Inversión Vantrust Multifamily Inmobiliario y el Fondo de Inversión Privado Vantrust Península Real Estate II. \n2023: El 23 de noviembre de 2023, abandona la presidencia del directorio el señor José Elías Aboid y se designa como presidente del directorio de la Administradora a don Víctor Zerbino Torrendell.\n2024: Inicia operaciones el Fondo Fondo de Inversión Vantrust Capital Acciones Dividend Stars. En octubre de 2024 asume la gerencia general el señor Alfredo Tagle Silva. Inicia operaciones el Fondo Fondo de Inversión Vantrust Capital Acciones Dividend Stars. En octubre de 2024 asume la gerencia general el señor Alfredo Tagle Silva. Renuncia victor zerbino y asume jorge Uauy. \n2025: 25 de julio renuncia alfredo tagle y asume jorge venthur. Se aumenta el fondo FI Inmobiliario IV en 100.000 UF", "year": 2025, "area": "AGF"}, "2.3.1||i": {"ans": "Inversiones VNT S.A., sin acuerdo de actuación conjunta, es el controlador directo de Vantrust Capital Administradora General de Fondos S.A", "year": 2025, "area": "AGF"}, "2.3.1||ii": {"ans": "El 28 de Abril del 2025 Vantrust Capital Administradora General de Fondos S.A. realizó un aumento de capital de 78,100 acciones nominativas por el monto de $78.100.000 pesos chilenos. Por lo que, a la fecha mantiene un capital de $1.178.100.000 dividido en 1.178.100 acciones ordinarias, no tranzadas en bolsa, de plazo de vigencia indefinido, nominativas, de una única serie, de igual valor cada una y sin valor nominal, el cual se suscribe y paga por los accionistas de la sociedad, los cuales no han cambiado desde que se constituyó Vantrust Administradora General de Fondos.\nAl 31 de diciembre del 2025 de los $78.100.000 de los cuales estan pagados 60millones. Por lo que, quedan suscritos y no pagados a la fecha (31 de diciembre de 2025) $18.100.000.\nLa distribución accionaria al 31 de diciembre de 2025 es: Inversiones VNT S.A. (RUT 76.786.470-1) con 1.178.099 acciones suscritas y 1.159.999 pagadas, equivalentes al 99,9999151%; y Jorge Valenzuela Raccoursier (RUT 9.664.266-0) con 1 acción, equivalente al 0,0000849%.", "year": 2025, "area": "AGF"}, "2.3.1||iii": {"ans": "Inversiones VNT S.A., sin acuerdo de actuación conjunta, es el controlador directo de VanTrust Capital Administradora General de Fondos S.A.", "year": 2025, "area": "AGF"}, "2.3.1||iv": {"ans": "No aplica, sin acuerdo de actuación conjunta.", "year": 2025, "area": "AGF"}, "2.3.2||2.3.2": {"ans": "El 28 de Abril del 2025 Vantrust Capital Administradora General de Fondos S.A. realizó un aumento de capital de 78,100 acciones nominativas por el monto de $78.100.000 pesos chilenos. Por lo que, a la fecha mantiene un capital de $1.178.100.000 dividido en 1.178.100 acciones ordinarias, no tranzadas en bolsa, de plazo de vigencia indefinido, nominativas, de una única serie, de igual valor cada una y sin valor nominal, el cual se suscribe y paga por los accionistas de la sociedad, los cuales no han cambiado desde que se constituyó Vantrust Administradora General de Fondos.\nAl 31 de diciembre del 2025 de los $78.100.000 de los cuales estan pagados 60millones. Por lo que, quedan suscritos y no pagados a la fecha (31 de diciembre de 2025) $18.100.000.\nLa distribución accionaria al 31 de diciembre de 2025 es: Inversiones VNT S.A. (RUT 76.786.470-1) con 1.178.099 acciones suscritas y 1.159.999 pagadas, equivalentes al 99,9999151%; y Jorge Valenzuela Raccoursier (RUT 9.664.266-0) con 1 acción, equivalente al 0,0000849%.", "year": 2025, "area": "AGF"}, "2.3.3||i": {"ans": "Nombre\nVantrust Capital Administradora General de Fondos S.A.\nRUT\n76.930.595-5\nTipo de entidad\nSociedad Anónima Especial\nInversiones VNT S.A., sin acuerdo de actuación conjunta, es el controlador directo de Van_x0002_trust Capital Administradora General de Fondos S.A.", "year": 2025, "area": "AGF"}, "2.3.3||ii": {"ans": "No hay.", "year": 2025, "area": "AGF"}, "2.3.3||iii": {"ans": "No hay.", "year": 2025, "area": "AGF"}, "2.3.3||iv": {"ans": "Al 31 de diciembre de 2025 la propiedad de la Administradora se reparte entre dos accionistas, de una única serie de acciones ordinarias: Inversiones VNT S.A. (RUT 76.786.470-1), controlador directo, con 1.178.099 acciones suscritas y 1.159.999 pagadas, equivalentes al 99,9999151% de la participación; y Jorge Valenzuela Raccoursier (RUT 9.664.266-0), con 1 acción suscrita y pagada, equivalente al 0,0000849%. No hay accionistas mayoritarios distintos del controlador, ni ADR, ni fondos de pensiones, ni otros inversionistas institucionales, de modo que el gráfico de participación por grupo se reparte íntegramente entre el controlador y «otros accionistas minoritarios».\n\nEl 28 de abril de 2025 la sociedad realizó un aumento de capital de 78.100 acciones nominativas por $78.100.000, con lo que el capital quedó en $1.178.100.000 dividido en 1.178.100 acciones. De ese aumento, al 31 de diciembre de 2025 estaban pagados $60.000.000 y quedaban suscritos y no pagados $18.100.000.", "year": 2025, "area": "AGF", "pagina": "15"}, "2.3.4||i": {"ans": "a la fecha mantiene un capital de $1.178.100.000 dividido en 1.178.100 acciones ordinarias, no tranzadas en bolsa, de plazo de vigencia indefinido, nominativas, de una única serie, de igual valor cada una y sin valor nominal, el cual se suscribe y paga por los accionistas de la sociedad, los cuales no han cambiado desde que se constituyó Vantrust Administradora General de Fondos.", "year": 2025, "area": "AGF"}, "2.3.4||ii": {"ans": "Por norma general y por cómo se define en su constitución, la Administradora pagará a sus accionistas al menos el 30% de las utilidades generadas.", "year": 2025, "area": "AGF"}, "2.3.4||iii.a": {"ans": "el 2025 no hubo reparto de dividendos.", "year": 2025, "area": "AGF"}, "2.3.4||iii.b": {"ans": "Acciones ordinarias, no tranzadas en bolsa.", "year": 2025, "area": "AGF"}, "2.3.4||iii.c": {"ans": "Revisar en Tabla1_2025 hoja \"Indicadores 2025\" para porcentajes actualizados", "year": 2025, "area": "AGF"}, "2.3.5||2.3.5": {"ans": "No emite otros valores.", "year": 2025, "area": "AGF"}, "3.1||v": {"ans": "Durante 2024, el Directorio de Vantrust Capital AGF aprobó una metodología de evaluación ASG para los activos incluidos en los fondos actuales y potenciales de la Administradora. Esta metodología mide el grado en que las entidades gestionan su exposición y manejo de factores ASG, relevantes tanto para ellas como para sus stakeholders, considerando su capacidad para mitigar riesgos y generar valor sostenible. La metodología implementada permite identificar riesgos y oportunidades ASG, ofreciendo una visión integral del impacto en los stakeholders, el negocio, la sociedad y el medio ambiente. Esta metodologia recopila información cualitativa y cuantitativa de los temas materiales de cada industria en la que opera el fondo de inversiones por medio del gestor o empresa subyacente. la analiza y genera un puntaje de desempeño ASG. La metodogia ha sido creada pensando en empresas de todos los tamaños, tanto pequeñas, sin tranzar en bolsa, como aquellas que sí lo ahcen.\nEn el 2025 vantrust capital AGF ha seguido evaluando los fondos de inverisones, cubriendo 11 de los 12 fondos bajo gestión, lo que representa un [% AUM POR DETERMINAR] del total de activos bajo administración (AUM). El screening aplicado se basa en las definiciones del PRI (Principles for Responsible Investment). Para los fondos con activos incluidos y transados en bolsa, se empleó un screening positivo, mientras que, para los fondos con activos no transados, se utilizó un screening normativo (“norm-based screening”). Este avance refuerza el compromiso de Vantrust Capital AGF con la integración de factores ASG en la gestión de activos, fomentando una sostenibilidad a mediano y largo plazo. Este proceso incluye distintas etapas. La comunicación con la compañía, cuando corresponda, para solicitar información ASG, involucra las áreas de sostenibilidad y riesgo de crédito. Posteriormente, se evalúa la información solicitada junto con datos disponibles públicamente en el mercado, proceso liderado por el área de sostenibilidad. Los resultados de esta evaluación se presentan en comités, como el de Inversiones y/o de Riesgo, donde se toman decisiones en su instancia de aprobación. Finalmente, se realiza un seguimiento continuo del desempeño ASG de la empresa, donde sostenibilidad revisa periódicamente la existencia de controversias que puedan afectar el desempeño ASG de la compañía y, en consecuencia, el retorno presupuestado.", "year": 2025, "area": "AGF"}, "3.2||i": {"ans": "GLORIA MALDONADO - DIRECTORA: Ingeniería civil química, con más de 27 años de experiencia en Gerenciamiento y Dirección, tanto en el sector público como privado. Hoy preside el Directorio de Enap. En paralelo, durante dos años medio presidió Directorio de CorreosChile. Es miembro del Directorio de HubTec Chile y de ForoInnovación.  Es asesora del Consejo Asesor Global de Ingeniería y Energía del G100 y miembro de Chapter Zero.Complementariamente, desde 2016 ha sido mentora de negocios de Mujeres Empresarias, ComunidadMujer y StartUpChile, asesorando a emprendedores tecnológicos. \n\nGERMÁN BARBOSA REBOLLEDO - DIRECTOR: Ingeniero Civil de la Universidad de Concepción con 28 años de experiencia en los sectores de Banca Financiera y Mercado de Valores. Ex director socio en IM Trust, Gerente de Operaciones en Dresdner Bank y BNP, consultor internacional en el grupo ING Bank / IGA para la reestructuración bancaria y reingeniería internacional, encargadas por los Bancos Centrales, el Fondo Monetario Internacional (FMI) y el Banco Mundial.\n\nALEJANDRO GÓMEZ SABA - DIRECTOR: Economista de la Universidad del Pacífico de Perú con Magíster en Administración de la misma universidad. Cuenta con gran experiencia como ejecutivo, director, asesor y docente, donde se ha desempeñado por más de 27 años. Es presidente y fundador de la Asociación Peruana de Finanzas (APEF). Actualmente, es director y asesor de empresas y familias líderes.\n\nJORGE UAUY SALVADOR - PRESIDENTE: Ingeniero Civil Industrial de la Universidad de Chile y MBA de la Pontificia Universidad Católica, con más de 40 años de experiencia en cargos ejecutivos y directivos en el sector financiero. Su trayectoria incluye roles destacados como director en Laboratorio Chile, Farmindustria, Deportes Palestino, entre otros. Su experiencia abarca liderazgo estratégico, gobernanza corporativa y desarrollo empresarial.\n\nLiliana Manns deja el directorio de la Administradora el 26 de Mayo de 2025", "year": 2025, "area": "AGF"}, "3.2||ii": {"ans": "La dieta asignada a cada director o directora es 100% fija para todos, con la consideración de que la divisa de pago es en dólares para quienes ejercen sus funciones off-shore. La remuneración mensual de 2025 fue de $1.100.000 para Liliana Manns Gantz, Germán Barbosa Rebolledo, Gloria Maldonado Figueroa y Jorge Uauy Salvador, y de USD 1.100 para Alejandro Gómez Saba; en 2023 la dieta era de $770.000 para Manns y Barbosa. Ninguno percibió remuneración variable en los tres ejercicios. Los montos corresponden a la remuneración mensual (nota 7 de la memoria).\n\nComo no se hace distinción entre la remuneración de los directores según su género, no existe brecha salarial alguna en el Directorio. El Directorio aún no cuenta con una política para regular la revisión de las estructuras salariales, de compensación e indemnización del gerente general y los ejecutivos principales. Los miembros de los comités no reciben remuneración adicional a su dieta habitual.\n\nLiliana Manns presentó su renuncia al Directorio el 26 de mayo de 2025 (nota 8).", "year": 2025, "area": "AGF", "pagina": "36-37"}, "3.2||iv": {"ans": "Con el objetivo de tener una mirada estratégica global y sectorial para el funcionamiento de la AGF, el Directorio cuenta con variados perfiles profesionales y habilidades acordes a la industria en la que se desenvuelven, principalmente la financiera y de distintas regiones de América Latina. Gracias a esta diversidad, el órgano directivo se beneficia de un amplio espectro de conocimientos y de una mayor capacidad de adaptación frente a los continuos cambios del mercado, lo que facilita una toma de decisiones fundamentada en la planificación estratégica.\n\nLa matriz de habilidades del Directorio de la memoria señala las áreas de especialización y el aporte de cada integrante a la gestión de la AGF. La matriz se usa además como herramienta de apoyo de la Política de Elección de Directores, que define el perfil recomendado de capacidades y diversidad —de género, profesional y de experiencia— para el Directorio.", "year": 2025, "area": "AGF", "pagina": "37"}, "3.2||viii": {"ans": "Durante el 2025 distintos directores de la AGF visitaron 17 veces las oficinas de vantrust capital", "year": 2025, "area": "AGF"}, "3.2||ix.c": {"ans": "La contratación de servicios externos está contemplada en la política de Riesgos de Proveedores 2025. La cual permite contratar asesorias expertas tanto para la evaluación de desempeño del directorio, como para cualquier otra mejora en su gestión. Sin embargo, durante el 2025 el directorio de la AGF realizó 2 autoevaluaciones del mismo. Una de inicio de año y otra de fin de año.", "year": 2025, "area": "AGF"}, "3.2||x": {"ans": "Nuestro directorio cuenta con todas las facilidades para asistir a las sesiones de carácter mensual, independientemente de donde se encuentren, dado que la Administradora permite la conexión remota a través de conferencia virtual. Por esto, el gerente general de la Administradora hace envío de documentos e información relevante para el directorio con anticipación suficiente para una correcta gestión y discusión. \nLas sesiones ordinarias de directorio se realizan una vez por mes, y a estas se suman  juntas extraordinarias que podrían ser necesarias frente a crisis o temas especiales a tratar. La duración de las sesiones y su asistencia se detallan en la Tabla8_2025 en la hoja \"Indicadores 2025\"", "year": 2025, "area": "AGF"}, "3.2||xii.a": {"ans": "Cada director(a) cuenta con acceso permanente, mientras esté en el cargo, a las actas de todos los directorios pasados en una carpeta compartida disponibilizada para su revisión. Además cuentan con acceso permanente a las actas de los comités y juntas de accionistas, Los brochires de los fondos activos, el codigo de etica, las leyes aplicables a la Administradoras y las politicas y manuales atingentes.", "year": 2025, "area": "AGF"}, "3.2||xii.b": {"ans": "el gerente general de la Administradora hace envío de documentos e información relevante para el directorio con anticipación suficiente para una correcta gestión y discusión.", "year": 2025, "area": "AGF"}, "3.2||xii.d": {"ans": "Tras terminar cada sesión, el mismo gerente es quien facilita el acta a cada uno de ellos/as mediante un correo formal para su firma y aprobación en máximo 20 días seguidos desde el fin de esta. \n\nToda la información de las sesiones de directorio se almacena en los servidores de la empresa, y cada director queda con la copia permanente en sus correos personales.", "year": 2025, "area": "AGF"}, "3.3||i": {"ans": "COMITÉS EN LOS QUE PARTICIPA UN DIRECTOR (A)\nCOMPLIANCE:  Dentro de los temas que se abordan están el estado de actualización de las políticas, revisión de los procesos regulatorios, el proceso de certificación de la Responsabilidad Penal de las Personas jurídicas (RPPJ), ambiente de control (circular N° 49 UAF de la CMF, circular 1869, NCG 216, 270, 278, 412 CMF y artículo 100 Ley N° 18.045), proceso de monitoreo, capacitaciones, seguimiento al plan anual y seguimiento a compromisos del comité.\nRIESGO OPERACIONAL: - Dentro de los temas están la revisión de indicadores, el seguimiento de riesgo de crédito, el seguimiento al cumplimiento de los reglamentos internos, los eventos operacionales, el \nestado de las auditorías internas, externas a la  Administradora y a los Fondos, así como a los oficios y comunicaciones con el regulador. El jefe de riesgo operacional realiza una presentación trimestral al directorio de las temáticas que se presentan en este comité, con foco en los indicadores y eventos operacionales.\n\nCOMITÉS EJECUTIVOS\n\nTI Y SEGURIDAD ROL: Considera como temática principal la administración de las tecnologías de información, seguridad de la información y la ciberseguridad. En este sentido es el encargado de gestionar el riesgo tecnológico, la supervisión de proyectos, el cumplimiento normativo, el monitoreo del desempeño y el desarrollo de políticas y gobierno corporativo de TI.\n'SOSTENIBILIDAD ROL: Es el primer órgano de revisión y discusión en avances de sostenibilidad dentro de Vantrust. Supervisa el cumplimiento normativo en materia de sostenibilidad. Genera feed_x0002_backs respecto de convenios y alianzas estratégicas para cumplir con los acuerdos.", "year": 2025, "area": "AGF"}, "3.3||ii": {"ans": "COMITÉS EN LOS QUE PARTICIPA UN DIRECTOR (A)\nCOMPLIANCE: PARTICIPANTES - Director AGF, gerente de negocios, gerente de operaciones y control financiero, gerente general AGF, gerente compliance y riesgo operacional.\nRIESGO OPERACIONAL: PARTICIPANTES - director AGF, Jefe riesgo operacional, Gerente Comercial, gerente de operaciones y control financiero, gerente de compliance y riesgo operacional, gerente general AGF.\n\nEJECUTIVOS\nTI Y SEGURIDAD: PARTICIPANTES - Gerente de tecnología, jefe de TI y seguridad de la información, gerente operaciones y control financiero, gerente general AGF, gerente de clientes y calidad, gerente de cumplimiento y riesgo operacional, jefe de riesgo operacional, gerente de negocios, PMO, director AGF.\n'SOSTENIBILIDAD: PARTICIPANTES - Directora ejecutiva, directora AGF, gerente general AGF, Gerente de Estrategia y sostenibilidad, gerente de compliance y riesgo operacional, gerente de clientes y calidad, gerente gestión de personas, analista desarrollador de contenido,Especialista de Sostenibilidad, Gerente de Riesgo.", "year": 2025, "area": "AGF"}, "3.3||iii": {"ans": "Los miembros de los comités no reciben remuneración alguna adicional a su salario habitual. Lo mismo aplica para los directores.", "year": 2025, "area": "AGF"}, "3.3||vii": {"ans": "Dentro del contexto de gobernanza, el equipo de gestión de riesgo operacional debe presentar mensualmente al comité de riesgos los eventos operacionales, las evaluaciones de procesos y un panel de control que considera las situaciones relevantes que debe tomar en conocimiento el directorio trimestralmente.\nTrimestralmente el gerente de riesgo de credito le presenta  a todos los miembros del comité de riesgos y esas actas se envian al directorio.", "year": 2025, "area": "AGF"}, "3.4||i": {"ans": "Los ejecutivos principales de la Administradora al cierre del ejercicio 2025 son nueve, con sus cargos, RUT, fecha desde la cual desempeñan el cargo y descripción profesional detallados en la memoria: Jorge Venthur (Gerente General, desde el 25-07-2025), Rodrigo Avendaño (Gerente de Compliance y Riesgo Operacional, 01-11-2022), Ivonne Müller (Gerenta de Clientes y Calidad, 01-03-2023), Hernán Fuentes Yurie (Gerente Comercial, 04-10-2022), Pedro Pablo Palma (Gerente de Mercado Institucional, 01-04-2024), Raúl Otárola (Gerente de Operaciones, 12-12-2024), Loreto Cornejo (Gerenta de Gestión de Personas y Sostenibilidad, 16-12-2024), Juan Carlos Truffello (Gerente de Riesgo de Crédito, 07-11-2023) y Andrea Varela (Gerenta de Tecnología y Procesos, 07-06-2025).\n\nNinguno de los ejecutivos principales cuenta con participación accionaria en la Administradora. A la fecha de publicación de la memoria, Pedro Pablo Palma ya no ejercía dicho cargo (nota 10).", "year": 2025, "area": "AGF", "pagina": "41-42"}, "3.4||iv": {"ans": "Los ejecutivos no cuentan con participación accionaria.", "year": 2025, "area": "AGF"}, "3.7||i": {"ans": "La Ley 20.712 establece que los fondos de inversión no rescatables deben celebrar Asambleas Ordinarias de Aportantes al menos una vez al año para conocer y aprobar materias vinculadas a la administración y situación del fondo, incluyendo la aprobación de la cuenta anual y estados financieros, la elección de los miembros del Comité de Vigilancia, la aprobación de su presupuesto y remuneraciones, y la designación de auditores y valorizadores independientes, lo que asegura que los aportantes reciban información relevante sobre la marcha, inversiones, capital y gestión del fondo. Las Asambleas Extraordinarias pueden efectuarse en cualquier momento cuando las necesidades del fondo lo exijan para tratar materias estipuladas por la ley o el reglamento interno, permitiendo a los aportantes pronunciarse sobre asuntos críticos o urgentes que puedan afectar sus intereses. \nEl Comité de Vigilancia, integrado por representantes de los aportantes, tiene atribuciones legales para verificar el cumplimiento de la ley, el reglamento interno y la veracidad, suficiencia y oportunidad de la información entregada por la administradora, y puede proponer a la asamblea la sustitución de la administradora o requerir información específica sobre la gestión, constituyendo un mecanismo interno de fiscalización y transparencia que refuerza la entrega de información relevante sobre los principales riesgos y situación financiera, económica o legal del fondo a los aportante.\nSumado a todo esto, cada cliente tiene designado un(a) ejecutivo para poder resolver cualquier duda relacionada a sus inversiones, por distintos caneles: Electronico, presencial o telefonico.\nVantrust capital además, gestiona sus relaciones con la comunidad por medio de su gerencia de relaciones comunitarias y DEI. Nuestra área de prensa es un servicio externalizado que operamos.", "year": 2025, "area": "AGF"}, "3.7||ii": {"ans": "La gestión y atención de clientes constituyen una responsabilidad fundamental, siendo la gerencia co-\nmercial y los jefes de grupo, a través de los ejecutivos de banca privada, quienes mantienen un elevado \nestándar de calidad en el servicio.\nLos clientes reciben atención personalizada a través de diversos canales, ya sea mediante comunicación \ntelefónica, correo electrónico o en reuniones, tanto presenciales como virtuales. Además, se mantienen \ninformados sobre productos y servicios mediante comunicaciones generadas por áreas especializadas, \nque incluyen a marketing, gestión de clientes y estrategia. Sin perjucio de que cada fondo tiene su pro-\npia denominación, todos son comercializados bajo la marca Vantrust Capital AGF.\nVantrust Capital realizó este año una medición de su Índice de Experiencia del Cliente (CXI) a nivel grupo, \na través de una consultoría externa. Los criterios evaluados incluyeron la experiencia con la compañía, la \nresolución de problemas a clientes, la adaptación de productos a las necesidades de estos, la facilidad y \nsimplicidad de la experiencia, así como la transparencia y el juego limpio. Este análisis arrojó un índice \nfinal de 82 puntos, superando con creces el exigente umbral de una experiencia satisfactoria.", "year": 2025, "area": "AGF"}, "3.7||iii": {"ans": "La sociedad  cuenta con una Política de Elección de Directores, alineada con la NCG 533 y considerando las obligaciones de transparencia de la NCG 555, que define el perfil recomendado de capacidades y diversidad para el Directorio (diversidad de género, profesional y de experiencia) y utiliza una matriz de habilidades como herramienta de apoyo. Ante vacantes, el postulante se somete a aprobación en JEA/JOA; previamente, Compliance realiza debida diligencia (antecedentes, potenciales conflictos de interés y cumplimiento normativo) y, en el marco de la junta, los accionistas conocen y analizan la experiencia, trayectoria y perfil profesional de los candidatos, dejando trazabilidad documental del proceso. La Política se encuentra disponible en el sitio web corporativo. \n En materia de diversidad de género, la Sociedad se rige por la NCG 555 respecto del reporte de información del sexo de los directores electos y, cuando corresponda, de los fundamentos en caso de no verificarse el porcentaje máximo de representación por sexo aplicable. \n Finalmente, si bien el proceso descrito entrega antecedentes que apoyan la decisión de los accionistas, no se contempla una instancia formal de búsqueda que provea nóminas ni una política explícita de nóminas con el criterio de máximo 60% de un mismo sexo.", "year": 2025, "area": "AGF"}, "3.7||iv": {"ans": "el accionista mayoritario es inversiones vnt y este sesiona de manera regulatoria pertinentemente.", "year": 2025, "area": "AGF"}, "4.1||4.1": {"ans": "Nuestras Declaraciones Estratégicas tienen un horizonte a largo plazo, sin embargo, nuestros\nactuales Ejes Estratégicos tienen un horizonte de cinco años, desde 2025 al 2030.\n\n'La compañía no cuenta con activos fijos ni infraestructura propia para desarrollar su actividad.", "year": 2025, "area": "AGF"}, "4.2||i": {"ans": "La Administradora General de Fondos ha definido una estrategia orientada al crecimiento sostenible del negocio, estructurada en torno a los ejes de internacionalización, desarrollo de mandatos ADC, fortalecimiento de los fondos accionarios y alternativos, y crecimiento del patrimonio administrado. La planificación estratégica considera como principales drivers la expansión y diversificación internacional de portafolios y productos, el crecimiento de la base de clientes FO y AP, y la optimización de la cartera de productos, con el objetivo de generar valor de largo plazo para sus clientes. El desempeño de estos ejes estratégicos es monitoreado a través de indicadores clave de gestión, los cuales son definidos, revisados y aprobados por el Directorio. En este marco, la sostenibilidad integrada actúa como un principio transversal que orienta la ejecución de la estrategia y forma parte de los lineamientos supervisados por el gobierno corporativo de la Administradora.", "year": 2025, "area": "AGF"}, "4.3||4.3": {"ans": "Vantrust Capital Administradora General de Fondos S.A. se enfoca activa y continuamente en evaluar oportunidades de crecimiento para mejorar su oferta de productos y fortalecer su plataforma tecnológica, de operaciones y servicio al cliente a largo plazo. \n\nA la fecha de esta memoria, la compañía no tiene un plan de inversiones EN ACTIVOS FIJOS establecido ni de corto ni largo plazo.", "year": 2025, "area": "AGF"}, "6.1||6.1": {"ans": "El entorno económico donde Vantrust Capital Administradora General de Fondos S.A. desarrolla su actividad es la industria de la administración de fondos de inversión, fondos mutuos, administración de carteras y distribución de fondos de terceros.", "year": 2025, "area": "AGF"}, "6.1||i": {"ans": "Vantrust Capital AGF comercializa fondos de inversión tanto públicos como privados, principalmente alternativos y con dos fondos accionarios. Descripción: Tabla5_2025", "year": 2025, "area": "AGF"}, "6.1||ii": {"ans": "La competencia en la industria de administradoras de fondos mutuos y fondos de inversión es alta \ne involucra a entidades tanto bancarias como no bancarias que ofrecen diversos tipos de fondos.", "year": 2025, "area": "AGF"}, "6.1||iii": {"ans": "Este sector se regula bajo las disposiciones normativas de la Ley N° 20.712 o Ley Única de Fondos, Ley 18.045 del Mercado de Valores y las normas, circulares y oficios de la Comisión para el Mercado Financiero (CMF).", "year": 2025, "area": "AGF"}, "6.1||iv": {"ans": "Este sector se regula bajo las disposiciones normativas de la Ley N° 20.712 o Ley Única de Fondos, Ley 18.045 del Mercado de Valores y las normas, circulares y oficios de la Comisión para el Mercado Financiero (CMF).", "year": 2025, "area": "AGF"}, "6.1||v": {"ans": "Proceso de materialidad\na) Contexto organizacional e identificación de grupos de interés\n\nEn un principio, se usaron herramientas de diálogo en el proceso de análisis organizacional con el equipo de gestión de personas. Como etapa inicial, se llevaron a cabo reuniones con los responsables de \nrecursos humanos para comprender la estructura organizacional, así como los productos y servicios que generan mayor valor dentro de Vantrust Capital. Luego, se identificaron los procesos clave de la empresa, colaborando estrechamente con las áreas estratégicas y aplicando estos procesos en el contexto de la Administradora. \nDespués, se coordinó con todas las gerencias para involucrar a sus respectivos equipos en la identificación de grupos de interés, donde se detalló que incluyeran específicamente sus stakeholders, estableciendo contacto directo con ellos. Este enfoque permitió comprender el contexto empresarial y fortalecer las relaciones con los grupos de interés, con el objetivo de construir confianza y lealtad a lo largo del tiempo.\n\nEn este proceso se contemplaron como stakeholders a: clientes, colaboradores, directores, entidades reguladoras y publicas, proveedores, medios de comunicación, empresas financiadas y la comunidad. Una vez recolectadas y analizadas todas las respuestas, la lista de temas ya ordenados por priorización según los grupos de interés de la Administradora se complementa con aquellos aspectos que la misma organización considera relevante manejar en términos ASG. Finalmente, esta priorización es aprobada por el Comité de Sostenibilidad del Grupo Vantrust Capital.", "year": 2025, "area": "AGF"}, "6.1||vi": {"ans": "A nivel nacional e internacional, como grupo Vantrust Capital nos hemos adherido a los siguientes acuerdos relacionados al giro del grupo:\nPRI; ACUERDO VERDE\nMientras que somos miembros de  ACAFI por parte de la Administradora y de GSG como grupo Vantrust Capital.", "year": 2025, "area": "AGF"}, "6.2||6.2": {"ans": "El negocio principal de la Administradora consiste en la administración y gestión de activos financieros. A través de la administración de Fondos de Inversión, tanto públicos como privados, así como de la gestión no discrecional de carteras, y distribución internacional.  la Compañía busca generar valor a largo plazo para sus clientes. Sin embargo, Vantrust Capital Administradora General de Fondos S.A. no presenta \ninformación por segmentos en función de la información financiera puesta a disposición de los tomadores de decisión, de acuerdo a lo indicado en NIIF 8 Información Financiera por Segmentos.", "year": 2025, "area": "AGF"}, "6.2||i": {"ans": "Reportar toda la Tabla5_2025 en hoja \"Indicadores 2025\"", "year": 2025, "area": "AGF"}, "6.2||ii": {"ans": "La difusión y distribución de la mayoría de nuestros productos se hace por atención personalizada a través de diversos canales, ya sea mediante comunicación telefónica, correo electrónico o en reuniones, tanto presenciales como virtuales.", "year": 2025, "area": "AGF"}, "6.2||iv": {"ans": "En Vantrust Capital Administradora General de Fondos no existen clientes que en forma individual concentren al menos un 10% del ingreso del segmento.", "year": 2025, "area": "AGF"}, "6.2||v": {"ans": "La principal marca utilizada para la comercialización de los productos es Vantrust Capital Administradora General de Fondos", "year": 2025, "area": "AGF"}, "6.2||vi": {"ans": "No Aplica", "year": 2025, "area": "AGF"}, "6.2||vii": {"ans": "No aplica", "year": 2025, "area": "AGF"}, "6.2||viii": {"ans": "Vantrust Capital AGF es susceptible a distintos factores externos que afectan el desarrollo del negocio, principalmente los regulatorios, políticos y económicos. La regulación, tanto por parte de la Comisión para el Mercado Financiero cómo por los legisladores, es la que establece un marco de acción y las condiciones en las que la Administradora puede realizar su operación. A su vez, las decisiones políticas que se tomen a nivel país, que guían a las empresas a actuar en función de lo acordado, junto con aquellos acuerdos adoptados para la reducción de la temperatura global del planeta, entre otros.\nVantrust Capital AGF cada vez es más consciente de su rol con la sociedad y el medioambiente busca generar un impacto positivo tanto en lo interno, como son los colaboradores, como en lo externo, como son las comunidades. Al estar desarrollando un enfoque sostenible en sus inversiones, la Administradora cubre lo antes mencionado, además de una serie de acciones por el medioambiente y el calentamiento global. Esta filosofía se refleja en cada proyecto que emprendemos, donde la sostenibilidad y la responsabilidad social son pilares fundamentales.\nEl clima económico tanto local como global también juega un rol importante en el desarrollo de los negocios de la empresa. Las políticas ecómicas que toman los bancos centrales y gobiernos de los distintos países afectan directamente la demanda y proporcionan los incentivos para ajustar nuestra oferta de una manera acorde a los intreses de nuestros clientes.\n\nPrincipales tendencias y factores que moldean la administración de fondos:\n•  Panorama global y geopolítico\n• Expansión del mercado de activos alternativos, tales como los mercados privados.\n• Digitalización para mejorar la eficiencia operativa.\n• Integración de consideraciones ASG\n- Tasa de política monetaria y contexto macroeconomico\n• Costos de administración.\n• Cambios regulatorios.", "year": 2025, "area": "AGF"}, "6.4||6.4": {"ans": "Dirección1\nCerro El Plomo 5420, piso 18 , Las Condes.\n 1. La sociedad arrienda sus oficinas a Inversiones VNT S.A. Además, Vantrust \nCapital Administradora General de Fondos no posee ninguna subsidiaria.", "year": 2025, "area": "AGF"}, "6.4||i": {"ans": "Dirección1\nCerro El Plomo 5420, piso 18 , Las Condes.\n 1. La sociedad arrienda sus oficinas a Inversiones VNT S.A. Además, Vantrust \nCapital Administradora General de Fondos no posee ninguna subsidiaria.", "year": 2025, "area": "AGF"}, "6.4||ii": {"ans": "'No aplica", "year": 2025, "area": "AGF"}, "6.4||iii": {"ans": "Dirección1\nCerro El Plomo 5420, piso 18 , Las Condes.\n 1. La sociedad arrienda sus oficinas a Inversiones VNT S.A. Además, Vantrust \nCapital Administradora General de Fondos no posee ninguna subsidiaria.", "year": 2025, "area": "AGF"}, "6.5.1||6.5.1": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||i": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||ii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||iii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||iv": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||v": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||vi": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||vii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||viii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||ix": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.1||x": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.2||6.5.2": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.2||i": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.2||ii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.2||iii": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "6.5.2||iv": {"ans": "No aplica. La AGF no tiene subsidiarias.", "year": 2025, "area": "AGF"}, "3.1||vi": {"ans": "La empresa cuenta con acciones que permiten detectar y reducir barreras organizacionales, sociales y culturales que pudieran limitar la expresión natural de la diversidad de capacidades, condiciones, experiencias y visiones dentro de la organización. Estas acciones incluyen políticas formales, prácticas de gestión y mecanismos de evaluación que permiten identificar brechas y realizar correcciones al respecto.\n1.\tMarco normativo que promueve la igualdad y la no discriminación\nContamos con una Política de Diversidad e Inclusión que establece compromisos explícitos de no discriminación y de igualdad de oportunidades, asegurando que todas las personas tengan acceso equitativo al ingreso, desarrollo y participación en la empresa. Esta política se complementa con nuestra Política de Derechos Humanos, que refuerza el respeto y la protección de la dignidad de todas las personas, evitando prácticas que puedan generar exclusión o trato desigual.\n2.\tProcesos de reclutamiento y selección libres de sesgos\nNuestras prácticas de reclutamiento y selección están diseñadas bajo un enfoque de competencias para el desempeño del cargo, evitando cualquier criterio que refiera a condiciones personales no relacionadas con el puesto. Esto se declara explícitamente en cada publicación de búsqueda, lo que aporta a promover transparencia y reducir barreras que históricamente han afectado a ciertos grupos. Además, la revisión anual de estos procesos permite detectar sesgos no intencionales y aplicar mejoras continuas, como la búsqueda intencional de personas que permitan incorporar diversidad en el equipo de trabajo cuando hay vacantes. \n3.\tBeneficios y políticas de gestión de personas transversales\nLa empresa dispone de beneficios que se aplican de manera transversal, sin distinciones arbitrarias, así como políticas de gestión de personas que garantizan trato equitativo en materias como desarrollo profesional, compensaciones, calidad de vida, flexibilidad y bienestar. Esto contribuye a reducir posibles barreras organizacionales o culturales que afecten diferentemente a ciertas personas o grupos.\n4.\tMecanismos de diagnóstico y participación\nRealizamos evaluaciones anuales que permiten obtener información sobre posibles barreras que se pudieran estar dando en la empresa. Una medición que aplicamos año a año es el Barómetro de Valores e Integridad Organizacional que nos entrega oportunidades de mejora que no siempre son visibles en los procesos formales.\n5.\tFormación en diversidad, inclusión y liderazgo consciente\nPara asegurar que la cultura interna acompañe las políticas, impulsamos capacitaciones orientadas a reconocer sesgos inconscientes, gestionar equipos diversos y fortalecer conductas inclusivas, especialmente en liderazgos y en roles clave de toma de decisiones. Durante este año realizamos acciones de capacitación relacionadas con promover un ambiente de trabajo respetuoso y de buen trato e impulsar una cultura de integridad organizacional, realizando un Taller de Dilemas Éticos dirigido específicamente a lo(a)s Lideres de la empresa, incluido el Directorio.", "year": 2025, "area": "Gestión de Personas"}, "3.1||vii": {"ans": "En la empresa identificamos la diversidad de capacidades, conocimientos, condiciones, experiencias y visiones necesarias para el desempeño en los distintos niveles de la organización a través de un proceso de atracción de talento formal e inclusivo.\nPara atraer y preservar esta diversidad, la organización se rige por su Política de Reclutamiento y Selección, cuyo objetivo es incorporar candidatos y candidatas que cumplan con los requisitos técnicos definidos, independientemente de sus condiciones personales. El proceso contempla una evaluación integral que incluye revisión de antecedentes curriculares, entrevistas psicolaborales realizadas por jefaturas, gerencias y Gestión de Personas, y, en algunos casos, la aplicación de pruebas psicométricas que permiten valorar objetivamente las competencias requeridas. \nNuestra política garantiza transparencia, equidad e igualdad de oportunidades en todas las etapas, promoviendo un ambiente inclusivo que favorece la innovación, la integridad, la creatividad, el trabajo colaborativo y el compromiso organizacional. Asimismo, la empresa realiza un esfuerzo consciente por cubrir cada vacante —ya sea mediante nuevos ingresos o movimientos internos— incorporando personas que enriquezcan la diversidad del equipo al cual se integrarán, asegurando así un talento diverso y alineado con nuestra cultur
